    for (const h of rays.hits) {
      if (!h || typeof h.x !== 'number') continue;
      if (n++ > 60) break;
      const p = toPx(h.x, h.y);
      ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  // ------------------------------------------------------------------ drawing: probes
  /** Emission frame for the probe: {x, y, tangent, normal}. */
  function emissionAt(sp, probe) {
    try { return UT.specimens.scanSurfaceAt(sp, probe); } catch (e) { return { x: probe.x, y: 0, tangent: { x: 1, y: 0 }, normal: { x: 0, y: 1 } }; }
  }

  /**
   * Draw a probe shoe at emission point E (mm) with local frame (tangent t, normal n into the metal).
   * Angle probes: "house" pentagon 24×14 mm sloped at the wedge angle; 0°: square 20×18 mm.
   */
  function drawShoe(ctx, E, t, n, side, der, colour, hollow, opts) {
    const o = opts || {};
    const map = function (u, v) { return toPx(E.x + u * t.x + v * n.x, E.y + u * t.y + v * n.y); };
    const isZero = !der.refracted || der.refracted === 0 || o.zero;
    ctx.save();
    ctx.lineJoin = 'miter';
    if (isZero) {
      const w = der.shoeWidth || 20, h = der.shoeHeight || 18;
      const pts = [map(-w / 2, 0), map(w / 2, 0), map(w / 2, -h), map(-w / 2, -h)];
      ctx.beginPath(); pts.forEach(function (p, i) { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); }); ctx.closePath();
      if (!hollow) { ctx.fillStyle = colour; ctx.fill(); }
      ctx.strokeStyle = hollow ? colour : '#202020'; ctx.lineWidth = hollow ? 2 : 1; ctx.stroke();
      // centre tick + twin divider
      ctx.strokeStyle = hollow ? colour : '#202020'; ctx.lineWidth = 1;
      const c0 = map(0, -h), c1 = map(0, -h + 4);
      ctx.beginPath(); ctx.moveTo(c0.x, c0.y); ctx.lineTo(c1.x, c1.y); ctx.stroke();
      if (der.crystal === 'twin') { const d0 = map(0, 0), d1 = map(0, -h); ctx.setLineDash([2, 2]); ctx.beginPath(); ctx.moveTo(d0.x, d0.y); ctx.lineTo(d1.x, d1.y); ctx.stroke(); ctx.setLineDash([]); }
      // cyan contact line
      const l0 = map(-w / 2, 0), l1 = map(w / 2, 0);
      ctx.strokeStyle = '#00e0ff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(l0.x, l0.y); ctx.lineTo(l1.x, l1.y); ctx.stroke();
    } else {
      const w = der.shoeWidth || 24, h = der.shoeHeight || 14;
      const half = w / 2;
      const run = M.clamp(h * Math.tan(M.deg2rad(der.wedgeAngle || 45)), 4, w * 0.75);
      const front = -side * half, back = side * half;
      const pts = [map(front, 0), map(back, 0), map(back, -h), map(front + side * run, -h)];
      ctx.beginPath(); pts.forEach(function (p, i) { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); }); ctx.closePath();
      if (!hollow) { ctx.fillStyle = colour; ctx.fill(); }
      ctx.strokeStyle = hollow ? colour : '#202020'; ctx.lineWidth = hollow ? 2 : 1; ctx.stroke();
      // short green index line beneath the index point
      const i0 = map(0, 0), i1 = map(0, 2.5);
      ctx.strokeStyle = '#00c000'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(i0.x, i0.y); ctx.lineTo(i1.x, i1.y); ctx.stroke();
    }
    ctx.restore();
  }

  function tofdProbes(st, der) {
    const pcs = (st.tofd && st.tofd.pcs) || 60;
    const px = st.probe.x || 0;
    let tx = { x: px + pcs / 2, side: 1 }, rx = { x: px - pcs / 2, side: -1 };
    try {
      const pp = UT.tofd && UT.tofd.probePositions ? UT.tofd.probePositions(st) : null;
      const norm = function (v, dflt) { if (v === null || v === undefined) return dflt; if (typeof v === 'number') return { x: v, side: dflt.side }; return { x: typeof v.x === 'number' ? v.x : dflt.x, side: v.side || dflt.side }; };
      if (Array.isArray(pp) && pp.length >= 2) { tx = norm(pp[0], tx); rx = norm(pp[1], rx); }
      else if (pp && typeof pp === 'object') { tx = norm(pp.tx, tx); rx = norm(pp.rx, rx); }
    } catch (e) { /* fallback */ }
    if (tx.x < rx.x) { tx.side = -1; rx.side = 1; } else { tx.side = 1; rx.side = -1; }
    void der;
    return { tx, rx };
  }

  function drawProbes(ctx, frame, st, sp, der, E) {
    const probe = st.probe;
    const colour = der.colour || '#00c000';
    const t = E.tangent || { x: 1, y: 0 }, n = E.normal || { x: 0, y: 1 };
    if (st.mode === 'tofd') {
      const pp = tofdProbes(st, der);
      const a = (st.tofd && st.tofd.txAngle) || 60;
      const wa = UT.probe.wedgeAngleFor ? UT.probe.wedgeAngleFor(a, 'comp', der.vWedge || 2.74, sp.material) : 24;
      const d2 = Object.assign({}, der, { refracted: a, wedgeAngle: wa, shoeWidth: 24, shoeHeight: 14 });
      const col = C.PROBE_COLOURS[a] || colour;
      // lateral wave: 2 px yellow line along the surface between the two index points
      const l0 = toPx(pp.tx.x, 0), l1 = toPx(pp.rx.x, 0);
      ctx.save(); ctx.strokeStyle = '#ffe000'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(l0.x, l0.y); ctx.lineTo(l1.x, l1.y); ctx.stroke(); ctx.restore();
      drawShoe(ctx, { x: pp.tx.x, y: 0 }, { x: 1, y: 0 }, { x: 0, y: 1 }, pp.tx.side, d2, col, false);
      drawShoe(ctx, { x: pp.rx.x, y: 0 }, { x: 1, y: 0 }, { x: 0, y: 1 }, pp.rx.side, d2, col, true);
      return;
    }
    const side = probe.side || 1;
    const theta = der.refracted || 0;
    const T = sp.T || 20;
    if (probe.method === 'tt') {
      // receiver on the opposite surface where the centre ray exits (hollow, mirrored)
      const xr = E.x - side * T * Math.tan(M.deg2rad(theta));
      drawShoe(ctx, { x: xr, y: T }, { x: 1, y: 0 }, { x: 0, y: -1 }, -side, der, colour, true);
    } else if (probe.method === 'tandem') {
      const xr = E.x - side * T * Math.tan(M.deg2rad(theta));
      drawShoe(ctx, { x: xr, y: 0 }, t, n, side, der, colour, true);
    }
    drawShoe(ctx, E, t, n, side, der, colour, false);
  }

  // ------------------------------------------------------------------ drawing: ruler, labels, caption
  function drawDepthRuler(ctx, sp) {
    if (!sp || !sp.extents) return;
    const xf = S.xf;
    const yMax = sp.extents.yMax;
    const x0 = Math.max(xf.ox + sp.extents.xMin * xf.scale, 0) + 16;
    ctx.save();
    ctx.strokeStyle = COL.ruler; ctx.fillStyle = COL.ruler; ctx.lineWidth = 1;
    ctx.font = FONT_SMALL; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const top = toPx(0, 0).y, bot = toPx(0, yMax).y;
    ctx.beginPath(); ctx.moveTo(x0 + 0.5, top); ctx.lineTo(x0 + 0.5, bot); ctx.stroke();
    for (let d = 0; d <= yMax + 1e-6; d += 5) {
      const y = Math.round(toPx(0, d).y) + 0.5;
      const len = d % 10 === 0 ? 10 : 6;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + len, y); ctx.stroke();
      if (d % 10 === 0) ctx.fillText(String(d), x0 + 14, d === 0 ? y - 6 : y);
    }
    ctx.restore();
  }

  function drawLabels(ctx, sp, skipCaption) {
    if (!sp || !sp.labels) return;
    ctx.save();
    ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const l of sp.labels) {
      if (!l || !l.text) continue;
      if (skipCaption && l.text === 'CROSS SECTION') continue;
      if (sp.id === 'iow' && /mm$/.test(l.text)) continue;      // iow depth labels are drawn on the guide lines
      ctx.font = l.big ? 'bold 26px "Segoe UI", Arial, sans-serif' : (l.small ? FONT_SMALL : 'bold 13px "Segoe UI", Arial, sans-serif');
      const p = toPx(l.x, l.y);
      ctx.fillText(l.text, p.x, p.y);
    }
    ctx.restore();
  }

  function drawCaption(ctx, sp, W) {
    ctx.save();
    ctx.fillStyle = '#000'; ctx.font = FONT; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    const right = sp && sp.extents ? Math.min(W - 8, toPx(sp.extents.xMax, 0).x - 12) : W - 12;
    ctx.fillText('CROSS SECTION', right, toPx(0, 0).y - 6);
    ctx.restore();
  }

  // ------------------------------------------------------------------ normal cross-section frame
  function drawNormal(ctx, frame, st, W, H) {
    const sp = st.specimen;
    ctx.fillStyle = COL.cream; ctx.fillRect(0, 0, W, H);
    if (!sp) return;
    const der = derivedOf(frame, st);
    drawSpecimen(ctx, sp);
    drawHoles(ctx, sp);
    drawPerspex(ctx, sp);
    drawSlot(ctx, sp);
    drawIowGuides(ctx, sp);
    if (!st.display.hide) drawDefects(ctx, st);
    drawStroke(ctx);
    const E = emissionAt(sp, st.probe);
    if (der) {
      drawBeam(ctx, frame, st, sp, der, E);
      drawHits(ctx, frame, st);
      drawProbes(ctx, frame, st, sp, der, E);
    }
    drawDepthRuler(ctx, sp);
    drawLabels(ctx, sp, true);
    drawCaption(ctx, sp, W);
  }

  // ------------------------------------------------------------------ oblique V1/V2 block screen (§14.8)
  function wideSpecFor(st) {
    const id = st.specimen.id;
    if (!S.obSpecs[id]) S.obSpecs[id] = id === 'v2' ? UT.specimens.v2({ face: 'wide' }) : UT.specimens.v1({ face: 'wide' });
    return S.obSpecs[id];
  }
  function narrowDepthFor(st) { return st.specimen.id === 'v2' ? 12.5 : 25; }

  /** Pure oblique layout: front face = wide view, top band sheared 30° up-right by `depth`. */
  function computeOblique(wide, depth, W, H) {
    const ex = wide.extents;
    const cos30 = Math.cos(Math.PI / 6), sin30 = 0.5;
    const xSpan = (ex.xMax - ex.xMin) + depth * cos30;
    const ySpan = (ex.yMax - ex.yMin) + depth * sin30;
    const sc = Math.min((W - 80) / xSpan, (H - 90) / ySpan, 8);
    const ox = 40 - ex.xMin * sc;
    const oy = 70 + depth * sin30 * sc - ex.yMin * sc;
    const sh = { x: depth * cos30 * sc, y: -depth * sin30 * sc };
    const top = wide.edges.filter(function (e) { return e.tag === 'top'; });
    let tx0 = ex.xMin, tx1 = ex.xMax;
    if (top.length) { tx0 = Math.min.apply(null, top.map(function (e) { return Math.min(e.a.x, e.b.x); })); tx1 = Math.max.apply(null, top.map(function (e) { return Math.max(e.a.x, e.b.x); })); }
    const A = { x: ox + tx0 * sc, y: oy }, B = { x: ox + tx1 * sc, y: oy };
    const band = [A, B, { x: B.x + sh.x, y: B.y + sh.y }, { x: A.x + sh.x, y: A.y + sh.y }];
    const front = wide.outline.map(function (p) { return { x: ox + p.x * sc, y: oy + p.y * sc }; });
    return { sc, ox, oy, sh, band, front, tx0, tx1, depth, W, H, id: wide.id, T: ex.yMax - ex.yMin, yMax: ex.yMax };
  }

  function bandPoint(ob, x, frac) { return { x: ob.ox + x * ob.sc + ob.sh.x * frac, y: ob.oy + ob.sh.y * frac }; }

  /** Which face / position (mm) is under a canvas point in oblique mode. */
  function obliquePick(ob, px, py) {
    const zWide = ob.depth;
    if (M.pointInPolygon(px, py, ob.band)) {
      const frac = M.clamp((py - ob.oy) / ob.sh.y, 0, 1);
      const x = M.clamp((px - ob.ox - ob.sh.x * frac) / ob.sc, ob.tx0, ob.tx1);
      return { face: 'wide', x, z: frac * zWide };
    }
    if (M.pointInPolygon(px, py, ob.front)) {
      return { face: 'narrow', x: M.clamp((px - ob.ox) / ob.sc, ob.tx0, ob.tx1), z: M.clamp((py - ob.oy) / ob.sc, 0, ob.T) };
    }
    if (py < ob.oy) {
      const frac = M.clamp((py - ob.oy) / ob.sh.y, 0, 1);
      return { face: 'wide', x: M.clamp((px - ob.ox - ob.sh.x * frac) / ob.sc, ob.tx0, ob.tx1), z: frac * zWide };
    }
    return { face: 'narrow', x: M.clamp((px - ob.ox) / ob.sc, ob.tx0, ob.tx1), z: M.clamp((py - ob.oy) / ob.sc, 0, ob.T) };
  }

  function drawCable(ctx, from, dx, dy) {
    ctx.save();
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(from.x, from.y);
    ctx.bezierCurveTo(from.x + dx * 0.2, from.y + dy * 0.9, from.x + dx * 0.6, from.y + dy * 0.6, from.x + dx, from.y + dy);
    ctx.stroke();
    ctx.restore();
  }

  function drawObliqueProbe(ctx, ob, st, pos) {
    const isZero = (st.probe.angle || 0) === 0;
    const sc = ob.sc;
    if (pos.face === 'wide') {
      const B = bandPoint(ob, pos.x, M.clamp(pos.z / ob.depth, 0.05, 0.95));
      if (isZero) {
        const r = 10 * sc, h = 14 * sc, ry = r * 0.45;
        ctx.save();
        ctx.fillStyle = '#d000d0'; ctx.strokeStyle = '#500050'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(B.x - r, B.y); ctx.lineTo(B.x - r, B.y - h); ctx.lineTo(B.x + r, B.y - h); ctx.lineTo(B.x + r, B.y); ctx.ellipse(B.x, B.y, r, ry, 0, 0, Math.PI); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ff40ff';
        ctx.beginPath(); ctx.ellipse(B.x, B.y - h, r, ry, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.restore();
        drawCable(ctx, { x: B.x, y: B.y - h }, 140, -50);
      } else {
        const w = 24 * sc, h = 14 * sc;
        const dv = { x: ob.sh.x * (10 / ob.depth), y: ob.sh.y * (10 / ob.depth) };
        const fr = [{ x: B.x - w / 2, y: B.y }, { x: B.x + w / 2, y: B.y }, { x: B.x + w / 2, y: B.y - h }, { x: B.x - w / 2, y: B.y - h }];
        const poly = function (pts, fill) { ctx.beginPath(); pts.forEach(function (p, i) { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); }); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.stroke(); };
        ctx.save();
        ctx.strokeStyle = '#0a1a60'; ctx.lineWidth = 1;
        poly([fr[1], fr[2], { x: fr[2].x + dv.x, y: fr[2].y + dv.y }, { x: fr[1].x + dv.x, y: fr[1].y + dv.y }], '#0d2a99');
        poly([fr[3], fr[2], { x: fr[2].x + dv.x, y: fr[2].y + dv.y }, { x: fr[3].x + dv.x, y: fr[3].y + dv.y }], '#4a6fff');
        poly(fr, '#1a3fd6');
        ctx.restore();
        drawCable(ctx, { x: B.x + dv.x * 0.5, y: B.y - h + dv.y * 0.5 }, 150, -48);
      }
    } else {
      const c = { x: ob.ox + pos.x * sc, y: ob.oy + pos.z * sc };
      if (isZero) {
        const r = 10 * sc;
        const off = { x: 0.45 * r, y: -0.3 * r };
        ctx.save();
        ctx.strokeStyle = '#500050'; ctx.lineWidth = 1;
        ctx.fillStyle = '#b000b0';
        ctx.beginPath(); ctx.arc(c.x + off.x, c.y + off.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        // body between the two discs
        const a = Math.atan2(off.y, off.x) + Math.PI / 2;
        ctx.fillStyle = '#c800c8';
        ctx.beginPath();
        ctx.moveTo(c.x + r * Math.cos(a), c.y + r * Math.sin(a));
        ctx.lineTo(c.x + off.x + r * Math.cos(a), c.y + off.y + r * Math.sin(a));
        ctx.lineTo(c.x + off.x - r * Math.cos(a), c.y + off.y - r * Math.sin(a));
        ctx.lineTo(c.x - r * Math.cos(a), c.y - r * Math.sin(a));
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ff00ff';
        ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.restore();
        drawCable(ctx, { x: c.x + off.x, y: c.y + off.y - r }, -60, -90);
      } else {
        const w = 24 * sc, h = 14 * sc;
        ctx.save();
        ctx.fillStyle = '#1a3fd6'; ctx.strokeStyle = '#0a1a60'; ctx.lineWidth = 1;
        ctx.fillRect(c.x - w / 2, c.y - h / 2, w, h); ctx.strokeRect(c.x - w / 2, c.y - h / 2, w, h);
        ctx.fillStyle = '#4a6fff'; ctx.fillRect(c.x - w / 2, c.y - h / 2, w, h * 0.28);
        ctx.restore();
        drawCable(ctx, { x: c.x + w * 0.3, y: c.y - h / 2 }, 90, -80);
      }
    }
  }

  function drawOblique(ctx, frame, st, W, H) {
    const sp = st.specimen;
    ctx.fillStyle = COL.cream; ctx.fillRect(0, 0, W, H);
    const wide = wideSpecFor(st);
    const depth = narrowDepthFor(st);
    const ob = computeOblique(wide, depth, W, H);
    S.ob = ob;
    const sc = ob.sc;
    const F = function (x, y) { return { x: ob.ox + x * sc, y: ob.oy + y * sc }; };
    ctx.save();
    ctx.lineJoin = 'round';
    // right side face (vertical right end edge, if any)
    const ex = wide.extents;
    const rightEdge = wide.edges.find(function (e) { return Math.abs(e.a.x - ex.xMax) < 1e-6 && Math.abs(e.b.x - ex.xMax) < 1e-6; });
    if (rightEdge) {
      const a = F(rightEdge.a.x, rightEdge.a.y), b = F(rightEdge.b.x, rightEdge.b.y);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(b.x + ob.sh.x, b.y + ob.sh.y); ctx.lineTo(a.x + ob.sh.x, a.y + ob.sh.y); ctx.closePath();
      ctx.fillStyle = '#6a6a6a'; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
    }
    // top band
    ctx.beginPath(); ob.band.forEach(function (p, i) { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); }); ctx.closePath();
    ctx.fillStyle = '#a9a9a9'; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
    // front face
    ctx.beginPath(); ob.front.forEach(function (p, i) { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); }); ctx.closePath();
    ctx.fillStyle = COL.steel; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
    // Perspex insert + hole
    if (wide.perspex) { const p = F(wide.perspex.x, wide.perspex.y); ctx.beginPath(); ctx.arc(p.x, p.y, wide.perspex.r * sc, 0, Math.PI * 2); ctx.fillStyle = '#d8d8d8'; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke(); }
    for (const h of wide.holes || []) { const p = F(h.x, h.y); ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(h.r * sc, 3), 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke(); }
    // narrow-face hole (V2 5 mm hole) shown on the front face when the physics face is narrow
    if (sp.face === 'narrow') for (const h of sp.holes || []) { const p = F(h.x, h.y); ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(h.r * sc, 3), 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke(); }
    // V1 slot notch on the front face at the arc centre
    if (wide.retroSlot) {
      const sl = wide.slot || { x: 100, w: 2, d: 5 };
      const a = F(sl.x - sl.w / 2, 0), b = F(sl.x + sl.w / 2, sl.d);
      ctx.fillStyle = COL.cream; ctx.fillRect(a.x, a.y, b.x - a.x, b.y - a.y);
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(a.x, b.y); ctx.lineTo(b.x, b.y); ctx.lineTo(b.x, a.y); ctx.stroke();
      // index tick + '0' on the top band
      const t0 = bandPoint(ob, sl.x, 0), t1 = bandPoint(ob, sl.x, 1);
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(t0.x, t0.y); ctx.lineTo(t1.x, t1.y); ctx.stroke();
      ctx.fillStyle = '#000'; ctx.font = 'bold 13px "Segoe UI", Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText('0', t1.x, t1.y - 3);
    } else {
      const ix = wide.id === 'v2' ? 60 : 100;
      const t0 = bandPoint(ob, ix, 0), t1 = bandPoint(ob, ix, 1);
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(t0.x, t0.y); ctx.lineTo(t1.x, t1.y); ctx.stroke();
      ctx.fillStyle = '#000'; ctx.font = 'bold 13px "Segoe UI", Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText('0', t1.x, t1.y - 3);
    }
    // labels on the front face
    ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const l of wide.labels || []) {
      if (!l || !l.text || l.text === '0') continue;
      ctx.font = l.big ? 'bold 28px "Segoe UI", Arial, sans-serif' : (l.small ? FONT_SMALL : FONT);
      const p = F(l.x, l.y); ctx.fillText(l.text, p.x, p.y);
    }
    // caption
    ctx.font = '20px "Segoe UI", Arial, sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    const cap = 'Carbon Steel Block';
    const tw = ctx.measureText(cap).width;
    ctx.fillStyle = '#dcdcdc'; ctx.fillRect(W - 24 - tw - 8, 10, tw + 16, 28);
    ctx.fillStyle = '#000'; ctx.fillText(cap, W - 24, 14);
    ctx.restore();
    // probe (ghost position while dragging across faces)
    const pos = S.ghost || { face: sp.face === 'narrow' ? 'narrow' : 'wide', x: st.probe.x, z: st.probe.z };
    drawObliqueProbe(ctx, ob, st, pos);
  }

  // ------------------------------------------------------------------ public draw
  /**
   * Draw the cross-section from a frame and the state. Tolerates null frame parts / specimen.
   * @param {object} frame UT.frame
   * @param {object} st UT.state
   */
  function draw(frame, st) {
    const cv = S.canvas;
    if (!cv) return;
    S.lastFrame = frame;
    const ctx = UT.dom.fitCanvas(cv);
    const W = cssW(cv), H = cssH(cv);
    ctx.save();
    try {
      if (isOblique(st)) { drawOblique(ctx, frame, st, W, H); }
      else { S.ob = null; ensureTransform(st); drawNormal(ctx, frame, st, W, H); }
    } finally { ctx.restore(); }
  }

  /** Draw the X ruler (cv-ruler) with the shared scale; unsigned labels for centred specimens. */
  function drawRuler(st) {
    const cv = S.ruler;
    if (!cv) return;
    const ctx = UT.dom.fitCanvas(cv);
    const W = cssW(cv), H = cssH(cv);
    ctx.save();
    ctx.fillStyle = COL.cream; ctx.fillRect(0, 0, W, H);
    const sp = st && st.specimen;
    if (!sp || isOblique(st)) { ctx.restore(); return; }
    const xf = S.canvas ? (S.xf || ensureTransform(st)) : computeTransform(sp, W, H);
    const unsigned = sp.extents.xMin < 0;
    const mmAt = function (px) { return (px - xf.ox) / xf.scale; };
    const x0 = Math.ceil(mmAt(0) / 2) * 2, x1 = Math.floor(mmAt(W) / 2) * 2;
    ctx.strokeStyle = COL.ruler; ctx.fillStyle = COL.ruler; ctx.lineWidth = 1;
    ctx.font = FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    const base = 1;
    ctx.beginPath(); ctx.moveTo(0, base + 0.5); ctx.lineTo(W, base + 0.5); ctx.stroke();
    for (let x = x0; x <= x1; x += 2) {
      const px = Math.round(xf.ox + x * xf.scale) + 0.5;
      const ten = Math.abs(x) % 10 === 0;
      const len = ten ? 11 : 5;
      ctx.beginPath(); ctx.moveTo(px, base); ctx.lineTo(px, base + len); ctx.stroke();
      if (ten) ctx.fillText(String(unsigned ? Math.abs(x) : x), px, H - 4);
    }
    // blue probe marker
    const pxp = xf.ox + (st.probe.x || 0) * xf.scale;
    ctx.fillStyle = '#0000ff';
    ctx.fillRect(pxp - 1.5, 0, 3, 12);
    ctx.restore();
  }

  // ------------------------------------------------------------------ interaction
  function clampX(sp, x) {
    const ss = sp && sp.scanSurface ? sp.scanSurface : { xMin: -150, xMax: 150 };
    return M.clamp(x, ss.xMin, ss.xMax);
  }
  function clampZ(sp, z) {
    const L = (sp && sp.L) || 300;
    if (sp && sp.pipe) { let w = z % L; if (w < 0) w += L; return w; }
    return M.clamp(z, 0, L);
  }
  function brushActive(st) { return !!((st.editing && st.editing.defect) || S.brush.on); }
  function brushPx(st) {
    const e = st.editing || {};
    return e.brushPx || e.brushSize || S.brush.px || 26;
  }

  function setCursorMm(mm, view) {
    const cur = state().cursor || {};
    if (mm === null) { if (cur.view === 'cross' || cur.x !== null) UT.set({ cursor: { x: null, y: null, view: null } }, { noRender: true }); S.hoverMm = null; return; }
    if (S.hoverMm && Math.abs(S.hoverMm.x - mm.x) < 0.05 && Math.abs(S.hoverMm.y - mm.y) < 0.05) return;
    S.hoverMm = mm;
    UT.set({ cursor: { x: +mm.x.toFixed(1), y: +mm.y.toFixed(1), view: view || 'cross' } }, { noRender: true });
  }

  function defectAt(st, mm) {
    const tol = 3;
    let best = null, bestD = tol;
    for (const d of st.defects || []) {
      if (!d || !d.pts || d.pts.length < 2) continue;
      if (!isPlanarType(d.type) && M.pointInPolygon(mm.x, mm.y, d.pts)) return d;
      for (let i = 0; i < d.pts.length - 1; i++) {
        const r = M.pointSegment(mm.x, mm.y, d.pts[i].x, d.pts[i].y, d.pts[i + 1].x, d.pts[i + 1].y);
        if (r.d < bestD) { bestD = r.d; best = d; }
      }
    }
    return best;
  }

  function moveProbeTo(st, mm, shiftZ, dragRef) {
    const sp = st.specimen;
    if (!sp) return;
    const probe = st.probe;
    if (shiftZ && dragRef) {
      const z = clampZ(sp, dragRef.z0 + (mm.y - dragRef.y0));
      if (Math.abs(z - probe.z) > 1e-6) UT.setIn('probe', { z: +z.toFixed(1) });
      return;
    }
    let x;
    if (sp.tky && probe.surface === 'brace') {
      const ss = emissionAt(sp, { x: 0, surface: 'brace' });
      x = M.clamp((mm.x - ss.x) * ss.tangent.x + (mm.y - ss.y) * ss.tangent.y, 0, Math.max(10, (sp.tky.braceLen || 90) - 30));
    } else {
      x = clampX(sp, mm.x);
    }
    x = +x.toFixed(1);
    if (Math.abs(x - probe.x) > 1e-6) UT.setIn('probe', { x });
  }

  function endStroke(st) {
    const s = S.stroke;
    S.stroke = null;
    if (!s || !s.pts.length) { UT.requestRender(); return; }
    let pts = s.pts;
    if (pts.length === 1) pts = [pts[0], { x: pts[0].x + 0.5, y: pts[0].y }];
    const brushMm = brushPx(st) / 2 / (S.xf ? S.xf.scale : 4);
    if (!s.erase && !s.planar) pts = dilate(pts, brushMm);
    else pts = UT.specimens.decimate(pts, 1);
    UT.bus.emit('defect:brush', { pts, erase: !!s.erase, brushMm: +brushMm.toFixed(2) });
    UT.requestRender();
  }

  function onMouseDown(ev) {
    const st = state();
    const cv = S.canvas;
    const p = UT.dom.localPos(ev, cv);
    if (ev.button !== 0 && ev.button !== 2) return;
    if (brushActive(st)) {
      if (!st.specimen) return;
      const mm = toMm(p.x, p.y);
      const type = (st.editing && st.editing.brush) || 'planar';
      S.stroke = { pts: [mm], erase: ev.button === 2, planar: isPlanarType(type) };
      S.drag = { kind: 'brush' };
      ev.preventDefault();
      UT.requestRender();
      return;
    }
    if (ev.button !== 0) return;
    if (!st.specimen) return;
    if (isOblique(st) && S.ob) {
      const pick = obliquePick(S.ob, p.x, p.y);
      S.drag = { kind: 'oblique', face: st.specimen.face === 'narrow' ? 'narrow' : 'wide' };
      applyObliquePick(st, pick);
      ev.preventDefault();
      return;
    }
    const mm = toMm(p.x, p.y);
    S.drag = { kind: 'probe', x0: mm.x, y0: mm.y, z0: st.probe.z, shift: ev.shiftKey };
    if (!ev.shiftKey) moveProbeTo(st, mm, false, null);
    cv.classList.add('probe-drag');
    ev.preventDefault();
  }

  function applyObliquePick(st, pick) {
    const cur = st.specimen.face === 'narrow' ? 'narrow' : 'wide';
    S.ghost = pick;
    if (pick.face === cur) {
      const x = +pick.x.toFixed(1), z = +pick.z.toFixed(1);
      if (Math.abs(x - st.probe.x) > 1e-6 || Math.abs(z - st.probe.z) > 1e-6) UT.setIn('probe', { x, z });
      else UT.requestRender();
    } else UT.requestRender();
  }

  function onMouseMove(ev) {
    const st = state();
    const cv = S.canvas;
    if (!cv) return;
    const p = UT.dom.localPos(ev, cv);
    const d = S.drag;
    if (d && d.kind === 'brush') {
      if (!S.stroke) return;
      const mm = toMm(p.x, p.y);
      const last = S.stroke.pts[S.stroke.pts.length - 1];
      if (M.dist(last.x, last.y, mm.x, mm.y) >= 0.3) { S.stroke.pts.push(mm); UT.requestRender(); }
      setCursorMm(mm);
      return;
    }
    if (d && d.kind === 'oblique') {
      if (!S.ob || !st.specimen) return;
      applyObliquePick(st, obliquePick(S.ob, p.x, p.y));
      return;
    }
    const mm = toMm(p.x, p.y);
    if (d && d.kind === 'probe') {
      moveProbeTo(st, mm, d.shift || ev.shiftKey, d);
    }
    setCursorMm(mm);
  }

  function onMouseUp(ev) {
    const st = state();
    const d = S.drag;
    if (!d) return;
    S.drag = null;
    if (S.canvas) S.canvas.classList.remove('probe-drag');
    if (d.kind === 'brush') { endStroke(st); return; }
    if (d.kind === 'oblique') {
      const g = S.ghost;
      S.ghost = null;
      if (g && st.specimen && g.face !== (st.specimen.face === 'narrow' ? 'narrow' : 'wide')) {
        if (UT.modes && typeof UT.modes.setFace === 'function') {
          try { UT.modes.setFace(g.face); } catch (e) { console.error('[cross] setFace', e); }
        }
        UT.setIn('probe', { x: +g.x.toFixed(1), z: +g.z.toFixed(1) });
      } else UT.requestRender();
    }
    void ev;
  }

  function onWheel(ev) {
    const st = state();
    const g = st.instrument.gain;
    const ng = M.clamp(g + (ev.deltaY < 0 ? 1 : -1), 0, 110);
    if (ng !== g) UT.setIn('instrument', { gain: ng });
    ev.preventDefault();
  }

  function onDblClick(ev) {
    const st = state();
    if (!st.specimen || isOblique(st)) return;
    const p = UT.dom.localPos(ev, S.canvas);
    const d = defectAt(st, toMm(p.x, p.y));
    if (d) UT.set({ selectedDefect: Math.max(0, (d.n || 1) - 1) });
  }

  /**
   * Initialise the cross-section canvas: mouse handlers + 'render' subscription.
   * @param {HTMLCanvasElement} canvas the #cv-cross canvas
   */
  function init(canvas) {
    S.canvas = canvas;
    UT.dom.injectCss('view-cross', cross.css);
    canvas.addEventListener('mousedown', onMouseDown);
    canvas.addEventListener('mousemove', onMouseMove);
    canvas.addEventListener('mouseleave', function () { if (!S.drag) setCursorMm(null); });
    canvas.addEventListener('wheel', onWheel, { passive: false });
    canvas.addEventListener('dblclick', onDblClick);
    canvas.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
    window.addEventListener('mousemove', function (ev) { if (S.drag) onMouseMove(ev); });
    window.addEventListener('mouseup', onMouseUp);
    UT.bus.on('render', function (frame) { draw(frame, UT.state); });
    UT.bus.on('state', function (e) { if (e && e.keys && e.keys.indexOf('specimen') >= 0) { S.ob = null; S.xf = null; } });
  }

  /**
   * Initialise the X ruler canvas (#cv-ruler): click/drag moves the probe; drawn on every 'render'.
   * @param {HTMLCanvasElement} canvas
   */
  function initRuler(canvas) {
    S.ruler = canvas;
    UT.dom.injectCss('view-cross', cross.css);
    let down = false;
    const move = function (ev) {
      const st = state();
      if (!st.specimen || isOblique(st)) return;
      const p = UT.dom.localPos(ev, canvas);
      const xf = S.xf || ensureTransform(st);
      moveProbeTo(st, { x: (p.x - xf.ox) / xf.scale, y: 0 }, false, null);
    };
    canvas.addEventListener('mousedown', function (ev) { if (ev.button !== 0) return; if (brushActive(state())) return; down = true; move(ev); ev.preventDefault(); });
    canvas.addEventListener('mousemove', function (ev) { if (down) move(ev); });
    window.addEventListener('mouseup', function () { down = false; });
    UT.bus.on('render', function () { drawRuler(UT.state); });
  }

  /**
   * Enable/disable the defect brush explicitly (the editor state `editing.defect` also enables it).
   * @param {boolean} on
   * @param {number} [px] brush diameter in CSS px (10–60)
   */
  function setBrush(on, px) {
    S.brush.on = !!on;
    if (typeof px === 'number' && px > 0) S.brush.px = M.clamp(px, 4, 120);
    if (!on) S.stroke = null;
    if (S.canvas) S.canvas.classList.toggle('brush', !!on);
    UT.requestRender();
  }

  // ------------------------------------------------------------------ namespace
  const cross = {
    init, initRuler, draw, drawRuler, toPx, toMm, fit, setBrush,
    transform() { return S.xf; },
    computeTransform, computeOblique, obliquePick, hull, dilate, surfaceTagAt, castDown,
    css: [
      '#cv-cross{display:block;cursor:crosshair;background:#fdfbd8;user-select:none;-webkit-user-select:none;touch-action:none}',
      '#cv-cross.probe-drag{cursor:ew-resize}',
      '#cv-cross.brush{cursor:cell}',
      '#cv-ruler{display:block;cursor:pointer;background:#fdfbd8;user-select:none;-webkit-user-select:none}',
    ].join('\n'),
    __selftest() {
      const f = [];
      const sp = UT.specimens.plateWeld({ T: 20 });
      const xf = computeTransform(sp, 1280, 200);
      if (Math.abs(xf.scale - 4) > 1e-9) f.push('scale ' + xf.scale);
      if (Math.abs(xf.ox - 640) > 1e-9) f.push('weld centred on x=0: ox ' + xf.ox);
      const px = { x: xf.ox + 40 * xf.scale, y: xf.oy + 10 * xf.scale };
      const mm = { x: (px.x - xf.ox) / xf.scale, y: (px.y - xf.oy) / xf.scale };
      if (Math.abs(mm.x - 40) > 1e-9 || Math.abs(mm.y - 10) > 1e-9) f.push('toPx/toMm roundtrip');
      const blk = UT.specimens.iow();
      const xb = computeTransform(blk, 1280, 200);
      if (Math.abs(xb.cx - 150) > 1e-9) f.push('block centred on extents centre: ' + xb.cx);
      if (surfaceTagAt(sp, 0, 20.0) !== 'root' && surfaceTagAt(sp, 100, 20) !== 'bottom') f.push('surfaceTagAt bottom');
      if (surfaceTagAt(sp, 50, 10) !== null) f.push('surfaceTagAt interior should be null');
      const v1 = UT.specimens.v1({ face: 'wide' });
      if (surfaceTagAt(v1, 100 + 100 * Math.cos(M.deg2rad(135)), 100 * Math.sin(M.deg2rad(135))) !== 'radius') f.push('surfaceTagAt arc');
      const h = hull([{ x: 0, y: 0 }, { x: 4, y: 0 }, { x: 4, y: 4 }, { x: 0, y: 4 }, { x: 2, y: 2 }]);
      if (h.length !== 4) f.push('hull ' + h.length);
      const blob = dilate([{ x: 0, y: 10 }, { x: 5, y: 12 }], 2);
      if (blob.length < 8 || blob.length > 40) f.push('dilate size ' + blob.length);
      const bb = UT.specimens.bbox(blob);
      if (bb.xMin > -1.9 || bb.xMax < 6.9) f.push('dilate extent');
      const lam = { type: 'lamination', pts: [{ x: 30, y: 8 }, { x: 60, y: 8 }] };
      if (Math.abs(castDown(sp, 40, [lam]) - 8) > 0.05) f.push('castDown lamination');
      if (Math.abs(castDown(sp, 100, [lam]) - 20) > 0.05) f.push('castDown backwall');
      const ob = computeOblique(v1, 25, 1280, 500);
      if (!(ob.sc > 3 && ob.sc < 4)) f.push('oblique scale ' + ob.sc);
      const pk = obliquePick(ob, ob.ox + 100 * ob.sc + ob.sh.x * 0.5, ob.oy + ob.sh.y * 0.5);
      if (pk.face !== 'wide' || Math.abs(pk.x - 100) > 0.01 || Math.abs(pk.z - 12.5) > 0.01) f.push('obliquePick band ' + JSON.stringify(pk));
      const pk2 = obliquePick(ob, ob.ox + 200 * ob.sc, ob.oy + 50 * ob.sc);
      if (pk2.face !== 'narrow' || Math.abs(pk2.x - 200) > 0.01 || Math.abs(pk2.z - 50) > 0.01) f.push('obliquePick front ' + JSON.stringify(pk2));
      return f;
    },
  };
  UT.views.cross = cross;
})(window.UT = window.UT || {});

</script>
<script>
// ---- src/62-view-plan.js ----
/* 62-view-plan.js — plan-view canvas (cv-plan): scrolling z window, hatched weld band, defect
 * rectangles, probe symbol (rotated by skew), beam footprint, raster trail, z ruler, compass dial
 * (skew drag), probe drag; plus the defect-editor helpers drawCircleView (pipe ring) and
 * drawLinearBar (plate bar). Spec §7.4 as amended by §14.2 / §14.3 / §15.6.
 *
 * // SPEC NOTES (decisions where the spec is silent or ambiguous)
 * - Shared X scale: when UT.views.cross.toPx exists, scale = (cross.toPx(10,0).x − cross.toPx(0,0).x)/10
 *   and the origin is shifted by the horizontal offset between #cv-cross and #cv-plan bounding
 *   rects, so the weld centre-line is at the SAME screen x in both views. Fallback: canvasWidth/320
 *   px/mm with x = 0 at the canvas centre.
 * - The z ruler is a 44 px cream strip at the right edge of the canvas (UTman600 look): ticks every
 *   5 mm, labels every 10 mm, a blue 3 px tick at probe.z. The grey field covers the specimen's x
 *   extents only (cream elsewhere), clipped to the left of the ruler strip.
 * - Angle-probe symbol: 24 × 16 mm rectangle whose FRONT edge is 3 mm ahead of the index point
 *   (so the white index dot sits inside the lighter 4 mm front strip). 0° probe: filled circle of
 *   diameter = crystal diameter (min 8 mm so a 5 mm probe stays visible).
 * - Beam footprint length = surface projection |xEnd − probe.x| of the centre ray's last drawn
 *   leg (≤ display.skips) when frame.rays is available, else the distance to x = 0. Not drawn for
 *   0° probes (the beam goes straight down) nor in TOFD mode.
 * - TOFD (state.mode === 'tofd'): one rectangle spanning rx − 12 … tx + 12 mm × 16 mm with a white
 *   dot at the tx index. Positions from UT.tofd.probePositions(state) when present ({tx:{x}, rx:{x}}
 *   or [{x},{x}]), else probe.x ± tofd.pcs/2. Tandem rx / TT receiver: hollow rectangle at
 *   probe.x − side·T·tanθ (TT dashed, it sits on the far surface).
 * - Compass hidden when UT.modes.enabled[mode].hidden/views lists 'compass'; otherwise for modes
 *   dac / v1 / v2 / tky / iow (the TOFD, AUT and lamination screenshots all show the dial).
 * - Mouse: left-drag on the probe symbol keeps the grab offset; mousedown elsewhere on the field
 *   jumps the probe there and drags (UTman "LEFT mouse button/drag to move the UT Probe"). x is
 *   clamped to spec.scanSurface, z clamped 0…L (pipes wrap). Positions rounded to 0.5 mm. Probe
 *   drag is locked while state.editing.defect (skew dial still works).
 * - Raster trail: recorded in draw() while mode === 'lamination' (positions ≥ 0.5 mm apart, last
 *   200), auto-cleared when the mode is anything else; clearTrail() for tb-clear.
 * - Circle view: ring radii min(150/120 px, fit to canvas); a drag on the annulus selects the
 *   SHORTER arc between the press and the current point (so clockwise drags also work): the
 *   result is delivered as onDrag(zFrom, zTo) on every move and on release (zFrom > zTo = wrap on
 *   the pipe). A press+release without motion (< 3 px) calls onSelect(n) for the defect under the
 *   pointer (if any). The caption 'Circle-View. Position <z>' shows the pointer z while hovering.
 *   The red status line under the ring belongs to the editor (80-modes), not drawn here.
 * - Linear bar: same semantics with a horizontal bar 0…L (no wrap, zFrom ≤ zTo), tick labels every
 *   round(L/12) mm.
 * - toMm(px, py) returns {x, z, y: z} so both the §15.6 shape ({x, y}) and plan semantics work.
 */
(function (UT) {
  'use strict';
  UT.views = UT.views || {};
  const M = UT.math;
  const C = UT.consts;

  const RULER_W = 44;          // px, z ruler strip at the right
  const DIAL_R = 60;           // px, compass ring radius
  const TRAIL_MAX = 200;
  const COMPASS_HIDDEN_MODES = { dac: 1, v1: 1, v2: 1, tky: 1, iow: 1 };

  // ------------------------------------------------------------------ pure helpers (headless-safe)
  /** Top of the visible z window (mm) for a probe z on a specimen of length L. */
  function zWindowTop(probeZ, L, windowMm) {
    const maxTop = Math.max(0, (L || 0) - windowMm);
    return M.clamp((probeZ || 0) - 30, 0, maxTop);
  }

  /** Snap a skew angle: 1° normally, 5° with Shift; normalised to (−180, 180]. */
  function snapSkew(deg, shift) {
    const step = shift ? 5 : 1;
    let s = Math.round(deg / step) * step;
    while (s > 180) s -= 360;
    while (s <= -180) s += 360;
    return s === 0 ? 0 : s;   // avoid -0
  }

  /** Wrap z into [0, L). */
  function wrapZ(z, L) { if (!(L > 0)) return z; return ((z % L) + L) % L; }

  /**
   * Split a defect's z extent into non-wrapping [a, b] spans within 0…L.
   * On pipes zTo < zFrom means the defect wraps through z = 0.
   */
  function zSpans(zFrom, zTo, L, pipe) {
    if (!(L > 0)) return [[Math.min(zFrom, zTo), Math.max(zFrom, zTo)]];
    if (pipe) {
      const a = wrapZ(zFrom, L), b = wrapZ(zTo, L);
      if (Math.abs(zTo - zFrom) >= L) return [[0, L]];
      if (b >= a) return [[a, b]];
      return [[a, L], [0, b]];
    }
    const lo = M.clamp(Math.min(zFrom, zTo), 0, L), hi = M.clamp(Math.max(zFrom, zTo), 0, L);
    return [[lo, hi]];
  }

  /** Canvas angle (rad, y-down convention) of circumferential position z: anticlockwise from 12 o'clock. */
  function circleAngle(z, Cir) { return -Math.PI / 2 - (Cir > 0 ? z / Cir : 0) * 2 * Math.PI; }

  /** Inverse of circleAngle: z in [0, C) for a canvas angle (rad). */
  function zAtAngle(aRad, Cir) {
    let t = (-Math.PI / 2 - aRad) / (2 * Math.PI);   // turns anticlockwise from the top
    t = t - Math.floor(t);
    return t * Cir;
  }

  /**
   * Drag result on a ring: the shorter arc between z0 and z1 (wrap-aware).
   * @returns {{zFrom:number, zTo:number}}
   */
  function ringDragSpan(z0, z1, Cir) {
    let d = z1 - z0;
    if (Cir > 0) { d = ((d % Cir) + Cir) % Cir; if (d > Cir / 2) d -= Cir; }
    const from = d >= 0 ? z0 : wrapZ(z0 + d, Cir);
    const to = d >= 0 ? wrapZ(z0 + d, Cir) : z0;
    return { zFrom: +from.toFixed(1), zTo: +to.toFixed(1) };
  }

  /** Does z lie within a defect's z extent (wrap-aware on pipes)? */
  function zInDefect(z, d, L, pipe) {
    return zSpans(d.zFrom, d.zTo, L, pipe).some(function (s) { return z >= s[0] - 1e-9 && z <= s[1] + 1e-9; });
  }

  /** Beam direction unit vector in the plan (x right, z down) for side ±1 and skew (deg, + clockwise). */
  function planDir(side, skewDeg) {
    const s = M.deg2rad(skewDeg || 0);
    const sd = side === -1 ? -1 : 1;
    return { x: -sd * Math.cos(s), z: -sd * Math.sin(s) };
  }

  /** Lighten a #rrggbb colour toward white by t (0..1). */
  function lighten(hex, t) {
    const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || '');
    if (!m) return '#e0e0e0';
    const f = function (h) { const v = parseInt(h, 16); return Math.round(v + (255 - v) * t); };
    return 'rgb(' + f(m[1]) + ',' + f(m[2]) + ',' + f(m[3]) + ')';
  }

  function isCompassHidden(state) {
    const mode = state && state.mode;
    const en = UT.modes && UT.modes.enabled && UT.modes.enabled[mode];
    if (en) {
      const arr = en.hidden || en.views || en.hiddenViews;
      if (Array.isArray(arr)) return arr.indexOf('compass') >= 0;
    }
    return !!COMPASS_HIDDEN_MODES[mode];
  }

  function defectBox(d) {
    if (!d || !Array.isArray(d.pts) || !d.pts.length) return null;
    return UT.specimens && UT.specimens.bbox ? UT.specimens.bbox(d.pts) : null;
  }

  // ------------------------------------------------------------------ plan view state
  let canvas = null;
  let tf = { scale: 4, originX: 640, zTop: 0, windowMm: 65, w: 1280, h: 260, fieldW: 1236 };
  let trail = [];
  let drag = null;              // {kind:'probe'|'dial', dx, dz}
  let dialC = { x: 0, y: 0 };
  let lastProbeSym = null;      // geometry of the drawn probe symbol for hit testing
  let hoverCursor = '';

  function cssSize(cv) {
    const w = cv.clientWidth || cv.width || 640;
    const h = cv.clientHeight || cv.height || 260;
    return { w, h };
  }

  /** Recompute the mm→px transform from the canvas box, the shared cross-section scale and the probe z. */
  function computeTransform(cv, state) {
    const sz = cssSize(cv);
    let scale = 0, originX = sz.w / 2;
    const cross = UT.views.cross;
    if (cross && typeof cross.toPx === 'function') {
      try {
        const p0 = cross.toPx(0, 0), p1 = cross.toPx(10, 0);
        const s = (p1.x - p0.x) / 10;
        if (isFinite(s) && s > 0.05) {
          scale = s;
          let off = 0;
          if (typeof document !== 'undefined') {
            const cc = document.getElementById('cv-cross');
            if (cc && cc.getBoundingClientRect && cv.getBoundingClientRect) {
              const a = cc.getBoundingClientRect(), b = cv.getBoundingClientRect();
              if (a.width > 0 && b.width > 0) off = a.left - b.left;
            }
          }
          originX = p0.x + off;
        }
      } catch (e) { scale = 0; }
    }
    if (!scale) { scale = sz.w / 320; originX = sz.w / 2; }
    const windowMm = sz.h / scale;
    const spec = state && state.specimen;
    const L = spec ? spec.L : 300;
    const zTop = zWindowTop(state && state.probe ? state.probe.z : 0, L, windowMm);
    tf = { scale, originX, zTop, windowMm, w: sz.w, h: sz.h, fieldW: Math.max(0, sz.w - RULER_W), L };
    return tf;
  }

  /** mm → CSS px (x across the weld, z along the weld). */
  function toPx(x, z) { return { x: tf.originX + x * tf.scale, y: (z - tf.zTop) * tf.scale }; }
  /** CSS px → mm. Returns {x, z, y} with y === z. */
  function toMm(px, py) { const z = tf.zTop + py / tf.scale; return { x: (px - tf.originX) / tf.scale, z, y: z }; }
  /** Refit the transform (called on resize by the app; draw() does it every frame anyway). */
  function fit() { if (canvas) computeTransform(canvas, UT.state); return tf; }

  // ------------------------------------------------------------------ drawing pieces
  function drawField(ctx, spec) {
    ctx.fillStyle = C.COLOURS.cream;
    ctx.fillRect(0, 0, tf.w, tf.h);
    const ex = spec.extents || { xMin: -150, xMax: 150 };
    const x0 = M.clamp(toPx(ex.xMin, 0).x, 0, tf.fieldW), x1 = M.clamp(toPx(ex.xMax, 0).x, 0, tf.fieldW);
    ctx.fillStyle = C.COLOURS.steel;
    ctx.fillRect(x0, 0, Math.max(0, x1 - x0), tf.h);
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 1;
    ctx.strokeRect(x0 + 0.5, 0.5, Math.max(0, x1 - x0) - 1, tf.h - 1);
    // side-drilled holes run along z: thin white lines
    for (const hole of spec.holes || []) {
      const hx = toPx(hole.x, 0).x;
      if (hx < 0 || hx > tf.fieldW) continue;
      ctx.strokeStyle = C.COLOURS.hole;
      ctx.lineWidth = Math.max(1, hole.r * 2 * tf.scale * 0.5);
      ctx.beginPath(); ctx.moveTo(hx, 0); ctx.lineTo(hx, tf.h); ctx.stroke();
    }
  }

  function drawWeldBand(ctx, spec) {
    const weld = spec.weld;
    if (!weld || weld.type === 'none' || weld.type === 'fillet') return;
    const cw = weld.capWidth || 16;
    const xl = toPx(-cw / 2, 0).x, xr = toPx(cw / 2, 0).x;
    if (xr < 0 || xl > tf.fieldW) return;
    ctx.save();
    ctx.beginPath(); ctx.rect(Math.max(0, xl), 0, Math.min(xr, tf.fieldW) - Math.max(0, xl), tf.h); ctx.clip();
    ctx.fillStyle = '#767676';
    ctx.fillRect(xl, 0, xr - xl, tf.h);
    // diagonal hatch
    ctx.strokeStyle = 'rgba(20,20,20,0.75)';
    ctx.lineWidth = 1;
    const wpx = xr - xl;
    ctx.beginPath();
    for (let y = -wpx; y < tf.h + wpx; y += 7) { ctx.moveTo(xl, y); ctx.lineTo(xr, y + wpx); }
    ctx.stroke();
    // rippled cap: stacked scallops along z
    ctx.strokeStyle = 'rgba(232,232,232,0.7)';
    ctx.lineWidth = 1.5;
    const pitch = Math.max(8, 5 * tf.scale);
    const start = -((tf.zTop * tf.scale) % pitch);
    for (let y = start; y < tf.h + pitch; y += pitch) {
      ctx.beginPath();
      ctx.ellipse((xl + xr) / 2, y, wpx / 2, pitch * 0.55, 0, Math.PI, 0, false);
      ctx.stroke();
    }
    ctx.restore();
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(Math.round(xl) + 0.5, 0); ctx.lineTo(Math.round(xl) + 0.5, tf.h);
    ctx.moveTo(Math.round(xr) + 0.5, 0); ctx.lineTo(Math.round(xr) + 0.5, tf.h);
    ctx.stroke();
  }

  function drawTrail(ctx) {
    if (!trail.length) return;
    ctx.fillStyle = 'rgba(255,255,255,0.38)';
    for (const p of trail) {
      const q = toPx(p.x, p.z);
      if (q.x < 0 || q.x > tf.fieldW || q.y < 0 || q.y > tf.h) continue;
      ctx.beginPath(); ctx.arc(q.x, q.y, 2, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawDefects(ctx, state, spec) {
    if (!state.defects || state.display.hide) return;
    const pipe = !!spec.pipe;
    for (const d of state.defects) {
      if (!d || d.visible === false) continue;
      const b = defectBox(d);
      if (!b) continue;
      const wMm = Math.max(3, b.w);
      const xl = toPx(b.cx - wMm / 2, 0).x, xr = toPx(b.cx + wMm / 2, 0).x;
      if (xr < 0 || xl > tf.fieldW) continue;
      for (const s of zSpans(d.zFrom, d.zTo, spec.L, pipe)) {
        const y0 = toPx(0, s[0]).y, y1 = toPx(0, s[1]).y;
        if (y1 < 0 || y0 > tf.h) continue;
        ctx.fillStyle = C.COLOURS.defect;
        ctx.fillRect(Math.max(0, xl), y0, Math.min(xr, tf.fieldW) - Math.max(0, xl), Math.max(2, y1 - y0));
      }
    }
  }

  function footprintLength(frame, state) {
    const probe = state.probe;
    let xEnd = null;
    const rays = frame && frame.rays;
    const skips = (state.display && state.display.skips) || 3;
    if (rays && rays.centre) {
      const legs = rays.centre.legs;
      if (Array.isArray(legs) && legs.length) {
        let last = null;
        for (const lg of legs) if (!lg.leg || lg.leg <= skips) last = lg;
        if (last && last.b) xEnd = last.b.x;
      }
      if (xEnd === null && Array.isArray(rays.centre.pts) && rays.centre.pts.length) xEnd = rays.centre.pts[rays.centre.pts.length - 1].x;
    }
    const len = xEnd === null ? Math.abs(probe.x) : Math.abs(xEnd - probe.x);
    return Math.max(0, len);
  }

  function drawFootprint(ctx, frame, state, derived) {
    const probe = state.probe;
    if (!probe.angle || state.mode === 'tofd') return;
    if (state.display && (state.display.beam === false || state.display.hide)) return;
    const len = footprintLength(frame, state);
    if (len < 2) return;
    const th = (derived && derived.halfAngle20dB) || 4;
    const o = toPx(probe.x, probe.z);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, tf.fieldW, tf.h); ctx.clip();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    for (const off of [0, th, -th]) {
      const d = planDir(probe.side, (probe.skew || 0) + off);
      ctx.beginPath();
      ctx.moveTo(o.x, o.y);
      ctx.lineTo(o.x + d.x * len * tf.scale, o.y + d.z * len * tf.scale);
      ctx.stroke();
    }
    ctx.restore();
  }

  /** Rotated probe rectangle in plan mm: front edge 3 mm ahead of the index, 24 long, 16 wide. */
  function rectSymbol(ctx, xIdx, zIdx, side, skew, colour, opts) {
    const o = opts || {};
    const d = planDir(side, skew);
    const ang = Math.atan2(d.z, d.x);
    const p = toPx(xIdx, zIdx);
    const s = tf.scale;
    const uF = o.front === undefined ? 3 : o.front, uB = o.back === undefined ? -21 : o.back, hv = o.half === undefined ? 8 : o.half;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(ang);
    if (o.hollow) {
      ctx.strokeStyle = colour; ctx.lineWidth = 2;
      if (o.dashed) ctx.setLineDash([5, 4]);
      ctx.strokeRect(uB * s, -hv * s, (uF - uB) * s, 2 * hv * s);
    } else {
      ctx.fillStyle = colour;
      ctx.fillRect(uB * s, -hv * s, (uF - uB) * s, 2 * hv * s);
      ctx.fillStyle = lighten(colour, 0.45);
      ctx.fillRect((uF - 4) * s, -hv * s, 4 * s, 2 * hv * s);
      ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1;
      ctx.strokeRect(uB * s + 0.5, -hv * s + 0.5, (uF - uB) * s - 1, 2 * hv * s - 1);
      if (o.dotU !== null) {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc((o.dotU || 0) * s, 0, 2, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
    return { kind: 'rect', x: xIdx, z: zIdx, dir: d, uF, uB, hv };
  }

  function tofdPositions(state) {
    let tx = null, rx = null;
    try {
      if (UT.tofd && typeof UT.tofd.probePositions === 'function') {
        const pp = UT.tofd.probePositions(state);
        if (pp) {
          const a = pp.tx || pp[0], b = pp.rx || pp[1];
          if (a && typeof a.x === 'number') tx = a.x;
          if (b && typeof b.x === 'number') rx = b.x;
        }
      }
    } catch (e) { tx = rx = null; }
    const pcs = (state.tofd && state.tofd.pcs) || 60;
    if (tx === null) tx = state.probe.x + pcs / 2;
    if (rx === null) rx = state.probe.x - pcs / 2;
    return { tx, rx };
  }

  function drawProbe(ctx, state, spec, derived) {
    const probe = state.probe;
    const colour = (derived && derived.colour) || C.PROBE_COLOURS[probe.angle] || '#00c000';
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, tf.fieldW, tf.h); ctx.clip();
    if (state.mode === 'tofd') {
      const pp = tofdPositions(state);
      const lo = Math.min(pp.tx, pp.rx), hi = Math.max(pp.tx, pp.rx);
      const a = toPx(lo - 12, probe.z - 8), b = toPx(hi + 12, probe.z + 8);
      ctx.fillStyle = colour;
      ctx.fillRect(a.x, a.y, b.x - a.x, b.y - a.y);
      ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1;
      ctx.strokeRect(a.x + 0.5, a.y + 0.5, b.x - a.x - 1, b.y - a.y - 1);
      const dot = toPx(pp.tx, probe.z);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(dot.x, dot.y, 2.5, 0, Math.PI * 2); ctx.fill();
      lastProbeSym = { kind: 'box', x0: lo - 12, x1: hi + 12, z0: probe.z - 8, z1: probe.z + 8 };
    } else if (!probe.angle) {
      const D = Math.max(8, (derived && derived.diameter) || probe.diameter || 10);
      const p = toPx(probe.x, probe.z);
      ctx.fillStyle = colour;
      ctx.beginPath(); ctx.arc(p.x, p.y, D / 2 * tf.scale, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1; ctx.stroke();
      lastProbeSym = { kind: 'circle', x: probe.x, z: probe.z, r: D / 2 + 1.5 };
    } else {
      const th = M.deg2rad(probe.angle || 60);
      const T = spec.T || 20;
      if (probe.method === 'tandem') rectSymbol(ctx, probe.x - (probe.side || 1) * T * Math.tan(th), probe.z, probe.side, probe.skew, colour, { hollow: true });
      if (probe.method === 'tt') rectSymbol(ctx, probe.x - (probe.side || 1) * T * Math.tan(th), probe.z, probe.side, probe.skew, colour, { hollow: true, dashed: true });
      lastProbeSym = rectSymbol(ctx, probe.x, probe.z, probe.side, probe.skew, colour, { dotU: 0 });
    }
    ctx.restore();
  }

  function drawRuler(ctx, state) {
    const x0 = tf.fieldW;
    ctx.fillStyle = C.COLOURS.cream;
    ctx.fillRect(x0, 0, RULER_W, tf.h);
    const lineX = Math.round(x0 + 9) + 0.5;
    ctx.strokeStyle = C.COLOURS.ruler;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(lineX, 0); ctx.lineTo(lineX, tf.h); ctx.stroke();
    ctx.font = '10px Segoe UI, Arial, sans-serif';
    ctx.fillStyle = C.COLOURS.ruler;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const zEnd = tf.zTop + tf.windowMm;
    const zFirst = Math.ceil(tf.zTop / 5) * 5;
    ctx.beginPath();
    for (let z = zFirst; z <= zEnd + 1e-6; z += 5) {
      const y = Math.round(toPx(0, z).y) + 0.5;
      const major = Math.round(z) % 10 === 0;
      ctx.moveTo(lineX, y); ctx.lineTo(lineX + (major ? 9 : 5), y);
      if (major) ctx.fillText(String(Math.round(z)), lineX + 12, M.clamp(y, 6, tf.h - 6));
    }
    ctx.stroke();
    // probe z marker
    const pz = state.probe.z;
    if (pz >= tf.zTop - 1e-6 && pz <= zEnd + 1e-6) {
      const y = toPx(0, pz).y;
      ctx.strokeStyle = '#0000ff';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(lineX - 8, y); ctx.lineTo(lineX, y); ctx.stroke();
    }
  }

  function drawCompass(ctx, state) {
    dialC = { x: tf.fieldW - 16 - DIAL_R, y: 16 + DIAL_R };
    const skew = state.probe.skew || 0;
    ctx.save();
    ctx.font = '11px Segoe UI, Arial, sans-serif';
    ctx.fillStyle = '#000';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText('PLAN VIEW', dialC.x - DIAL_R - 8, 18);
    ctx.strokeStyle = '#0000ff';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(dialC.x, dialC.y, DIAL_R, 0, Math.PI * 2); ctx.stroke();
    const a = M.deg2rad(skew);
    ctx.strokeStyle = '#ff0000';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(dialC.x, dialC.y);
    ctx.lineTo(dialC.x + Math.sin(a) * (DIAL_R - 4), dialC.y - Math.cos(a) * (DIAL_R - 4));
    ctx.stroke();
    ctx.fillStyle = '#ff0000';
    ctx.beginPath(); ctx.arc(dialC.x, dialC.y, 5, 0, Math.PI * 2); ctx.fill();
    if (skew) {
      ctx.font = '10px Segoe UI, Arial, sans-serif';
      ctx.fillStyle = '#000';
      ctx.textAlign = 'center';
      ctx.fillText(skew + '°', dialC.x, dialC.y + DIAL_R + 10);
    }
    ctx.restore();
  }

  function recordTrail(state) {
    if (state.mode !== 'lamination') { if (trail.length) trail = []; return; }
    const p = state.probe;
    const last = trail[trail.length - 1];
    if (last && Math.abs(last.x - p.x) < 0.5 && Math.abs(last.z - p.z) < 0.5) return;
    trail.push({ x: p.x, z: p.z });
    if (trail.length > TRAIL_MAX) trail.splice(0, trail.length - TRAIL_MAX);
  }

  /**
   * Draw the plan view from the current frame and state.
   * @param {object} frame UT.frame (rays/derived may be null)
   * @param {object} state UT.state
   */
  function draw(frame, state) {
    if (!canvas) return;
    const ctx = UT.dom.fitCanvas(canvas);
    state = state || UT.state;
    computeTransform(canvas, state);
    ctx.save();
    ctx.fillStyle = C.COLOURS.cream;
    ctx.fillRect(0, 0, tf.w, tf.h);
    const spec = state && state.specimen;
    if (!spec || !state.probe) { ctx.restore(); lastProbeSym = null; return; }
    let derived = frame && frame.derived;
    if (!derived && UT.probe && UT.probe.derive) { try { derived = UT.probe.derive(state.probe, spec); } catch (e) { derived = null; } }
    recordTrail(state);
    drawField(ctx, spec);
    drawWeldBand(ctx, spec);
    drawTrail(ctx);
    drawDefects(ctx, state, spec);
    drawFootprint(ctx, frame, state, derived);
    drawProbe(ctx, state, spec, derived);
    drawRuler(ctx, state);
    if (!isCompassHidden(state)) drawCompass(ctx, state); else dialC = null;
    ctx.restore();
  }

  // ------------------------------------------------------------------ interaction
  function hitProbe(mm) {
    const s = lastProbeSym;
    if (!s) return false;
    if (s.kind === 'circle') return M.dist(mm.x, mm.z, s.x, s.z) <= s.r;
    if (s.kind === 'box') return mm.x >= s.x0 && mm.x <= s.x1 && mm.z >= s.z0 && mm.z <= s.z1;
    const dx = mm.x - s.x, dz = mm.z - s.z;
    const u = dx * s.dir.x + dz * s.dir.z;
    const v = -dx * s.dir.z + dz * s.dir.x;
    return u >= s.uB - 1 && u <= s.uF + 1 && Math.abs(v) <= s.hv + 1;
  }

  function hitDial(p) { return !!dialC && M.dist(p.x, p.y, dialC.x, dialC.y) <= DIAL_R + 10; }

  function applySkew(p, shift) {
    const deg = M.rad2deg(Math.atan2(p.x - dialC.x, -(p.y - dialC.y)));
    const skew = snapSkew(deg, shift);
    if (skew !== (UT.state.probe.skew || 0)) UT.setIn('probe', { skew });
  }

  /**
   * Move the probe during a drag. x follows the pointer (plus the grab offset); z is delta-based
   * (pointer displacement since the press, d.z0 + dyPx/scale) because the z window scrolls with
   * probe.z and an absolute mapping would feed back on itself.
   */
  function moveProbe(mm, d, p) {
    const spec = UT.state.specimen;
    if (!spec) return;
    const ss = spec.scanSurface || { xMin: spec.extents.xMin, xMax: spec.extents.xMax };
    let x = M.clamp(mm.x + d.dx, ss.xMin, ss.xMax);
    let z = (p && d.py !== undefined) ? d.z0 + (p.y - d.py) / tf.scale : mm.z + d.dz;
    z = spec.pipe ? wrapZ(z, spec.L) : M.clamp(z, 0, spec.L);
    x = Math.round(x * 2) / 2; z = Math.round(z * 2) / 2;
    const cur = UT.state.probe;
    if (x !== cur.x || z !== cur.z) UT.setIn('probe', { x, z });
  }

  function setCursor(c) {
    if (!canvas || hoverCursor === c) return;
    hoverCursor = c;
    canvas.style.cursor = c;
  }

  function onDown(ev) {
    if (ev.button !== undefined && ev.button !== 0) return;
    const p = UT.dom.localPos(ev, canvas);
    if (p.x < 0 || p.y < 0 || p.x > tf.w || p.y > tf.h) return;
    if (hitDial(p)) {
      drag = { kind: 'dial' };
      applySkew(p, ev.shiftKey);
      ev.preventDefault();
      return;
    }
    if (p.x > tf.fieldW) return;                                   // ruler strip
    if (UT.state.editing && UT.state.editing.defect) return;       // editor open: probe locked
    if (!UT.state.specimen) return;
    const mm = toMm(p.x, p.y);
    if (hitProbe(mm)) drag = { kind: 'probe', dx: UT.state.probe.x - mm.x, dz: 0 };
    else { drag = { kind: 'probe', dx: 0, dz: 0 }; moveProbe(mm, drag); }
    drag.py = p.y; drag.z0 = UT.state.probe.z;
    setCursor('grabbing');
    ev.preventDefault();
  }

  function onMove(ev) {
    if (!canvas) return;
    const p = UT.dom.localPos(ev, canvas);
    if (drag) {
      if (drag.kind === 'dial') applySkew(p, ev.shiftKey);
      else moveProbe(toMm(p.x, p.y), drag, p);
      if (ev.cancelable) ev.preventDefault();
      return;
    }
    if (ev.target !== canvas) return;
    if (hitDial(p)) setCursor('pointer');
    else if (p.x <= tf.fieldW && hitProbe(toMm(p.x, p.y))) setCursor('grab');
    else setCursor('default');
  }

  function onUp() {
    if (!drag) return;
    drag = null;
    setCursor('default');
  }

  function onDblClick(ev) {
    const p = UT.dom.localPos(ev, canvas);
    if (hitDial(p)) { UT.setIn('probe', { skew: 0 }); ev.preventDefault(); }
  }

  /**
   * Attach the plan view to its canvas (#cv-plan), bind mouse/touch handlers and subscribe to 'render'.
   * @param {HTMLCanvasElement} cv
   */
  function init(cv) {
    canvas = cv;
    if (!canvas) return;
    UT.dom.injectCss('view-plan', plan.css);
    canvas.classList.add('plan-view-canvas');
    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('dblclick', onDblClick);
    canvas.addEventListener('touchstart', onDown, { passive: false });
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onUp);
    UT.bus.on('render', function (frame) { draw(frame, UT.state); });
    fit();
  }

  /** Clear the lamination raster trail (tb-clear). */
  function clearTrail() { trail = []; }

  // ------------------------------------------------------------------ defect editor helpers (circle view / linear bar)
  const editorCtx = new WeakMap();   // canvas → {kind, opts, geom, hoverZ, press}

  function editorState(cv) {
    let st = editorCtx.get(cv);
    if (!st) {
      st = { kind: 'circle', opts: {}, geom: null, hoverZ: null, press: null, moved: false };
      editorCtx.set(cv, st);
      bindEditor(cv, st);
    }
    return st;
  }

  function specLength(spec) { return (spec && spec.L) || 300; }

  function editorZAt(st, p) {
    const g = st.geom;
    if (!g) return null;
    if (st.kind === 'circle') {
      const dist = M.dist(p.x, p.y, g.cx, g.cy);
      if (dist < g.r - 14 || dist > g.R + 14) return null;
      return zAtAngle(Math.atan2(p.y - g.cy, p.x - g.cx), g.L);
    }
    if (p.y < g.y0 - 14 || p.y > g.y1 + 14 || p.x < g.x0 - 10 || p.x > g.x1 + 10) return null;
    return M.clamp((p.x - g.x0) / (g.x1 - g.x0) * g.L, 0, g.L);
  }

  function editorRedraw(cv, st) {
    if (st.kind === 'circle') drawCircleView(cv, st.opts); else drawLinearBar(cv, st.opts);
  }

  function bindEditor(cv, st) {
    const down = function (ev) {
      if (ev.button !== undefined && ev.button !== 0) return;
      const p = UT.dom.localPos(ev, cv);
      const z = editorZAt(st, p);
      if (z === null) return;
      st.press = { z0: z, px: p.x, py: p.y };
      st.moved = false;
      ev.preventDefault();
    };
    const move = function (ev) {
      const p = UT.dom.localPos(ev, cv);
      if (st.press) {
        const z = editorZAt(st, p);
        if (M.dist(p.x, p.y, st.press.px, st.press.py) >= 3) st.moved = true;
        if (z !== null && st.moved) {
          const span = st.kind === 'circle' ? ringDragSpan(st.press.z0, z, st.geom.L) : { zFrom: +Math.min(st.press.z0, z).toFixed(1), zTo: +Math.max(st.press.z0, z).toFixed(1) };
          st.press.last = span;
          st.hoverZ = z;
          if (typeof st.opts.onDrag === 'function') st.opts.onDrag(span.zFrom, span.zTo);
          else editorRedraw(cv, st);
        }
        if (ev.cancelable) ev.preventDefault();
        return;
      }
      if (ev.target !== cv) return;
      const z = editorZAt(st, p);
      if (z !== st.hoverZ) { st.hoverZ = z; editorRedraw(cv, st); }
      cv.style.cursor = z === null ? 'default' : 'crosshair';
    };
    const up = function (ev) {
      if (!st.press) return;
      const pr = st.press;
      st.press = null;
      if (!st.moved) {
        const g = st.geom;
        const defs = (st.opts.defects || []);
        const hit = defs.find(function (d) { return d && zInDefect(pr.z0, d, g.L, st.kind === 'circle'); });
        if (hit && typeof st.opts.onSelect === 'function') st.opts.onSelect(hit.n);
        else editorRedraw(cv, st);
      } else if (pr.last && typeof st.opts.onDrag === 'function') {
        st.opts.onDrag(pr.last.zFrom, pr.last.zTo);
      }
      void ev;
    };
    cv.addEventListener('mousedown', down);
    cv.addEventListener('touchstart', down, { passive: false });
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('mouseup', up);
    window.addEventListener('touchend', up);
    cv.addEventListener('mouseleave', function () { if (!st.press && st.hoverZ !== null) { st.hoverZ = null; editorRedraw(cv, st); } });
  }

  function isSelected(d, opts) {
    if (opts.selected === undefined || opts.selected === null) return false;
    return d.n === opts.selected;
  }

  /**
   * Pipe circle view for the defect editor: grey annulus, 12 spokes, position labels increasing
   * anticlockwise from 12 o'clock, red defect arcs (selected dark red + two radial lines).
   * @param {HTMLCanvasElement} cv
   * @param {{spec:object, defects:Array, selected:number, onDrag:function, onSelect:function}} opts
   */
  function drawCircleView(cv, opts) {
    if (!cv) return;
    opts = opts || {};
    const st = editorState(cv);
    st.kind = 'circle';
    st.opts = opts;
    const ctx = UT.dom.fitCanvas(cv);
    const sz = cssSize(cv);
    const w = sz.w, h = sz.h;
    const L = specLength(opts.spec);
    const R = Math.max(40, Math.min(150, Math.min(w, h) / 2 - 16));
    const r = R * 0.8;
    const cx = w / 2, cy = h / 2 + 6;
    st.geom = { cx, cy, R, r, L };
    ctx.save();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    // annulus
    ctx.fillStyle = C.COLOURS.steel;
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2, false);
    ctx.arc(cx, cy, r, 0, Math.PI * 2, true);
    ctx.fill();
    // spokes + labels
    const step = Math.max(1, Math.round(L / 12));
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.font = '11px Segoe UI, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let k = 0; k < 12; k++) {
      const a = circleAngle(k * step, L);
      ctx.save();
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); ctx.stroke();
      ctx.restore();
      const lr = r - 20;
      ctx.fillStyle = '#000';
      ctx.fillText((k === 0 ? '0 ' : String(k * step)) + 'mm', cx + Math.cos(a) * lr + (k === 0 ? 16 : 0), cy + Math.sin(a) * lr);
    }
    // defects
    const pipe = true;
    for (const d of opts.defects || []) {
      if (!d || d.visible === false) continue;
      const sel = isSelected(d, opts);
      for (const s of zSpans(d.zFrom, d.zTo, L, pipe)) {
        const a0 = circleAngle(s[0], L), a1 = circleAngle(s[1], L);
        ctx.fillStyle = sel ? '#a00000' : C.COLOURS.defect;
        ctx.beginPath();
        ctx.arc(cx, cy, R - 2, a0, a1, true);
        ctx.arc(cx, cy, r + 2, a1, a0, false);
        ctx.closePath();
        ctx.fill();
      }
      if (sel) {
        ctx.strokeStyle = '#ff0000';
        ctx.lineWidth = 1.5;
        for (const zz of [d.zFrom, d.zTo]) {
          const a = circleAngle(wrapZ(zz, L), L);
          ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * (R - 2), cy + Math.sin(a) * (R - 2)); ctx.stroke();
        }
      }
    }
    // zero line + left-pointing arrow
    ctx.strokeStyle = '#000';
    ctx.fillStyle = '#000';
    ctx.lineWidth = 1.5;
    const topY = cy - R - 5;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, topY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, topY); ctx.lineTo(cx - 58, topY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - 66, topY); ctx.lineTo(cx - 54, topY - 5); ctx.lineTo(cx - 54, topY + 5); ctx.closePath(); ctx.fill();
    // caption
    ctx.font = '11px Segoe UI, Arial, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#000';
    ctx.fillText('Circle-View. Position ' + (st.hoverZ === null ? '' : Math.round(st.hoverZ)), w - 6, 4);
    ctx.restore();
  }

  /**
   * Plate linear bar for the defect editor: horizontal bar 0…L with the same semantics as the circle view.
   * @param {HTMLCanvasElement} cv
   * @param {{spec:object, defects:Array, selected:number, onDrag:function, onSelect:function}} opts
   */
  function drawLinearBar(cv, opts) {
    if (!cv) return;
    opts = opts || {};
    const st = editorState(cv);
    st.kind = 'bar';
    st.opts = opts;
    const ctx = UT.dom.fitCanvas(cv);
    const sz = cssSize(cv);
    const w = sz.w, h = sz.h;
    const L = specLength(opts.spec);
    const x0 = 30, x1 = Math.max(x0 + 40, w - 30);
    const barH = Math.min(30, Math.max(16, h * 0.25));
    const y0 = h / 2 - barH / 2, y1 = h / 2 + barH / 2;
    st.geom = { x0, x1, y0, y1, L };
    const px = function (z) { return x0 + (x1 - x0) * (z / L); };
    ctx.save();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = C.COLOURS.steel;
    ctx.fillRect(x0, y0, x1 - x0, barH);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.strokeRect(x0 + 0.5, y0 + 0.5, x1 - x0 - 1, barH - 1);
    // ticks / labels
    const step = Math.max(1, Math.round(L / 12));
    ctx.font = '11px Segoe UI, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const tickPx = (x1 - x0) * step / L;
    const every = tickPx >= 44 ? 1 : tickPx >= 22 ? 2 : 4;   // label density
    let k = 0;
    for (let z = 0; z <= L + 1e-6; z += step, k++) {
      const x = Math.round(px(z)) + 0.5;
      ctx.save(); ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
      ctx.restore();
      ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y1 + 6); ctx.stroke();
      if (k % every === 0) { ctx.fillStyle = '#000'; ctx.fillText(Math.round(z) + 'mm', x, y1 + 8); }
    }
    // defects
    for (const d of opts.defects || []) {
      if (!d || d.visible === false) continue;
      const sel = isSelected(d, opts);
      for (const s of zSpans(d.zFrom, d.zTo, L, false)) {
        ctx.fillStyle = sel ? '#a00000' : C.COLOURS.defect;
        ctx.fillRect(px(s[0]), y0 + 2, Math.max(2, px(s[1]) - px(s[0])), barH - 4);
      }
      if (sel) {
        ctx.strokeStyle = '#ff0000';
        ctx.lineWidth = 1.5;
        for (const zz of [d.zFrom, d.zTo]) {
          const x = px(M.clamp(zz, 0, L));
          ctx.beginPath(); ctx.moveTo(x, y0 - 12); ctx.lineTo(x, y1 + 4); ctx.stroke();
        }
      }
    }
    // zero marker: arrow pointing along +z
    ctx.fillStyle = '#000';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x0, y0 - 10); ctx.lineTo(x0 + 40, y0 - 10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x0 + 48, y0 - 10); ctx.lineTo(x0 + 38, y0 - 15); ctx.lineTo(x0 + 38, y0 - 5); ctx.closePath(); ctx.fill();
    ctx.font = '11px Segoe UI, Arial, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillText('Plate. Position ' + (st.hoverZ === null ? '' : Math.round(st.hoverZ)), w - 6, 4);
    ctx.restore();
  }

  // ------------------------------------------------------------------ self test
  function __selftest() {
    const f = [];
    if (zWindowTop(150, 300, 65) !== 120) f.push('zWindowTop mid ' + zWindowTop(150, 300, 65));
    if (zWindowTop(5, 300, 65) !== 0) f.push('zWindowTop clamp low');
    if (zWindowTop(290, 300, 65) !== 235) f.push('zWindowTop clamp high ' + zWindowTop(290, 300, 65));
    if (zWindowTop(20, 50, 65) !== 0) f.push('zWindowTop short specimen');
    if (snapSkew(12.4, false) !== 12 || snapSkew(12.4, true) !== 10 || snapSkew(-181, false) !== 179) f.push('snapSkew');
    if (Object.is(snapSkew(-0.2, false), -0)) f.push('snapSkew -0');
    const sp = zSpans(500, 20, 528.7, true);
    if (sp.length !== 2 || sp[0][0] !== 500 || Math.abs(sp[0][1] - 528.7) > 1e-9 || sp[1][0] !== 0 || sp[1][1] !== 20) f.push('zSpans wrap ' + JSON.stringify(sp));
    if (JSON.stringify(zSpans(120, 150, 300, false)) !== '[[120,150]]') f.push('zSpans plate');
    if (JSON.stringify(zSpans(150, 120, 300, false)) !== '[[120,150]]') f.push('zSpans plate reversed');
    const Cir = 480;
    for (const z of [0, 40, 123.4, 300, 479]) {
      const back = zAtAngle(circleAngle(z, Cir), Cir);
      if (Math.abs(back - z) > 1e-6) f.push('circle angle roundtrip ' + z + ' -> ' + back);
    }
    const a40 = circleAngle(40, Cir);   // 40 of 480 = 30° anticlockwise from the top → up-left
    if (!(Math.cos(a40) < 0 && Math.sin(a40) < 0)) f.push('circleAngle direction not anticlockwise');
    const d1 = ringDragSpan(76, 143, Cir);
    if (d1.zFrom !== 76 || d1.zTo !== 143) f.push('ringDragSpan forward ' + JSON.stringify(d1));
    const d2 = ringDragSpan(143, 76, Cir);
    if (d2.zFrom !== 76 || d2.zTo !== 143) f.push('ringDragSpan backward ' + JSON.stringify(d2));
    const d3 = ringDragSpan(470, 20, Cir);
    if (d3.zFrom !== 470 || d3.zTo !== 20) f.push('ringDragSpan wrap ' + JSON.stringify(d3));
    if (!zInDefect(10, { zFrom: 470, zTo: 20 }, Cir, true) || zInDefect(100, { zFrom: 470, zTo: 20 }, Cir, true)) f.push('zInDefect wrap');
    const dir = planDir(1, 0);
    if (Math.abs(dir.x + 1) > 1e-9 || Math.abs(dir.z) > 1e-9) f.push('planDir side+1');
    const dir2 = planDir(1, 30);
    if (!(dir2.x < 0 && dir2.z < 0)) f.push('planDir clockwise skew should point up-left on screen');
    if (Math.abs(wrapZ(-10, 300) - 290) > 1e-9) f.push('wrapZ');
    if (lighten('#00c000', 0.5) !== 'rgb(128,224,128)') f.push('lighten ' + lighten('#00c000', 0.5));
    // transform arithmetic with the fallback scale
    tf = { scale: 4, originX: 640, zTop: 120, windowMm: 65, w: 1280, h: 260, fieldW: 1236, L: 300 };
    const p = toPx(40, 150);
    if (p.x !== 800 || p.y !== 120) f.push('toPx ' + JSON.stringify(p));
    const mm = toMm(800, 120);
    if (Math.abs(mm.x - 40) > 1e-9 || Math.abs(mm.z - 150) > 1e-9 || mm.y !== mm.z) f.push('toMm ' + JSON.stringify(mm));
    if (isCompassHidden({ mode: 'dac' }) !== true || isCompassHidden({ mode: 'weld' }) !== false) f.push('compass hidden modes');
    return f;
  }

  const plan = {
    init, draw, toPx, toMm, fit, drawCircleView, drawLinearBar, clearTrail, __selftest,
    /** Pure helpers (exposed for tests). */
    helpers: { zWindowTop, snapSkew, wrapZ, zSpans, circleAngle, zAtAngle, ringDragSpan, zInDefect, planDir, lighten, isCompassHidden },
    /** Current transform (read-only snapshot). */
    get transform() { return Object.assign({}, tf); },
    css: [
      '#cv-plan, .plan-view-canvas { display: block; cursor: default; touch-action: none; }',
      '.plan-view-canvas.plan-grab { cursor: grabbing; }',
      '#cv-circle, .cv-circle { display: block; cursor: default; touch-action: none; background: #fff; }',
    ].join('\n'),
  };
  UT.views.plan = plan;
})(window.UT = window.UT || {});

</script>
<script>
// ---- src/64-view-3d.js ----
/* 64-view-3d.js — "3D Pipe" / "3D Plate" floating window: software-rendered 3-D view of the
 * specimen (SPEC §7.6, §14.11, §15.6). Painter's algorithm, flat shading, ≤ 400 faces, Canvas 2D only.
 *
 * World frame used by the mesh (millimetres):
 *   X = axial (= cross-section x, weld centre-line at 0), Y = up, Z = toward the viewer (before rotation).
 *   Pipe: a surface point at along-weld position z sits at angle φ = 2π·z/C from 12 o'clock
 *   (Y up), i.e. (a, r·cosφ, r·sinφ). Plate: z maps to world Z = z − L/2 on the top face (Y = 0).
 * View: rotate by yaw about Y, then by pitch about X, then perspective-project onto the canvas.
 */
// SPEC NOTES
// - Window: created in init() via UT.dom.win({name:'pipe3d'}) at (innerWidth − 300, innerHeight − 260),
//   canvas #cv-3d 260 × 200 px. Title '3D Pipe' for spec.pipe, '3D Plate' otherwise (updated on 'state').
// - Visibility model: `display.pipe3d` = "the user wants the 3-D window". The window is shown iff
//   display.pipe3d && specimen && (specimen.pipe || mode === 'weld'); the 'state' listener only calls
//   show()/hide() when that predicate CHANGES (so the app's own open()/close() calls never flap).
//   open() sets display.pipe3d = true and shows; close() (and the ✕ button) sets display.pipe3d = false.
// - Mesh: cylinder of length 220 mm (axial), 40 segments; the weld ring is a lighter band of capWidth
//   raised by max(2.5 mm, 2 % of OD) so it reads as a cap; both ends are open (annulus + inner bore),
//   the near end therefore shows the wall like the original's cut-away. Plate: slab 220 (x) × L (z) × T.
// - Plan-view z window: taken from UT.views.plan.transform {zTop, windowMm} when available, otherwise
//   zTop = clamp(probe.z − 30, 0, L − 65), window 65 mm (SPEC §14.2). Drawn as a black dotted rectangle
//   on the surface: z ∈ [zTop, zTop + window], axial ∈ ±min(60, L3d/2 − 15) mm.
// - Defects: 3 px red arcs (pipe) / patches (plate) at their z extent and bbox x centre; hidden when
//   display.hide or defect.visible === false. Probe: 16 mm green outlined square (2 px) at (x, z), rotated by skew.
// - Interaction: left-drag rotates (0.5° per px), wheel zooms ×1.1 per notch (0.4 … 4), double-click resets
//   to yaw −58°, pitch 26°, zoom 1. Rotation redraws the window directly (no global render).
// - Also exports toPx(x, z) (surface point → canvas px, null when facing away) and fit() (no-op) to
//   honour the §15.6 view contract; toMm() is not invertible for a 3-D view and returns null.
(function (UT) {
  'use strict';
  const M = UT.math;
  UT.views = UT.views || {};

  const CANVAS_W = 260, CANVAS_H = 200;
  const LENGTH_3D = 220;              // mm, axial length of the drawn pipe / slab
  const SEGMENTS = 40;                // cylinder facets
  const DEFAULT_VIEW = { yaw: -58, pitch: 26, zoom: 1 };
  const WINDOW_AXIAL_HALF = 60;       // mm, half axial extent of the plan-view window rectangle
  const PROBE_SIZE = 16;              // mm, side of the probe square
  const GRAZE_COS = 0.06;             // overlays vanish when the surface normal is nearly perpendicular to the view
  const COL = {
    outer: [0.88, 0.88, 0.88],
    weld: [1.0, 1.0, 1.0],
    end: [0.62, 0.70, 0.62],
    bore: [0.34, 0.34, 0.34],
    bottom: [0.60, 0.60, 0.60],
    side: [0.72, 0.72, 0.72],
  };
  const LIGHT = norm3([-0.45, 0.7, 0.6]);   // view-space light direction (upper-left, toward the viewer)

  let canvas = null, win = null;
  let view = Object.assign({}, DEFAULT_VIEW);
  let lastShown = null;      // last value of the visibility predicate acted upon
  let drag = null;
  let lastProj = null;       // projection of the last draw (for toPx)

  // ------------------------------------------------------------------ small vector helpers
  function norm3(v) { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }
  function sub3(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function dot3(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function cross3(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }

  // ------------------------------------------------------------------ geometry descriptor
  /**
   * Describe the 3-D body for a specimen: pipe (cylinder) or slab.
   * @param {object|null} spec  UT.state.specimen
   * @returns {object} {kind:'pipe'|'plate', L (along-weld length / circumference), len (axial), R, Ri, Rw, hw, bump, T, W}
   */
  function bodyOf(spec) {
    const weld = spec && spec.weld;
    const hw = weld && weld.type !== 'none' && weld.capWidth ? weld.capWidth / 2 : 0;
    if (spec && spec.pipe) {
      const od = spec.pipe.od || 168.3;
      const wt = Math.min(spec.pipe.wt || spec.T || 20, od / 2 - 1);
      const R = od / 2;
      const bump = Math.max(2.5, 0.02 * od);
      return { kind: 'pipe', L: spec.pipe.circumference || spec.L || Math.PI * od, len: LENGTH_3D, R, Ri: R - wt, Rw: R + bump, hw, bump, T: wt, W: LENGTH_3D };
    }
    const T = spec && spec.T ? spec.T : 20;
    const L = spec && spec.L ? spec.L : 300;
    const ex = spec && spec.extents;
    const W = ex ? Math.min(LENGTH_3D, Math.max(60, ex.xMax - ex.xMin)) : LENGTH_3D;
    const cx = ex ? (ex.xMin + ex.xMax) / 2 : 0;
    return { kind: 'plate', L, len: W, R: 0, Ri: 0, Rw: 0, hw, bump: hw ? 2.5 : 0, T, W, cx: spec && spec.kind === 'weld' ? 0 : cx };
  }

  /** Radius of the outer surface at axial position a (weld band is raised). */
  function radiusAt(body, a) { return body.kind === 'pipe' ? (Math.abs(a) <= body.hw ? body.Rw : body.R) : 0; }

  /**
   * World point (and outward normal) on the scanning surface at axial a and along-weld z, lifted by `lift` mm.
   * @returns {{p:number[], n:number[]}}
   */
  function surfacePoint(body, a, z, lift) {
    const l = lift || 0;
    if (body.kind === 'pipe') {
      const phi = 2 * Math.PI * z / body.L;
      const r = radiusAt(body, a) + l;
      const c = Math.cos(phi), s = Math.sin(phi);
      return { p: [a, r * c, r * s], n: [0, c, s] };
    }
    const y = (Math.abs(a - (body.cx || 0)) <= body.hw ? body.bump : 0) + l;
    return { p: [a, y, z - body.L / 2], n: [0, 1, 0] };
  }
