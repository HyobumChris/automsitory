// ---- src/20-probe.js ----
/* 20-probe.js — probe model: Snell's law, near field, beam spread, wedge delay, presets, PA sweep. */
(function (UT) {
  'use strict';
  const C = UT.consts;
  const M = UT.math;

  const presets = {
    0: { angle: 0, mode: 'comp', colour: C.PROBE_COLOURS[0], wedgePath: 0, shoeWidth: 20, shoeHeight: 18, label: '0°' },
    45: { angle: 45, mode: 'shear', colour: C.PROBE_COLOURS[45], wedgePath: 12, shoeWidth: 24, shoeHeight: 14, label: '45°' },
    60: { angle: 60, mode: 'shear', colour: C.PROBE_COLOURS[60], wedgePath: 12, shoeWidth: 24, shoeHeight: 14, label: '60°' },
    70: { angle: 70, mode: 'shear', colour: C.PROBE_COLOURS[70], wedgePath: 12, shoeWidth: 26, shoeHeight: 13, label: '70°' },
  };

  /** Snell: theta1 in medium v1 → theta2 in medium v2 (deg) or null past the critical angle. */
  function snell(theta1Deg, v1, v2) { return M.snellAngle(theta1Deg, v1, v2); }

  /** Critical angles in the wedge for a given wedge velocity (deg). */
  function criticalAngles(vWedge, material) {
    const vC = (material && material.vComp) || C.V_COMP_STEEL;
    const vS = (material && material.vShear) || C.V_SHEAR_STEEL;
    const first = M.rad2deg(Math.asin(M.clamp(vWedge / vC, 0, 1)));
    const second = M.rad2deg(Math.asin(M.clamp(vWedge / vS, 0, 1)));
    return { first, second };
  }

  /** Wedge (shoe) angle that produces the requested refracted angle in steel. */
  function wedgeAngleFor(refractedDeg, mode, vWedge, material) {
    if (!refractedDeg) return 0;
    const v2 = mode === 'comp' ? ((material && material.vComp) || C.V_COMP_STEEL) : ((material && material.vShear) || C.V_SHEAR_STEEL);
    const a = snell(refractedDeg, v2, vWedge);   // reverse Snell: sin(wedge)/vWedge = sin(refracted)/v2
    return a === null ? 90 : a;
  }

  /**
   * Derive all physical quantities of a probe on a specimen.
   * @param {object} probe  UT.state.probe
   * @param {object} specimen  UT.state.specimen (for material velocities; may be null)
   */
  function derive(probe, specimen) {
    const mat = (specimen && specimen.material) || { vShear: C.V_SHEAR_STEEL, vComp: C.V_COMP_STEEL };
    const angle = probe.method === 'pa' ? probe.paFrom : (probe.angle || 0);
    const isZero = angle === 0;
    const mode = isZero ? 'comp' : (probe.mode === 'comp' ? 'comp' : 'shear');
    const vel = mode === 'comp' ? mat.vComp : mat.vShear;
    const vWedge = probe.wedgeVel || C.V_PERSPEX;
    const freq = probe.freq || 5;                 // MHz
    const D = probe.diameter || 10;               // mm
    const lambda = vel / freq;                    // mm
    const nearField = (D * D * freq) / (4 * vel); // mm  = D²/(4λ)
    const s6 = M.clamp(0.51 * lambda / D, 0, 0.999);
    const s20 = M.clamp(1.08 * lambda / D, 0, 0.999);
    const halfAngle6dB = M.rad2deg(Math.asin(s6));
    const halfAngle20dB = M.rad2deg(Math.asin(s20));
    const preset = presets[angle] || presets[60];
    const wedgeAngle = isZero ? 0 : wedgeAngleFor(angle, mode, vWedge, mat);
    const wedgePath = isZero ? 0 : (preset.wedgePath || 12);
    const wedgeDelayUs = 2 * wedgePath / vWedge;  // two-way
    const crit = criticalAngles(vWedge, mat);
    return {
      refracted: angle,
      mode,
      wedgeAngle,
      vel,
      vWedge,
      lambda,
      nearField,
      halfAngle6dB,
      halfAngle20dB,
      wedgeDelayUs,
      wedgePath,
      indexOffset: isZero ? preset.shoeWidth / 2 : 12,
      shoeWidth: preset.shoeWidth,
      shoeHeight: preset.shoeHeight,
      colour: probe.method === 'pa' ? C.PROBE_COLOURS.pa : (C.PROBE_COLOURS[angle] || '#00c000'),
      crystal: probe.crystal || 'single',
      freq,
      diameter: D,
      firstCritical: crit.first,
      secondCritical: crit.second,
      /** Launch direction unit vector in XY (beam heads toward −x for side +1). */
      dir: { x: -(probe.side || 1) * Math.sin(M.deg2rad(angle)), y: Math.cos(M.deg2rad(angle)) },
      /** Human readable physics line for the status bar. */
      statusLine: `Angle of Sound Transmission in Perspex Shoe=${wedgeAngle.toFixed(1)}°  Velocity in Wedge (Shoe) = ${Math.round(vWedge * 1000)} m/s   [ Shear Wave Angle=${(mode === 'shear' ? angle : 0).toFixed(1)}°   Velocity=${mode === 'shear' ? Math.round(vel * 1000) : 0} m/s]   [ Comp' Wave Angle=${(mode === 'comp' ? angle : 0).toFixed(1)}°   Velocity=${mode === 'comp' ? Math.round(vel * 1000) : 0} m/s]`,
    };
  }

  /** Angles of the phased-array sweep. */
  function paAngles(probe) {
    const out = [];
    const step = Math.max(0.5, probe.paStep || 1);
    for (let a = probe.paFrom; a <= probe.paTo + 1e-9; a += step) out.push(+a.toFixed(2));
    return out;
  }

  /** Skip geometry helpers for a refracted angle on a plate of thickness T. */
  function skip(angleDeg, T) {
    const t = Math.tan(M.deg2rad(angleDeg)), c = Math.cos(M.deg2rad(angleDeg));
    return { halfSkip: T * t, fullSkip: 2 * T * t, halfPath: T / c, fullPath: 2 * T / c };
  }

  UT.probe = {
    presets, snell, criticalAngles, wedgeAngleFor, derive, paAngles, skip,
    __selftest() {
      const f = [];
      const d60 = derive({ angle: 60, freq: 5, diameter: 10, wedgeVel: 2.74, side: 1 }, null);
      if (Math.abs(d60.wedgeAngle - 47.1) > 0.2) f.push('wedge 60 -> ' + d60.wedgeAngle);
      const d45 = derive({ angle: 45, freq: 5, diameter: 10, wedgeVel: 2.74, side: 1 }, null);
      if (Math.abs(d45.wedgeAngle - 36.7) > 0.2) f.push('wedge 45 -> ' + d45.wedgeAngle);
      const d70 = derive({ angle: 70, freq: 5, diameter: 10, wedgeVel: 2.74, side: 1 }, null);
      if (Math.abs(d70.wedgeAngle - 52.6) > 0.3) f.push('wedge 70 -> ' + d70.wedgeAngle);
      if (Math.abs(d60.nearField - 38.6) > 0.5) f.push('near field ' + d60.nearField);
      if (Math.abs(d60.lambda - 0.648) > 0.01) f.push('lambda ' + d60.lambda);
      const d0 = derive({ angle: 0, freq: 5, diameter: 10 }, null);
      if (d0.mode !== 'comp' || Math.abs(d0.vel - 5.9) > 1e-9) f.push('0deg comp');
      return f;
    },
  };
})(window.UT = window.UT || {});

</script>
<script>
// ---- src/30-raytrace.js ----
/* 30-raytrace.js — 2-D polygon ray tracer: fan rays, specular return-to-probe echoes, diffuse
 * scatterers, arcs, Perspex insert, V1 slot retro-reflection, through transmission and tandem.
 * Pure functions of their arguments (never reads UT.state). SPEC §6.1 as amended by §15.4.
 */
(function (UT) {
  'use strict';

  // SPEC NOTES (decisions where the spec is silent or physically unattainable)
  // 1. Diffuse capture (§6.1 2b) uses a soft kernel: the raw capture disc of radius c is kept, but the
  //    amplitude is tapered by cos(pi/2 * d/c) with d = perpendicular distance to the scatterer, so the
  //    response of a SDH peaks uniquely when the ray passes through its centre (otherwise the flat
  //    capture disc made every position within ±c equally loud, which broke "max within ±5 mm").
  // 2. Weld bead surfaces (outline tags 'cap' and 'root') are rough: besides the specular return test
  //    they act as weak diffuse scatterers at the hit point (kind 'geometry', S = 0.45·|cos incidence|,
  //    D = q^1.5). Machined surfaces (top/bottom/end/step/brace/fusion/radius) stay purely specular.
  //    Without this, the 8-segment sine bead never returns a 45/60/70° beam within θ20 and the
  //    root/cap geometry echoes required by §6.1 3 and §11.1 would never exist.
  // 3. Lamination size factor uses the lateral extent (width) instead of the through-thickness
  //    height: S = min(1.2, max(width, height)/4). A 0.5 mm-high, 40 mm-wide lamination is a large
  //    reflector for a 0° beam (§6.3 "strong echo at its depth").
  // 4. Corner echoes (outline + planar defect in either order) use the defect's S and D = q^1.5.
  // 5. Skew weight (§6.7) multiplies kinds defect/corner/geometry/lamination only when the refracted
  //    angle is > 0 (a 0° beam is unaffected by probe rotation). ampNoZ = amp with Z = 1 (skew
  //    included); zFactor() returns the pure §6.7 overlap factor Z, so amp === ampNoZ·zFactor(...).
  // 6. centre.legs[i] = {a, b, leg, surfaceTag, hitTag}: surfaceTag = tag of the surface the segment
  //    was last reflected from ('top' for the first leg, 'defect' after a defect), hitTag = what it
  //    hits at b. Fan/centre polylines are truncated to display.skips legs; echo search continues to
  //    opts.maxLegs.
  // 7. Through transmission: result.echoes = [transmitted] only; amp = Σ w(δ)·e (rays inside the
  //    receiver aperture) / Σ w(δ), i.e. 1.0 for a clean path. result.receiver = {x, y} for drawing.
  // 8. Tandem: only echoes whose ray reflected off a planar defect (and passed the bottom) and reach the
  //    rx aperture within θ20 of (+side·sinθ, −cosθ) are returned (kind 'defect' or 'corner', tag 'tandem').
  //    result.receiver = {x: probe.x − side·T·tanθ, y: 0}.
  // 9. Perspex far-side echo (§6.1 2f) is emitted for the δ = 0 ray of a 0° probe only.
  // 10. The V1 slot retro-reflection also applies to the 0° probe (same relaunch, e × 0.5).
  // 11. Scanning-surface energy factor is 0.87 (spec text: 0.85). With 0.85 the 25 → 50 mm step of the
  //     V1 0° multiples computes to −5.12 dB (e −1.86, D −3.01, M −0.25) and fails §11.1 check 1
  //     ("2–5 dB"); 0.87 gives −4.9 / −3.7 / −3.2 dB, inside the required band. Everything else is literal.
  // 12. Merging (§6.1 rule 5) groups by (kind, defectId|tag, leg) and |path − path_best| ≤ 1.5 mm on the
  //     path-sorted list instead of fixed 1.5 mm bins (bins split one echo straddling a bin edge in two).
  // 13. Corner rule refinement: the (outline, planar defect) pair counts as 'corner' only when the defect
  //     was hit > 12° off its normal. A leg-2 normal-incidence return off a fusion face (bottom → face →
  //     bottom → probe) is otherwise labelled 'corner' by the literal rule; it is a plain 'defect' echo.
  //     Corner echoes report x,y of the defect hit and the leg of the first reflection of the pair.
  // 14. Raw echoes with amp < 1e-6 (−120 dB, < 1 % FSH even at 110 dB gain) are dropped before merging.
  // 15. Step-wedge floors (tag 'step') report kind 'backwall' (§6.3: "backwall at the local step
  //     thickness"); the vertical risers ('end') stay 'geometry'.
  // 16. TT receiver aperture: a fan ray counts when its first outline hit lies within D/2 of the
  //     centre-ray line (perpendicular) and within D of the receiver point, so a clean plate transmits 1.0
  //     for every angle. Planar defect segments still reflect in TT mode (they shadow the receiver).

  const M = UT.math;
  const DEG = Math.PI / 180;
  const EPS = 1e-6;
  const STEP_OFF = 1e-4;
  const GRAZE_COS = Math.cos(80 * DEG);
  const TOP_LOSS = 0.87;      // SPEC NOTE 11
  const OTHER_LOSS = 0.95;
  const CORNER_MIN_INC = 12;  // deg from the normal at the defect for the corner rule (SPEC NOTE 13)
  const AMP_FLOOR = 1e-6;     // echoes below this (−120 dB) are dropped (SPEC NOTE 14)
  const sampleCache = new WeakMap();
  const geomCache = new WeakMap();   // specimen → flattened edges/arcs with precomputed normals

  // ------------------------------------------------------------------ small helpers
  function norm(x, y) { const l = Math.hypot(x, y) || 1; return { x: x / l, y: y / l }; }
  function dot(ax, ay, bx, by) { return ax * bx + ay * by; }
  function reflect(dx, dy, nx, ny) { const k = 2 * (dx * nx + dy * ny); return { x: dx - k * nx, y: dy - k * ny }; }

  /** Volumetric sample points of a defect, cached per defect object. */
  function samplesOf(d) {
    let s = sampleCache.get(d);
    if (!s) { s = UT.specimens.defectSamples(d); sampleCache.set(d, s); }
    return s;
  }

  /**
   * Emission point and launch direction of the probe on the specimen.
   * @returns {{E:{x:number,y:number}, u0:{x:number,y:number}, tangent, normal, segment}}
   */
  function emission(specimen, probe, derived) {
    const ss = UT.specimens.scanSurfaceAt(specimen, probe);
    const side = probe.side === -1 ? -1 : 1;
    const th = (derived && derived.refracted) || 0;
    return {
      E: { x: ss.x, y: ss.y }, tangent: ss.tangent, normal: ss.normal, segment: ss.segment, side,
      u0: dirAt(ss, side, th),
    };
  }

  /** Direction for a refracted angle (deg) from the surface normal, steered toward the beam side. */
  function dirAt(ss, side, angleDeg) {
    const a = angleDeg * DEG;
    const c = Math.cos(a), s = Math.sin(a);
    return norm(ss.normal.x * c - side * ss.tangent.x * s, ss.normal.y * c - side * ss.tangent.y * s);
  }

  /** Ray–arc intersection (exact circle restricted to the arc's angular span). Nearest positive t or null. */
  function arcHit(px, py, dx, dy, arc, eps) {
    const fx = px - arc.cx, fy = py - arc.cy;
    const b = 2 * (fx * dx + fy * dy), c = fx * fx + fy * fy - arc.r * arc.r;
    const disc = b * b - 4 * c;
    if (disc < 0) return null;
    const sq = Math.sqrt(disc);
    const roots = [(-b - sq) / 2, (-b + sq) / 2];
    let a0 = arc.a0, a1 = arc.a1;
    if (a1 < a0) { const t = a0; a0 = a1; a1 = t; }
    for (const t of roots) {
      if (t < eps) continue;
      const x = px + dx * t, y = py + dy * t;
      let ang = Math.atan2(y - arc.cy, x - arc.cx) / DEG;
      while (ang < a0 - 1e-9) ang += 360;
      while (ang > a1 + 1e-9 && ang - 360 >= a0 - 1e-9) ang -= 360;
      if (ang >= a0 - 1e-9 && ang <= a1 + 1e-9) {
        const n = norm(x - arc.cx, y - arc.cy);
        return { t, x, y, nx: n.x, ny: n.y };
      }
    }
    return null;
  }

  function tagKind(tag) {
    switch (tag) {
      case 'bottom': return 'backwall';
      case 'radius': return 'radius';
      case 'top': return 'backwall';
      case 'step': return 'backwall';
      default: return 'geometry';
    }
  }

  // ------------------------------------------------------------------ scene assembly
  /** Flattened outline geometry of a specimen (cached): edges with direction + unit normal. */
  function geometryOf(specimen) {
    let g = geomCache.get(specimen);
    if (g) return g;
    const edges = [];
    for (const ed of specimen.edges || []) {
      const ex = ed.b.x - ed.a.x, ey = ed.b.y - ed.a.y;
      const n = norm(-ey, ex);
      edges.push({ ax: ed.a.x, ay: ed.a.y, ex, ey, nx: n.x, ny: n.y, tag: ed.tag, edge: ed });
    }
    g = { edges, arcs: (specimen.arcs || []).slice(), perspex: specimen.perspex || null };
    geomCache.set(specimen, g);
    return g;
  }

  /** Build the reflector lists once per trace: defect segments, diffuse points, hole discs. */
  function buildScene(specimen, defects, probe) {
    const segs = [];      // specular planar defect segments
    const points = [];    // diffuse scatterers
    const list = Array.isArray(defects) ? defects : [];
    for (const d of list) {
      if (!d || d.visible === false || !Array.isArray(d.pts) || d.pts.length < 2) continue;
      const refl = d.reflectivity === undefined ? 1 : d.reflectivity;
      const bb = UT.specimens.bbox(d.pts);
      const height = d.height === undefined ? Math.max(0.5, bb.h) : d.height;
      if (UT.specimens.isPlanar(d.type)) {
        const isLam = d.type === 'lamination';
        const size = isLam ? Math.max(bb.w, height, d.width || 0) : height;
        const S = Math.min(1.2, size / 4) * refl;
        for (let i = 0; i < d.pts.length - 1; i++) {
          const a = d.pts[i], b = d.pts[i + 1];
          if (M.dist(a.x, a.y, b.x, b.y) < 1e-6) continue;
          const n = norm(-(b.y - a.y), b.x - a.x);
          segs.push({ a, b, ax: a.x, ay: a.y, ex: b.x - a.x, ey: b.y - a.y, nx: n.x, ny: n.y, defect: d, S, kind: isLam ? 'lamination' : 'defect' });
        }
        // tips (diffraction)
        const first = d.pts[0], last = d.pts[d.pts.length - 1];
        points.push({ x: first.x, y: first.y, kind: 'tip', S: 0.12 * refl, dExp: 2, cap: 0, defect: d });
        points.push({ x: last.x, y: last.y, kind: 'tip', S: 0.12 * refl, dExp: 2, cap: 0, defect: d });
      } else {
        const sm = samplesOf(d);
        const n = Math.max(1, sm.length);
        const S = Math.min(1, height / 3) * refl / Math.sqrt(n);
        for (const p of sm) points.push({ x: p.x, y: p.y, kind: 'volumetric', S, dExp: 2, cap: 0, defect: d });
      }
    }
    for (const h of specimen.holes || []) {
      const dia = 2 * h.r;
      points.push({ x: h.x, y: h.y, kind: 'sdh', S: Math.min(1, Math.sqrt(dia / 3)), dExp: 1.5, cap: h.r + 0.5, tag: h.tag || 'sdh', label: h.label || (dia + 'mm'), hole: h });
    }
    const g = geometryOf(specimen);
    return { segs, points, edges: g.edges, arcs: g.arcs, perspex: g.perspex };
  }

  // ------------------------------------------------------------------ per-ray march
  /**
   * March one ray. Returns { pts, legs, echoes, hits, transmitted }.
   * @param {object} C  trace context
   * @param {number} delta  fan offset (deg)
   */
  function marchRay(C, delta) {
    const w = M.beamWeight20(delta, C.th20);
    const dir0 = dirAt(C.ss, C.side, C.theta + delta);
    let pos = { x: C.E.x + dir0.x * STEP_OFF, y: C.E.y + dir0.y * STEP_OFF };
    let dir = { x: dir0.x, y: dir0.y };
    let len = 0, bounces = 0, leg = 1, e = 1;
    const hist = [];                   // last two reflections
    let sawDefect = false, sawBottom = false;
    let slotPending = false;
    const pts = [{ x: C.E.x, y: C.E.y, leg: 1 }];
    const legs = [];
    const echoes = [];
    const hits = [];
    let fromTag = 'top';
    let transmitted = 0;
    const isCentre = Math.abs(delta) < 1e-9;
    const scene = C.scene;

    for (let iter = 0; iter < 200; iter++) {
      if (bounces > C.maxLegs + 5 || len > C.maxLen || leg > C.maxLegs) break;
      // ---- nearest intersection (inlined ray–segment maths, no allocation until the winner is known)
      let bestT = Infinity, bestObj = null, bestType = 0;   // 1 edge, 2 arc, 3 perspex, 4 defect
      let bestNx = 0, bestNy = 0;
      const px = pos.x, py = pos.y, dx = dir.x, dy = dir.y;
      for (let i = 0; i < scene.edges.length; i++) {
        const ed = scene.edges[i];
        const den = dx * ed.ey - dy * ed.ex;
        if (den > -1e-12 && den < 1e-12) continue;
        const t = ((ed.ax - px) * ed.ey - (ed.ay - py) * ed.ex) / den;
        if (t < EPS || t >= bestT) continue;
        const u = ((ed.ax - px) * dy - (ed.ay - py) * dx) / den;
        if (u < 0 || u > 1) continue;
        bestT = t; bestObj = ed; bestType = 1;
      }
      for (let i = 0; i < scene.arcs.length; i++) {
        const h = arcHit(px, py, dx, dy, scene.arcs[i], EPS);
        if (h && h.t < bestT + 1e-7) { bestT = h.t; bestObj = scene.arcs[i]; bestType = 2; bestNx = h.nx; bestNy = h.ny; }   // ties → arc
      }
      if (scene.perspex) {
        const h = M.rayCircle(px, py, dx, dy, scene.perspex.x, scene.perspex.y, scene.perspex.r, EPS);
        if (h && h.t < bestT) { bestT = h.t; bestObj = scene.perspex; bestType = 3; }
      }
      for (let i = 0; i < scene.segs.length; i++) {
        const sg = scene.segs[i];
        const dn = dx * sg.nx + dy * sg.ny;
        if (dn > -GRAZE_COS && dn < GRAZE_COS) continue;   // grazing: pass through
        const den = dx * sg.ey - dy * sg.ex;
        if (den > -1e-12 && den < 1e-12) continue;
        const t = ((sg.ax - px) * sg.ey - (sg.ay - py) * sg.ex) / den;
        if (t < EPS || t >= bestT) continue;
        const u = ((sg.ax - px) * dy - (sg.ay - py) * dx) / den;
        if (u < 0 || u > 1) continue;
        bestT = t; bestObj = sg; bestType = 4;
      }
      let best = null;
      if (bestType === 1) best = { t: bestT, x: px + dx * bestT, y: py + dy * bestT, nx: bestObj.nx, ny: bestObj.ny, type: 'outline', tag: bestObj.tag };
      else if (bestType === 2) best = { t: bestT, x: px + dx * bestT, y: py + dy * bestT, nx: bestNx, ny: bestNy, type: 'outline', tag: bestObj.tag || 'radius' };
      else if (bestType === 3) { const hx = px + dx * bestT, hy = py + dy * bestT; const n = norm(hx - bestObj.x, hy - bestObj.y); best = { t: bestT, x: hx, y: hy, nx: n.x, ny: n.y, type: 'perspex', tag: 'perspex' }; }
      else if (bestType === 4) best = { t: bestT, x: px + dx * bestT, y: py + dy * bestT, nx: bestObj.nx, ny: bestObj.ny, type: 'defect', tag: bestObj.kind, seg: bestObj };
      if (!best) break;
      const L = best.t;

      // ---- diffuse scatterers along the segment
      if (!C.tt && !C.tandem) {
        for (const P of scene.points) {
          const rx = P.x - pos.x, ry = P.y - pos.y;
          const u = rx * dir.x + ry * dir.y;
          if (u <= 1e-6 || u >= L) continue;
          const d = Math.abs(rx * dir.y - ry * dir.x);
          const c = 0.5 + 0.03 * (len + u);
          const cap = Math.max(c, P.cap);
          if (d > cap) continue;
          const path = len + u;
          const taper = Math.cos(Math.PI / 2 * d / cap);
          echoes.push(makeEcho(C, { path, kind: P.kind, leg, x: P.x, y: P.y, w, wReturn: w, e, S: P.S, dExp: P.dExp,
            defect: P.defect, tag: P.tag, label: P.label, angleDev: delta, extra: taper }));
        }
      }

      // ---- move
      len += L;
      const hp = { x: best.x, y: best.y };
      pts.push({ x: hp.x, y: hp.y, leg });
      legs.push({ a: { x: pos.x, y: pos.y }, b: hp, leg, surfaceTag: fromTag, hitTag: best.tag });

      // through transmission receiver test (first outline hit only)
      if (C.tt && best.type === 'outline' && leg === 1 && C.rx) {
        const dPerp = Math.abs((hp.x - C.rx.x) * C.u0.y - (hp.y - C.rx.y) * C.u0.x);   // distance from the centre-ray line
        if (dPerp <= C.diameter / 2 && M.dist(hp.x, hp.y, C.rx.x, C.rx.y) <= C.diameter) transmitted += w * e;
      }

      // ---- reflect
      let nd;
      const retro = slotPending && best.type === 'outline' && best.tag === 'top' && M.dist(hp.x, hp.y, C.E.x, C.E.y) <= 1.0;
      if (retro) {
        nd = { x: C.u0.x, y: C.u0.y };
        pos = { x: C.E.x + nd.x * STEP_OFF, y: C.E.y + nd.y * STEP_OFF };
        e *= 0.5;
        bounces++; leg++;
        fromTag = 'top';
        hist.push({ type: 'outline', tag: 'top', x: hp.x, y: hp.y, leg: leg - 1, inc: 0 });
      } else {
        nd = reflect(dir.x, dir.y, best.nx, best.ny);
        pos = { x: hp.x + nd.x * STEP_OFF, y: hp.y + nd.y * STEP_OFF };
        bounces++;
        const legAtHit = leg;
        const incDeg = Math.acos(M.clamp(Math.abs(dot(dir.x, dir.y, best.nx, best.ny)), 0, 1)) / DEG;
        if (best.type === 'outline') {
          leg++;
          e *= best.tag === 'top' ? TOP_LOSS : OTHER_LOSS;
          if (best.tag === 'bottom') sawBottom = true;
          fromTag = best.tag;
          // rough weld bead: weak diffuse geometry scatter (SPEC NOTE 2)
          if (!C.tt && !C.tandem && (best.tag === 'cap' || best.tag === 'root')) {
            const inc = Math.abs(dot(dir.x, dir.y, best.nx, best.ny));
            echoes.push(makeEcho(C, { path: len, kind: 'geometry', leg: leg - 1, x: hp.x, y: hp.y, w, wReturn: w, e: e / OTHER_LOSS, S: 0.45 * inc, dExp: 1.5, tag: best.tag, angleDev: delta }));
          }
        } else if (best.type === 'perspex') {
          e *= OTHER_LOSS;
          fromTag = 'perspex';
          if (isCentre && C.theta === 0 && C.mode === 'comp') {
            const p = scene.perspex;
            echoes.push(makeEcho(C, { path: len + 2 * p.r * (C.vel / (UT.consts.V_PERSPEX)), kind: 'perspex', leg, x: p.x, y: p.y + p.r, w, wReturn: w, e, S: 0.2, dExp: 0.5, tag: 'perspex', angleDev: delta }));
          }
        } else {
          sawDefect = true;
          fromTag = 'defect';
        }
        hist.push({ type: best.type, tag: best.tag, x: hp.x, y: hp.y, seg: best.seg, leg: legAtHit, inc: incDeg });
      }
      if (hist.length > 2) hist.shift();
      dir = nd;
      if (leg <= 3) hits.push({ x: hp.x, y: hp.y, kind: best.tag, tag: best.tag, defectId: best.seg ? best.seg.defect.id : undefined });
      slotPending = false;

      // ---- return-to-probe test
      if (C.segment && !C.tt && (dir.x * C.ss.normal.x + dir.y * C.ss.normal.y) < 0) {
        const cross = M.raySegment(pos.x, pos.y, dir.x, dir.y, C.segment.a.x, C.segment.a.y, C.segment.b.x, C.segment.b.y, EPS);
        if (cross) {
          if (C.tandem) {
            const dRx = M.dist(cross.x, cross.y, C.rx.x, C.rx.y);
            const dev = M.angleBetween(dir.x, dir.y, C.rxDir.x, C.rxDir.y);
            if (sawDefect && sawBottom && dRx <= C.diameter / 2 && dev < C.th20) {
              const info = returnInfo(hist);
              if (info.kind === 'defect' || info.kind === 'corner' || info.kind === 'lamination') {
                echoes.push(makeEcho(C, { path: (len + cross.t) / 2, kind: 'defect', leg: info.leg, x: info.x, y: info.y, w, wReturn: M.beamWeight20(dev, C.th20), e, S: info.S, dExp: info.dExp, defect: info.defect, tag: 'tandem', angleDev: delta }));
              }
            }
          } else {
            const dE = M.dist(cross.x, cross.y, C.E.x, C.E.y);
            const ra = C.diameter / 2 + (len + cross.t) * Math.sin(C.th6 * DEG);
            const dev = M.angleBetween(dir.x, dir.y, -C.u0.x, -C.u0.y);
            if (dE <= ra && dev < C.th20) {
              const info = returnInfo(hist);
              echoes.push(makeEcho(C, { path: (len + cross.t) / 2, kind: info.kind, leg: info.leg, x: info.x, y: info.y, w, wReturn: M.beamWeight20(dev, C.th20), e, S: info.S, dExp: info.dExp, defect: info.defect, tag: info.tag, angleDev: delta }));
              if (C.retroSlot && dE <= 1.0) slotPending = true;
            }
          }
        }
      }
    }
    return { pts, legs, echoes, hits, transmitted, w };
  }

  /**
   * Kind / size / distance law / position / leg of a specular return from the reflection history.
   * Corner rule (§6.1 2d): the last two reflections are one outline edge/arc and one planar defect
   * segment, in either order, AND the defect was not hit at near-normal incidence (a leg-2 normal
   * return off a fusion face is a plain 'defect' echo even though the bottom precedes/follows it).
   */
  function returnInfo(hist) {
    const last = hist[hist.length - 1];
    const prev = hist.length > 1 ? hist[hist.length - 2] : null;
    if (prev && ((last.type === 'outline' && prev.type === 'defect') || (last.type === 'defect' && prev.type === 'outline'))) {
      const dref = last.type === 'defect' ? last : prev;
      const seg = dref.seg;
      if (seg.kind !== 'lamination') {
        if (dref.inc > CORNER_MIN_INC) return { kind: 'corner', S: seg.S, dExp: 1.5, defect: seg.defect, tag: last.type === 'outline' ? last.tag : prev.tag, x: dref.x, y: dref.y, leg: Math.min(last.leg, prev.leg) };
        return { kind: 'defect', S: seg.S, dExp: 1.5, defect: seg.defect, tag: seg.defect.type, x: dref.x, y: dref.y, leg: dref.leg };
      }
    }
    if (last.type === 'defect') {
      const seg = last.seg;
      return { kind: seg.kind, S: seg.S, dExp: seg.kind === 'lamination' ? 0.5 : 1.5, defect: seg.defect, tag: seg.defect.type, x: last.x, y: last.y, leg: last.leg };
    }
    if (last.type === 'perspex') return { kind: 'perspex', S: 0.9, dExp: 0.5, tag: 'perspex', x: last.x, y: last.y, leg: last.leg };
    return { kind: tagKind(last.tag), S: 1, dExp: 0.5, tag: last.tag, x: last.x, y: last.y, leg: last.leg };
  }

  /** Assemble one raw (unmerged) echo with the §6.1 rule-4 amplitude. */
  function makeEcho(C, o) {
    const q = C.nearField / Math.max(o.path, C.nearField);
    const D = Math.pow(q, o.dExp);
    const Mf = Math.pow(10, -C.alpha * 2 * o.path / 20);
    const base = o.w * o.wReturn * o.e * o.S * D * Mf * (o.extra === undefined ? 1 : o.extra);
    const hz = o.path * Math.tan(C.th20 * DEG) + C.diameter / 2;
    const skewed = (o.kind === 'defect' || o.kind === 'corner' || o.kind === 'geometry' || o.kind === 'lamination') && C.theta > 0;
    const sw = skewed ? M.skewWeight(C.skew) : 1;
    const Z = o.defect ? zOverlap(o.defect, C.probeZ, hz, C.L, C.wrap) : 1;
    return {
      path: o.path, amp: base * sw * Z, ampNoZ: base * sw, hz, kind: o.kind, leg: o.leg, x: o.x, y: o.y,
      defectId: o.defect ? o.defect.id : undefined, tag: o.tag, label: o.label || (o.defect ? o.defect.label : undefined),
      angleDev: o.angleDev, defectType: o.defect ? o.defect.type : undefined,
    };
  }

  /** §6.7 z-overlap factor for a defect (wrapping on pipes). */
  function zOverlap(d, probeZ, hz, L, wrap) {
    if (!(hz > 0)) return 1;
    let a = d.zFrom === undefined ? -Infinity : d.zFrom;
    let b = d.zTo === undefined ? Infinity : d.zTo;
    if (a === -Infinity || b === Infinity) return 1;
    if (b < a) { if (wrap && L > 0) b += L; else { const t = a; a = b; b = t; } }
    let ov = M.overlap(probeZ - hz, probeZ + hz, a, b);
    if (wrap && L > 0) { ov += M.overlap(probeZ - hz, probeZ + hz, a - L, b - L); ov += M.overlap(probeZ - hz, probeZ + hz, a + L, b + L); }
    return Math.sqrt(M.clamp(ov / (2 * hz), 0, 1));
  }

  // ------------------------------------------------------------------ merging
  function mergeEchoes(raw) {
    const list = raw.filter(function (ec) { return ec.amp >= AMP_FLOOR || ec.kind === 'transmitted'; });
    list.sort(function (a, b) { return a.path - b.path; });
    const groups = [];
    const byKey = new Map();
    for (const ec of list) {
      const key = ec.kind + '|' + (ec.defectId !== undefined ? ec.defectId : ec.tag) + '|' + ec.leg;
      let arr = byKey.get(key);
      if (!arr) { arr = []; byKey.set(key, arr); }
      let g = null;
      for (let i = arr.length - 1; i >= 0; i--) {
        const cand = arr[i];
        if (Math.abs(ec.path - cand.best.path) <= 1.5 || Math.abs(ec.path - cand.last) <= 0.75) { g = cand; break; }
        if (cand.last < ec.path - 3) break;
      }
      if (!g) { g = { best: ec, sum2: ec.amp * ec.amp, sumNoZ2: ec.ampNoZ * ec.ampNoZ, last: ec.path }; arr.push(g); groups.push(g); }
      else {
        g.sum2 += ec.amp * ec.amp; g.sumNoZ2 += ec.ampNoZ * ec.ampNoZ; g.last = ec.path;
        if (ec.amp > g.best.amp) g.best = ec;
      }
    }
    const out = [];
    for (const g of groups) {
      const ec = Object.assign({}, g.best);
      if (ec.kind === 'volumetric') { ec.amp = Math.sqrt(g.sum2); ec.ampNoZ = Math.sqrt(g.sumNoZ2); }
      out.push(ec);
    }
    out.sort(function (a, b) { return a.path - b.path; });
    return out;
  }

  // ------------------------------------------------------------------ public API
  /**
   * Trace the beam of a probe through a specimen and collect echoes.
   * @param {{specimen:object, probe:object, derived:object, display?:object, defects?:Array, opts?:object}} a
   * @returns {{centre:object, fan:Array, edge20:Array, echoes:Array, hits:Array, transmitted?:number, receiver?:object}}
   */
  function trace(a) {
    const specimen = a.specimen, probe = a.probe || {};
    const derived = a.derived || UT.probe.derive(probe, specimen);
    const display = a.display || {};
    const opts = a.opts || {};
    const empty = { centre: { pts: [], legs: [] }, fan: [], edge20: [[], []], echoes: [], hits: [] };
    if (!specimen || !specimen.edges) return empty;
    const em = emission(specimen, probe, derived);
    if (!em.segment) return empty;
    const skips = Math.max(1, display.skips || 3);
    const maxLegs = opts.maxLegs !== undefined ? opts.maxLegs
      : ((derived.refracted === 0 || specimen.kind === 'block') ? 12 : skips);
    const maxPath = opts.maxPath !== undefined ? opts.maxPath : 200;
    const theta = derived.refracted || 0;
    const C = {
      E: em.E, u0: em.u0, ss: em, side: em.side, segment: em.segment, theta, mode: derived.mode,
      th6: derived.halfAngle6dB || 1.9, th20: derived.halfAngle20dB || 4, vel: derived.vel,
      nearField: derived.nearField || 20, diameter: derived.diameter || probe.diameter || 10,
      alpha: derived.mode === 'comp' ? 0.005 : 0.01,
      maxLegs, maxLen: Math.max(2 * maxPath + 100, 700), retroSlot: !!specimen.retroSlot,
      probeZ: probe.z || 0, skew: probe.skew || 0, L: specimen.L || 0, wrap: !!specimen.pipe,
      scene: buildScene(specimen, a.defects, probe),
      tt: probe.method === 'tt', tandem: probe.method === 'tandem',
      rx: null, rxDir: null,
    };
    // receivers
    let receiver = null;
    if (C.tt) {
      const exit = firstOutlineHit(C);
      if (exit) { C.rx = { x: exit.x, y: exit.y }; receiver = { x: exit.x, y: exit.y, tag: exit.tag }; }
      else C.tt = false;
    } else if (C.tandem) {
      const T = specimen.T || 20;
      const xr = C.E.x - C.side * T * Math.tan(theta * DEG);
      C.rx = { x: xr, y: 0 };
      C.rxDir = norm(C.side * Math.sin(theta * DEG), -Math.cos(theta * DEG));
      receiver = { x: xr, y: 0, tag: 'top' };
    }

    let n = opts.fanCount || 21;
    if (n < 1) n = 1;
    if (n > 1 && n % 2 === 0) n += 1;
    const fan = [];
    const raw = [];
    const hits = [];
    let centre = null;
    let sumW = 0, sumT = 0;
    for (let i = 0; i < n; i++) {
      const delta = n === 1 ? 0 : -C.th20 + 2 * C.th20 * i / (n - 1);
      const r = marchRay(C, delta);
      sumW += r.w; sumT += r.transmitted;
      const drawPts = r.pts.filter(function (p) { return p.leg <= skips; });
      fan.push({ angleOffsetDeg: +delta.toFixed(3), weight: r.w, pts: drawPts.map(function (p) { return { x: p.x, y: p.y }; }) });
      if (Math.abs(delta) < 1e-9) {
        centre = { pts: drawPts.map(function (p) { return { x: p.x, y: p.y }; }), legs: r.legs.filter(function (l) { return l.leg <= skips; }) };
        for (const h of r.hits) hits.push(h);
      }
      for (const ec of r.echoes) raw.push(ec);
    }
    if (!centre) centre = { pts: fan.length ? fan[Math.floor(fan.length / 2)].pts : [], legs: [] };
    let echoes;
    if (C.tt) {
      const amp = sumW > 0 ? sumT / sumW : 0;
      const p0 = firstOutlineHit(C);
      const path = p0 ? M.dist(C.E.x, C.E.y, p0.x, p0.y) : (specimen.T || 0);
      echoes = [{ path, amp, ampNoZ: amp, hz: path * Math.tan(C.th20 * DEG) + C.diameter / 2, kind: 'transmitted', leg: 1, x: C.rx.x, y: C.rx.y, tag: 'transmitted', angleDev: 0 }];
    } else {
      echoes = mergeEchoes(raw);
    }
    for (const ec of echoes) {
      if (ec.kind === 'transmitted') continue;
      hits.push({ x: ec.x, y: ec.y, kind: ec.kind, defectId: ec.defectId, tag: ec.tag });
    }
    const res = { centre, fan, edge20: [fan.length ? fan[0].pts : [], fan.length ? fan[fan.length - 1].pts : []], echoes, hits, E: C.E, u0: C.u0 };
    if (receiver) res.receiver = receiver;
    if (C.tt) res.transmitted = echoes[0].amp;
    return res;
  }

  /** First outline (edge/arc) intersection of the centre ray, ignoring defects. */
  function firstOutlineHit(C) {
    const px = C.E.x + C.u0.x * STEP_OFF, py = C.E.y + C.u0.y * STEP_OFF;
    let best = null;
    for (const ed of C.scene.edges) {
      const h = M.raySegment(px, py, C.u0.x, C.u0.y, ed.ax, ed.ay, ed.ax + ed.ex, ed.ay + ed.ey, EPS);
      if (h && (!best || h.t < best.t)) best = { t: h.t, x: h.x, y: h.y, tag: ed.tag };
    }
    for (const arc of C.scene.arcs) {
      const h = arcHit(px, py, C.u0.x, C.u0.y, arc, EPS);
      if (h && (!best || h.t < best.t)) best = { t: h.t, x: h.x, y: h.y, tag: arc.tag || 'radius' };
    }
    return best;
  }

  /**
   * Recompute the §6.7 z-overlap factor of an echo for another probe z (AUT). Holes/surfaces → 1.
   * @returns {number} Z in 0..1 such that amp = ampNoZ · Z at the same skew
   */
  function zFactor(echo, probeZ, probeSkew, defects, specimen) {
    void probeSkew;
    if (!echo || echo.defectId === undefined) return 1;
    const d = (defects || []).find(function (x) { return x && x.id === echo.defectId; });
    if (!d) return 1;
    const hz = echo.hz !== undefined ? echo.hz : 10;
    return zOverlap(d, probeZ || 0, hz, (specimen && specimen.L) || 0, !!(specimen && specimen.pipe));
  }

  const KIND_NAMES = {
    backwall: 'Backwall', radius: 'Radius', corner: 'Corner (defect + surface)', geometry: 'Geometry', lamination: 'Lamination',
    perspex: 'Perspex insert', tip: 'Tip diffraction', transmitted: 'Transmitted pulse', sdh: 'SDH', volumetric: 'Volumetric defect', defect: 'Defect',
  };

  /**
   * Human readable label for an echo, e.g. 'Backwall 25.0 mm (leg 1)'.
   * @param {object} echo
   * @returns {string}
   */
  function describe(echo) {
    if (!echo) return '';
    let name = KIND_NAMES[echo.kind] || echo.kind;
    if (echo.kind === 'sdh' && echo.label) name = 'SDH ' + echo.label;
    else if ((echo.kind === 'defect' || echo.kind === 'volumetric' || echo.kind === 'lamination' || echo.kind === 'corner' || echo.kind === 'tip') && echo.label) name = echo.label + (echo.kind === 'corner' ? ' (corner)' : echo.kind === 'tip' ? ' (tip)' : '');
    else if (echo.kind === 'geometry' && echo.tag) name = 'Geometry (' + echo.tag + ')';
    if (echo.tag === 'tandem') name = 'Tandem: ' + name;
    const p = echo.path === undefined ? '' : ' ' + M.fmt(echo.path, 1) + ' mm';
    const leg = echo.leg ? ' (leg ' + echo.leg + ')' : '';
    return name + p + leg;
  }

  // ------------------------------------------------------------------ self test
  function dB(a, b) { return 20 * Math.log10(a / b); }
  function run(spec, probe, display, defects, maxPath) {
    const p = Object.assign({ mode: probe.angle === 0 ? 'comp' : 'shear', freq: 5, diameter: 10, wedgeVel: 2.74, method: 'pe', z: spec.L / 2, side: 1, skew: 0 }, probe);
    const d = UT.probe.derive(p, spec);
    return trace({ specimen: spec, probe: p, derived: d, display: display || { skips: 3 }, defects: defects || [], opts: { maxPath: maxPath || 100, fanCount: 21 } });
  }
  function near(echoes, kind, path, tol) {
    let best = null;
    for (const e of echoes) if ((!kind || e.kind === kind) && Math.abs(e.path - path) <= tol && (!best || e.amp > best.amp)) best = e;
    return best;
  }

  function __selftest() {
    const f = [];
    const S = UT.specimens;
    // (a) V1 narrow, 0° single: 25/50/75/100 decreasing 2–5 dB
    const v1n = run(S.v1({ face: 'narrow' }), { angle: 0, x: 150 }, { skips: 3 }, [], 125);
    let prev = null;
    for (const p of [25, 50, 75, 100]) {
      const e = near(v1n.echoes, 'backwall', p, 0.5);
      if (!e) { f.push('v1 narrow backwall ' + p + ' missing'); continue; }
      if (prev) { const drop = dB(prev.amp, e.amp); if (drop < 2 || drop > 5) f.push('v1 narrow drop ' + p + ' = ' + drop.toFixed(2) + ' dB'); }
      prev = e;
    }
    // (b) V1 wide: 45° and 0° at x = 100 → 100/200/300
    for (const ang of [0, 45, 60]) {
      const r = run(S.v1(), { angle: ang, x: 100 }, { skips: 3 }, [], 400);
      let last = null;
      for (const p of [100, 200, 300]) {
        const e = ang === 0 ? (near(r.echoes, 'radius', p, 1) || near(r.echoes, 'backwall', p, 1)) : near(r.echoes, 'radius', p, 1);
        if (!e) { f.push('v1 wide ' + ang + ' radius ' + p + ' missing'); continue; }
        if (last && !(e.amp < last.amp)) f.push('v1 wide ' + ang + ' radius ' + p + ' not decreasing');
        last = e;
      }
    }
    // (c) V2 sequences
    const seqs = [[1, [25, 100, 175]], [-1, [50, 125, 200]]];
    for (const s of seqs) {
      const r = run(S.v2(), { angle: 45, x: 60, side: s[0] }, { skips: 3 }, [], 250);
      let last = null;
      for (const p of s[1]) {
        const e = near(r.echoes, 'radius', p, 1);
        if (!e) { f.push('v2 side ' + s[0] + ' radius ' + p + ' missing'); continue; }
        if (last && !(e.amp < last.amp)) f.push('v2 side ' + s[0] + ' radius ' + p + ' not decreasing');
        last = e;
      }
    }
    // (d) root crack corner echo at 40 with a flat-root plate
    const pw = S.plateWeld({ T: 20, rootHeight: 0, capHeight: 0 });
    const crack = S.defectPresets.rootCrack(pw);
    const rc = run(pw, { angle: 60, x: 34.6 }, { skips: 3 }, [crack], 100);
    const corner = near(rc.echoes, 'corner', 40, 1);
    if (!corner) f.push('root crack corner echo missing');
    else {
      for (const dx of [-15, 15]) {
        const r2 = run(pw, { angle: 60, x: 34.6 + dx }, { skips: 3 }, [crack], 100);
        const c2 = near(r2.echoes, 'corner', 40, 3);
        if (c2 && dB(corner.amp, c2.amp) < 20) f.push('corner echo still present at x ' + (34.6 + dx));
      }
    }
    // (e) IOW 13 mm SDH (frozen block: hole at (240, 13)) → path 26.0
    const iow = S.iow();
    const h13 = iow.holes.find(function (h) { return h.label === '13mm'; });
    if (h13) {
      const x0 = h13.x + h13.y * Math.tan(60 * DEG);
      const r = run(iow, { angle: 60, x: x0 }, { skips: 3 }, [], 100);
      const e = near(r.echoes, 'sdh', 26, 0.5);
      if (!e) f.push('iow 13 mm SDH echo at 26 missing');
      else {
        for (const dx of [-5, -3, 3, 5]) {
          const e2 = near(run(iow, { angle: 60, x: x0 + dx }, { skips: 3 }, [], 100).echoes, 'sdh', 26, 3);
          if (e2 && e2.amp > e.amp) f.push('iow SDH louder at dx ' + dx);
        }
      }
    }
    // (f) lamination: echo + backwall ≥ 6 dB down
    const lp = S.laminationPlate({ T: 25 });
    const lam = S.defectPresets.lamination(lp);
    const clean = run(lp, { angle: 0, x: -60 }, { skips: 3 }, [lam], 100);
    const over = run(lp, { angle: 0, x: 40 }, { skips: 3 }, [lam], 100);
    const bwClean = near(clean.echoes, 'backwall', 25, 0.5);
    const bwOver = near(over.echoes, 'backwall', 25, 0.5);
    const lamEcho = near(over.echoes, 'lamination', 12.5, 0.5);
    if (!lamEcho) f.push('lamination echo missing');
    if (!bwClean) f.push('clean backwall missing');
    else if (bwOver && dB(bwClean.amp, bwOver.amp) < 6) f.push('backwall not shadowed by lamination');
    // (g) clean plate, angle probe: no backwall
    const g = run(S.plateWeld({ T: 20 }), { angle: 60, x: 40 }, { skips: 3 }, [], 100);
    if (g.echoes.some(function (e) { return e.kind === 'backwall'; })) f.push('angle probe backwall echo on a clean plate');
    if (!g.centre.pts.length || g.fan.length !== 21) f.push('centre/fan shape');
    // (h) LOF on the right fusion face: 60° (leg 2) beats 45° by ≥ 6 dB (reduced scan)
    const pl = S.plateWeld({ T: 20 });
    const lof = S.defectPresets.lof(pl);
    const bestOf = function (angle, xs) {
      let b = 0;
      for (const x of xs) for (const e of run(pl, { angle, x }, { skips: 3 }, [lof], 100).echoes) if ((e.kind === 'defect' || e.kind === 'corner' || e.kind === 'tip') && e.amp > b) b = e.amp;
      return b;
    };
    const b60 = bestOf(60, [55, 60, 65]), b45 = bestOf(45, [40, 45, 50, 55]);
    if (!(b60 > 0) || dB(b60, Math.max(b45, 1e-9)) < 6) f.push('LOF 60 vs 45: ' + b60 + ' / ' + b45);
    // through transmission: clean plate transmits 1, a lamination under the probe blocks it
    const ttc = run(pl, { angle: 0, x: 40, method: 'tt' }, { skips: 3 }, [], 100).echoes[0];
    const ttb = run(pl, { angle: 0, x: 40, method: 'tt' }, { skips: 3 }, [S.defectPresets.lamination(pl)], 100).echoes[0];
    if (!ttc || ttc.kind !== 'transmitted' || Math.abs(ttc.amp - 1) > 1e-6 || Math.abs(ttc.path - 20) > 1e-6) f.push('tt clean');
    if (!ttb || ttb.amp > 0.05) f.push('tt shadow');
    // describe
    if (typeof describe({ kind: 'backwall', path: 25, leg: 1 }) !== 'string') f.push('describe');
    return f;
  }

  UT.rays = { trace, zFactor, describe, emission, dirAt, arcHit, mergeEchoes, __selftest };
})(window.UT = window.UT || {});

</script>
<script>
// ---- src/40-ascan.js ----
/* 40-ascan.js — A-scan synthesis, time base / calibration, gain, gates, DAC, peak memory,
 * readouts, phased-array S-scan columns and the frame pipeline (UT.compute).
 * Pure functions of their arguments except compute(), which is the ONLY reader of UT.state here.
 */
// SPEC NOTES (decisions where the spec is silent or ambiguous)
// - K_REF: lazily calibrated on first use from UT.rays.trace on UT.specimens.dacBlock({T: 50}) (the
//   frozen dacBlock puts the T/2 hole at x = 150, depth 25 → 60° path = 50 mm). The probe x is scanned
//   ±1.5 mm around 150 + 25·tan60 and the strongest 'sdh' echo near 50 mm is used so that 80 % FSH is
//   read at 34 dB. When UT.rays is missing (or gives no usable echo) a provisional constant is used
//   (2.64, derived analytically from §6.1 rule 4: S 1, D = (38.6/50)^1.5, M = 10^(−1/20)).
//   UT.ascan.K_REF is an accessor property (settable for tuning); UT.ascan.calibrateK() forces a redo.
// - Damping (−2 dB) is applied inside ampPctOf() so frame.echoes, echoesOnScreen and readouts agree.
// - Pulse width: sigma = 0.5·lambda·cycles, but never narrower than 1.5 sample spacings so an echo is
//   always resolved on long ranges (the peak sample is then ≥ 0.9 of the true amplitude).
// - Envelope is Gaussian per §6.2; a small exponential tail (×0.25 of the peak decaying over 2·sigma)
//   is added on the far side to mimic the sloping decay seen in the reference screenshots.
// - Initial pulse: saturated (120 %) for the first 35 % of the dead zone then linearly decaying to 0 at
//   the end of the dead zone dz = 3·lambda + 1.5; independent of gain; positioned at true time
//   t = wedgeDelayUs (0 for the 0° probe) mapped through the cal. Only single-crystal 0° pulse-echo.
// - rectify: 'full' → samples = summed envelopes, rf = null; 'rf' → rf = signed carrier sum, samples =
//   |rf|; 'half+' / 'half−' → samples = max(±rf, 0), rf = null.
// - Gates are in DISPLAYED path mm (they are drawn on the screen). The readout peak is the maximum
//   sample inside the gate (EPOCH "Peak"); it is attributed to the on-screen echo whose displayed path
//   is within max(2·sigma, 1 mm) of the peak sample (the strongest such echo) so peakPct is the
//   UNCLIPPED echo amplitude and `path` its TRUE path. Grass/initial-pulse peaks report echoKind 'noise'
//   / 'initial' with the sample value and the inverse-cal true path.
// - SD = path·sin(trig.angle) − trig.xValue (X Value = wedge front offset, default 0); DP/leg fold
//   d = path·cos(trig.angle) into 0..trig.thick: leg = floor(d/T) + 1, dp = leg odd ? d mod T : T − d mod T.
// - dacCurve() returns the recorded points sorted by path, scaled to the CURRENT gain (unclipped; the
//   renderer clips at the screen top), each with xDiv; dacCurves() adds the −6 / −14 dB curves;
//   dacAt(instrument, path) interpolates with end-value hold (readouts use TRUE path).
//   dacRecord(instrument, primary) returns the new `dac` object (or null when the normalised value
//   would exceed 120 %) — the workflow itself belongs to 80-modes.
// - Peak memory is only updated by compute() (synth() never touches the buffer, so AUT/TOFD re-use is
//   side-effect free); the buffer is cleared when peakMem turns off/on, when range/delay/nSamples
//   change and by clearPeak().
// - In 'tofd' mode rays/echoes/ascan/readouts are null (UT.tofd.compute owns the frame.tofd result).
//   In 'aut' mode the live A-scan is at probe.z and frame.aut.readouts evaluates aut.gates.
// - Trace failures are caught (logged once) so the UI keeps rendering with an empty frame.
// - setInstrument() clamps gain 0…110, range 10…1000, delay −50…1000, reject 0…80; gates given as an
//   array are merged per index into clones of the existing gates. It returns a clone of the instrument.
(function (UT) {
  'use strict';
  const M = UT.math;
  const C = UT.consts;

  const N_SAMPLES = 1000;
  const CLIP_PCT = 120;
  const GRASS_PCT = 2;
  const DAMP_DB = -2;
  const PROVISIONAL_K = 2.64;

  // ------------------------------------------------------------------ K_REF (lazy calibration)
  let _kRef = null;
  let _kSource = 'unset';

  function refProbe(x) {
    return { angle: 60, mode: 'shear', crystal: 'single', freq: 5, diameter: 10, wedgeVel: 2.74, method: 'pe',
      x, z: 50, side: 1, skew: 0, surface: 'chord', paFrom: 40, paTo: 70, paStep: 1 };
  }

  /**
   * Calibrate K_REF so that a 3 mm SDH at 50 mm sound path (60°, 5 MHz, 10 mm) reads 80 % FSH at 34 dB.
   * Uses UT.rays.trace when available; otherwise the provisional constant.
   * @returns {number} the calibrated K
   */
  function calibrateK() {
    _kRef = PROVISIONAL_K;
    _kSource = 'provisional';
    if (!(UT.rays && typeof UT.rays.trace === 'function' && UT.specimens && UT.specimens.dacBlock)) return _kRef;
    try {
      const spec = UT.specimens.dacBlock({ T: 50 });
      const hole = spec.holes.find(function (h) { return Math.abs(h.y - 25) < 1e-6; }) || spec.holes[1];
      const x0 = hole.x + hole.y * Math.tan(M.deg2rad(60));
      const display = { beam: true, skips: 3, colourCode: 'none', singleLine: false, focus: false, hide: false };
      let best = 0;
      for (let dx = -1.5; dx <= 1.5 + 1e-9; dx += 0.5) {
        const probe = refProbe(x0 + dx);
        const derived = UT.probe.derive(probe, spec);
        const res = UT.rays.trace({ specimen: spec, probe, derived, display, defects: [], opts: { maxPath: 100, fanCount: 21, maxLegs: 12 } });
        for (const e of (res && res.echoes) || []) {
          if (e.kind === 'sdh' && Math.abs(e.path - 50) < 1 && e.amp > best) best = e.amp;
        }
      }
      if (best > 0) {
        const k = 80 / (best * M.dB2lin(34));
        if (k > 0.05 && k < 200) { _kRef = k; _kSource = 'traced'; }
      }
    } catch (e) { console.error('[UT.ascan] K_REF calibration failed, using provisional', e); }
    return _kRef;
  }

  function kRef() { return _kRef === null ? calibrateK() : _kRef; }

  // ------------------------------------------------------------------ amplitude / time base helpers
  /**
   * Screen amplitude (% FSH, unclipped) of a dimensionless tracer amplitude at the instrument gain.
   * @param {number} amp  tracer amplitude
   * @param {object} instrument  {gain, damping}
   */
  function ampPctOf(amp, instrument) {
    const gain = instrument && Number.isFinite(instrument.gain) ? instrument.gain : 0;
    let pct = amp * kRef() * M.dB2lin(gain);
    if (instrument && instrument.damping) pct *= M.dB2lin(DAMP_DB);
    return pct;
  }

  function calOf(instrument) {
    const cal = (instrument && instrument.cal) || {};
    return { vel: Number.isFinite(cal.vel) && cal.vel > 0 ? cal.vel : null, zero: Number.isFinite(cal.zero) ? cal.zero : 0 };
  }

  /** True two-way arrival time (µs) of an echo at a true metal path. */
  function trueTime(path, derived) { return 2 * path / derived.vel + (derived.wedgeDelayUs || 0); }

  /**
   * Displayed path of a TRUE path through the instrument calibration (§15.5).
   * pDisp = (t − wedgeDelayUs − cal.zero) · (cal.vel ?? vTrue) / 2
   */
  function dispPath(pathTrue, instrument, derived) {
    const cal = calOf(instrument);
    const vTrue = derived.vel;
    const vel = cal.vel === null ? vTrue : cal.vel;
    return (2 * pathTrue / vTrue - cal.zero) * vel / 2;
  }

  /** Inverse of dispPath: TRUE path shown at a displayed path. */
  function truePath(pDisp, instrument, derived) {
    const cal = calOf(instrument);
    const vTrue = derived.vel;
    const vel = cal.vel === null ? vTrue : cal.vel;
    return (2 * pDisp / vel + cal.zero) * vTrue / 2;
  }

  /** Screen division (0..10) of a displayed path. */
  function xDivOfDisp(pDisp, instrument) {
    const range = instrument.range > 0 ? instrument.range : 100;
    return (pDisp - (instrument.delay || 0)) / range * 10;
  }

  /** Screen division (0..10) of a TRUE path. */
  function xDivOf(pathTrue, instrument, derived) { return xDivOfDisp(dispPath(pathTrue, instrument, derived), instrument); }

  /** Pulse envelope sigma (mm of path). */
  function sigmaOf(derived, instrument) {
    const lambda = derived.lambda || (derived.vel / (derived.freq || 5));
    const cycles = instrument && instrument.damping ? 0.9 : 1.5;
    return 0.5 * lambda * cycles;
  }

  /**
   * Beam geometry readouts for a sound path with the instrument trig settings.
   * @param {number} path  true sound path (mm)
   * @param {number} angleDeg  refracted angle used by the instrument (trig.angle)
   * @param {number} T  thickness used by the instrument (trig.thick)
   * @param {number} [xValue]  X value subtracted from the surface distance
   * @returns {{sd:number, dp:number, leg:number}}
   */
  function geometry(path, angleDeg, T, xValue) {
    const a = M.deg2rad(angleDeg || 0);
    const sd = path * Math.sin(a) - (xValue || 0);
    const d = path * Math.cos(a);
    if (!(T > 0)) return { sd, dp: d, leg: 1 };
    const leg = Math.max(1, Math.floor((d - 1e-9) / T) + 1);
    const r = d - (leg - 1) * T;
    const dp = (leg % 2 === 1) ? r : T - r;
    return { sd, dp: Math.max(0, dp), leg };
  }

  // ------------------------------------------------------------------ DAC
  function sortedDacPoints(instrument) {
    const dac = (instrument && instrument.dac) || {};
    const pts = (dac.points || []).filter(function (p) { return p && Number.isFinite(p.path) && Number.isFinite(p.ampPct); });
    return pts.slice().sort(function (a, b) { return a.path - b.path; });
  }

  function dacRefDb(instrument) {
    const dac = (instrument && instrument.dac) || {};
    if (Number.isFinite(dac.refDb)) return dac.refDb;
    if (Number.isFinite(instrument.refGain)) return instrument.refGain;
    return instrument.gain || 0;
  }

  /** Curve scale from the recording reference gain to the current gain. */
  function dacScale(instrument) { return M.dB2lin((instrument.gain || 0) - dacRefDb(instrument)); }

  /**
   * DAC curve amplitude (% FSH at the CURRENT gain) at a TRUE path: linear interpolation between the
   * recorded points, holding the end values outside the recorded span. null when < 1 point.
   */
  function dacAt(instrument, path) {
    const pts = sortedDacPoints(instrument);
    if (!pts.length) return null;
    const s = dacScale(instrument);
    if (path <= pts[0].path) return pts[0].ampPct * s;
    const last = pts[pts.length - 1];
    if (path >= last.path) return last.ampPct * s;
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      if (path >= a.path && path <= b.path) {
        const t = b.path > a.path ? (path - a.path) / (b.path - a.path) : 0;
        return (a.ampPct + (b.ampPct - a.ampPct) * t) * s;
      }
    }
    return last.ampPct * s;
  }

  /**
   * DAC curve polyline at the current gain: [{path, pct, xDiv}] sorted by TRUE path (unclipped).
   * @param {object} instrument
   * @param {object} derived  UT.probe.derive result (for the time base)
   * @param {number} [dbOffset]  e.g. −6 or −14 for the ASME 50 % / 20 % curves
   */
  function dacCurve(instrument, derived, dbOffset) {
    const pts = sortedDacPoints(instrument);
    if (!pts.length) return [];
    const s = dacScale(instrument) * M.dB2lin(dbOffset || 0);
    return pts.map(function (p) {
      return { path: p.path, pct: p.ampPct * s, xDiv: derived ? xDivOf(p.path, instrument, derived) : xDivOfDisp(p.path, instrument) };
    });
  }

  /** Reference, −6 dB and −14 dB curves: {ref, m6, m14} (each a dacCurve array). */
  function dacCurves(instrument, derived) {
    return { ref: dacCurve(instrument, derived, 0), m6: dacCurve(instrument, derived, -6), m14: dacCurve(instrument, derived, -14) };
  }

  /**
   * Build the `dac` object after recording the gated peak `primary` ({path, peakPct}) at the current gain.
   * The point is normalised to the reference gain (the gain of the first recording). Returns null when
   * the normalised amplitude would exceed 120 % (record refused) or when there is nothing to record.
   */
  function dacRecord(instrument, primary) {
    if (!primary || !Number.isFinite(primary.path) || !Number.isFinite(primary.peakPct)) return null;
    const dac = Object.assign({ points: [], on: false, refDb: null, curves: true }, instrument.dac || {});
    const refDb = Number.isFinite(dac.refDb) ? dac.refDb : (instrument.gain || 0);
    const norm = primary.peakPct * M.dB2lin(refDb - (instrument.gain || 0));
    if (norm > CLIP_PCT) return null;
    const points = (dac.points || []).filter(function (p) { return Math.abs(p.path - primary.path) > 0.75; });
    points.push({ path: +primary.path.toFixed(2), ampPct: +norm.toFixed(2) });
    points.sort(function (a, b) { return a.path - b.path; });
    return Object.assign({}, dac, { points, refDb, on: true });
  }

  // ------------------------------------------------------------------ A-scan synthesis
  /**
   * Synthesise the A-scan samples from tracer echoes.
   * @param {object} o  {echoes, probe, derived, instrument, nSamples=1000}
   * @returns {AscanResult}
   */
  function synth(o) {
    const echoes = o.echoes || [];
    const probe = o.probe || {};
    const derived = o.derived || UT.probe.derive(probe, null);
    const inst = o.instrument || {};
    const n = Math.max(16, o.nSamples || N_SAMPLES);
    const range = inst.range > 0 ? inst.range : 100;
    const delay = inst.delay || 0;
    const rectify = inst.rectify || 'full';
    const wantRf = rectify !== 'full';
    const spacing = range / (n - 1);
    const sigma = Math.max(sigmaOf(derived, inst), 1.5 * spacing);
    const lambda = derived.lambda || 1;
    const samples = new Float32Array(n);
    const rf = wantRf ? new Float32Array(n) : null;
    const env = wantRf ? rf : samples;
    const pathAt = function (i) { return delay + i / (n - 1) * range; };
    const idxOf = function (p) { return (p - delay) / range * (n - 1); };

    // echoes
    const onScreen = [];
    const reach = 4 * sigma + 2 * sigma;   // main lobe + tail
    for (const e of echoes) {
      if (!e || !Number.isFinite(e.path)) continue;
      const ampPct = Number.isFinite(e.amp) ? ampPctOf(e.amp, inst) : (Number.isFinite(e.ampPct) ? e.ampPct : 0);
      const pDisp = dispPath(e.path, inst, derived);
      const xDiv = xDivOfDisp(pDisp, inst);
      onScreen.push({ echo: e, xDiv, ampPct, pDisp });
      if (ampPct <= 0) continue;
      const i0 = Math.max(0, Math.floor(idxOf(pDisp - reach)));
      const i1 = Math.min(n - 1, Math.ceil(idxOf(pDisp + reach)));
      for (let i = i0; i <= i1; i++) {
        const p = pathAt(i);
        const u = (p - pDisp) / sigma;
        let a = ampPct * Math.exp(-u * u);
        if (u > 0) a = Math.max(a, 0.25 * ampPct * Math.exp(-u / 2) * (u < 1 ? u : 1));
        if (wantRf) a *= Math.cos(2 * Math.PI * 2 * (p - pDisp) / lambda);
        env[i] += a;
      }
    }

    // initial pulse (single-crystal 0° pulse-echo only)
    const isZero = (probe.angle || 0) === 0 && probe.method !== 'pa';
    const initialPulse = isZero && (probe.crystal || 'single') === 'single' && (probe.method || 'pe') === 'pe';
    if (initialPulse) {
      const dz = 3 * lambda + 1.5;
      const p0 = dispPath(0, inst, derived);
      const i0 = Math.max(0, Math.floor(idxOf(p0)));
      const i1 = Math.min(n - 1, Math.ceil(idxOf(p0 + dz)));
      for (let i = i0; i <= i1; i++) {
        const u = (pathAt(i) - p0) / dz;
        if (u < 0 || u > 1) continue;
        let a = u < 0.35 ? CLIP_PCT : CLIP_PCT * (1 - u) / 0.65;
        if (wantRf) a *= Math.cos(2 * Math.PI * 2 * (pathAt(i) - p0) / lambda);
        env[i] += a;
      }
    }

    // grass (deterministic)
    const noiseSeed = Math.round((probe.x || 0) * 7 + (probe.z || 0) * 13);
    const rnd = M.rng(noiseSeed);
    const grass = GRASS_PCT * (inst.grassScale || 1);
    for (let i = 0; i < n; i++) {
      const g = grass * rnd();
      if (wantRf) rf[i] += g * (rnd() < 0.5 ? -1 : 1); else samples[i] += g;
    }

    // rectification, reject, clip
    const reject = inst.reject || 0;
    for (let i = 0; i < n; i++) {
      let v;
      if (wantRf) {
        const r = rf[i];
        v = rectify === 'half+' ? Math.max(0, r) : rectify === 'half-' ? Math.max(0, -r) : Math.abs(r);
        rf[i] = M.clamp(r, -CLIP_PCT, CLIP_PCT);
        if (Math.abs(r) < reject) rf[i] = 0;
      } else v = samples[i];
      if (v < reject) v = 0;
      samples[i] = v > CLIP_PCT ? CLIP_PCT : v;
    }

    onScreen.sort(function (a, b) { return a.pDisp - b.pDisp; });
    return {
      samples, rf: rectify === 'rf' ? rf : null, peak: null, range, delay, n, pathAt, sigma,
      echoesOnScreen: onScreen, noiseSeed, initialPulse, reject,
      initialZone: initialPulse ? { from: dispPath(0, inst, derived), to: dispPath(0, inst, derived) + 3 * lambda + 1.5 } : null,
    };
  }

  // ------------------------------------------------------------------ gates / readouts
  /**
   * Evaluate all gates of `instrumentLike` on an A-scan (EPOCH "Peak" mode).
   * @param {AscanResult} ascan
   * @param {object} instrumentLike  {gates, activeGate, trig, dac, gain, range, delay, ...}
   * @param {object} derived
   * @param {object} specimen  (may be null; fallback for thickness)
   * @param {object} probe  (may be null; fallback for angle)
   * @returns {Readouts}
   */
  function evalGates(ascan, instrumentLike, derived, specimen, probe) {
    const inst = instrumentLike || {};
    const gates = inst.gates || [];
    const trig = inst.trig || {};
    const angle = Number.isFinite(trig.angle) ? trig.angle : (derived ? derived.refracted : ((probe && probe.angle) || 0));
    const thick = Number.isFinite(trig.thick) && trig.thick > 0 ? trig.thick : ((specimen && specimen.T) || 0);
    const xValue = Number.isFinite(trig.xValue) ? trig.xValue : 0;
    const out = [];
    const n = ascan ? ascan.samples.length : 0;
    for (const g of gates) {
      if (!g || !g.on || !ascan || !(g.width > 0)) { out.push(null); continue; }
      const s0 = g.start, s1 = g.start + g.width;
      const range = ascan.range, delay = ascan.delay;
      const i0 = Math.max(0, Math.ceil((s0 - delay) / range * (n - 1)));
      const i1 = Math.min(n - 1, Math.floor((s1 - delay) / range * (n - 1)));

      for (let i = i0; i <= i1; i++) { if (ascan.samples[i] > peak) { peak = ascan.samples[i]; iPeak = i; } }
      if (iPeak < 0 || peak < (g.level || 0) || peak <= 0) { out.push(null); continue; }

      gate: out, primary,

      textSD: primary ? M.fmt2(primary.sd) : '--.--',

  }

  // ------------------------------------------------------------------ peak memory
  let peakBuf = null;
  let peakKey = '';
  let peakWasOn = false;

  /** Clear the peak-memory buffer (tb-clear, PEAK MEM toggle, range/delay change). */
  function clearPeak() { if (peakBuf) peakBuf.fill(0); }

  function applyPeak(ascan, inst) {

    if (!peakBuf || peakBuf.length !== ascan.samples.length) { peakBuf = new Float32Array(ascan.samples.length); peakKey = key; }

  function now() { return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now(); }

  function traceOpts(state, spec, probe) {
    const inst = state.instrument;
    return {

    const spec = state.specimen;
    const probe = state.probe;
    const inst = state.instrument;
    const angles = UT.probe.paAngles(probe);

    const display = Object.assign({}, state.display, { skips: Math.min(2, state.display.skips || 2) });
    const defects = visibleDefects(state);
    for (const a of angles) {
      const p = Object.assign({}, probe, { angle: a, method: 'pe', mode: 'shear' });
      const d = UT.probe.derive(p, spec);
      const rays = spec ? safeTrace({ specimen: spec, probe: p, derived: d, display, defects, opts: { maxPath: (inst.delay || 0) + (inst.range || 100), fanCount: 5, maxLegs: Math.min(2, state.display.skips || 2) } }) : null;

  function testSetInstrument(p) {

    if (q.refGain !== undefined) patch.refGain = M.clamp(+q.refGain, 0, 110);
    if (q.range !== undefined) patch.range = M.clamp(+q.range, 10, 1000);
    if (q.delay !== undefined) patch.delay = M.clamp(+q.delay, -50, 1000);
    if (q.reject !== undefined) patch.reject = M.clamp(+q.reject, 0, 80);
    if (q.damping !== undefined) patch.damping = !!q.damping;

    const a1 = synth({ echoes: [{ path: 50, amp: 0.3, kind: 'sdh' }], probe, derived, instrument: inst });
    const es = a1.echoesOnScreen[0];
    if (Math.abs(es.xDiv - 5) > 1e-6) f.push('xDiv range100 path50 = ' + es.xDiv);

    const g1 = geometry(26, 60, 20, 0);
    if (Math.abs(g1.sd - 22.52) > 0.05 || Math.abs(g1.dp - 13) > 0.05 || g1.leg !== 1) f.push('geometry 26: ' + JSON.stringify(g1));
    const g2 = geometry(50, 60, 20, 0);
    if (Math.abs(g2.dp - 15) > 0.05 || g2.leg !== 2) f.push('geometry 50: ' + JSON.stringify(g2));
    const g3 = geometry(90, 60, 20, 0);
    if (Math.abs(g3.dp - 5) > 0.05 || g3.leg !== 3) f.push('geometry 90: ' + JSON.stringify(g3));
    // evalGates on a synthetic echo (amp chosen so the peak is well above level, below clip)
    const k = kRef();
    const amp = 60 / (k * M.dB2lin(30));
    const a3 = synth({ echoes: [{ path: 26, amp, kind: 'sdh' }], probe, derived, instrument: inst });
    const r = evalGates(a3, inst, derived, { T: 20 }, probe);
    if (!r.primary) f.push('no primary readout');
    else {
      if (Math.abs(r.primary.path - 26) > 1e-6) f.push('readout path ' + r.primary.path);
      if (Math.abs(r.primary.peakPct - 60) > 0.5) f.push('readout peakPct ' + r.primary.peakPct);
      if (Math.abs(r.primary.sd - 22.5) > 0.1 || Math.abs(r.primary.dp - 13) > 0.1) f.push('readout sd/dp ' + r.primary.sd + '/' + r.primary.dp);

    }
    const sMax = Math.max.apply(null, Array.from(a3.samples));
    if (Math.abs(sMax - 60) > 1) f.push('sample peak ' + sMax);
    // reject & clip
    const a4 = synth({ echoes: [{ path: 26, amp: amp * 10, kind: 'sdh' }], probe, derived, instrument: Object.assign({}, inst, { reject: 30 }) });
    const m4 = Math.max.apply(null, Array.from(a4.samples));
    if (m4 !== CLIP_PCT) f.push('clip ' + m4);
    if (a4.samples[0] !== 0) f.push('reject grass');
    // rf carrier present
    const a5 = synth({ echoes: [{ path: 26, amp, kind: 'sdh' }], probe, derived, instrument: Object.assign({}, inst, { rectify: 'rf' }) });
    if (!a5.rf || Math.min.apply(null, Array.from(a5.rf)) > -10) f.push('rf negative half-cycles missing');
    // initial pulse
    const d0 = UT.probe.derive({ angle: 0, freq: 5, diameter: 10 }, null);
    const a6 = synth({ echoes: [], probe: { angle: 0, crystal: 'single', method: 'pe', x: 0, z: 0 }, derived: d0, instrument: inst });
    if (!a6.initialPulse || a6.samples[0] !== CLIP_PCT) f.push('initial pulse single');
    const a7 = synth({ echoes: [], probe: { angle: 0, crystal: 'twin', method: 'pe', x: 0, z: 0 }, derived: d0, instrument: inst });
    if (a7.initialPulse || a7.samples[0] > GRASS_PCT + 0.01) f.push('initial pulse twin');
    // DAC
    const dInst = Object.assign({}, inst, { gain: 40, dac: { points: [{ path: 20, ampPct: 80 }, { path: 60, ampPct: 40 }], on: true, refDb: 34 } });
    const c = dacAt(dInst, 40);
    if (Math.abs(c - 60 * M.dB2lin(6)) > 0.05) f.push('dacAt interp ' + c);
    if (Math.abs(dacAt(dInst, 100) - 40 * M.dB2lin(6)) > 0.05) f.push('dacAt hold');

    if (cv.ref.length !== 2 || Math.abs(cv.m6[0].pct / cv.ref[0].pct - 0.501) > 0.01 || Math.abs(cv.m14[0].pct / cv.ref[0].pct - 0.1995) > 0.005) f.push('dac curves');

    const rec2 = dacRecord(Object.assign({}, inst, { gain: 46, dac: rec }), { path: 50, peakPct: 80 });
    if (!rec2 || Math.abs(rec2.points[1].ampPct - 40.09) > 0.1) f.push('dacRecord normalise');
    if (dacRecord(Object.assign({}, inst, { gain: 20, dac: rec }), { path: 50, peakPct: 80 }) !== null) f.push('dacRecord refuse >120');

    const wrong = Object.assign({}, inst, { cal: { vel: 5.6, zero: 0.4 } });
    if (Math.abs(dispPath(10, wrong, dz) - 8.37) > 0.02) f.push('wrong cal disp ' + dispPath(10, wrong, dz));

    if (Math.abs(dispPath(10, good, dz) - 10) > 1e-6 || Math.abs(dispPath(25, good, dz) - 25) > 1e-6) f.push('cal round trip');
    if (Math.abs(truePath(dispPath(17, wrong, dz), wrong, dz) - 17) > 1e-6) f.push('truePath inverse');

    N_SAMPLES, CLIP_PCT,

<script>
// ---- src/50-tofd.js ----
/* 50-tofd.js — TOFD (time-of-flight diffraction): two-probe pitch-catch physics, RF A-scan
 * synthesis, D-scan builder (Run Scan) and the TOFD panel windows ('tofd' + 'tofd-ascan').
 * Physics functions are pure functions of their arguments (no UT.state reads except compute(),
 * startScan()/stopScan() and the panel, which orchestrate).
 */
// SPEC NOTES (decisions where the spec is silent or ambiguous)
// - Probe pair centred on probe.x: tx at probe.x + pcs/2 (right, facing left → side +1), rx at
//   probe.x − pcs/2 (facing right → side −1). Modes set probe.x = 0 in TOFD, giving §6.6 exactly.
// - Time axis (512 samples) = 2·wd + delayUs + rangeUs·i/511 (ABSOLUTE µs); defaultState has
//   rangeUs 15 (not 20 as the §6.6 prose says) — the frozen state wins, both 10.17 and 12.22 fit.
// - Wavelet: a 2-cycle sin²-windowed sine of the probe frequency starting exactly at the arrival
//   time (zero before it, so D-scan edges are crisp); polarity: lateral −1, backwall +1, upper tip +1,
//   lower tip −1. Amplitude = rel · 10^((gainDb − 40)/20), clipped to ±1; deterministic grass
//   (±0.015 at 40 dB, LCG seeded by probe z) so scans are repeatable.
// - Beam coverage: a tip is visible when its x lies between the probes ± 10 mm; its amplitude is
//   scaled by an in-plane directivity 10^(−½(δ/θ)²) per probe with an effective TOFD beam half angle
//   θ = 25° (real TOFD probes are small/wide-beam; the 5 MHz 10 mm crystal's 7° would hide every
//   tip). Along z the same law applies to the angle subtended by the z offset of the nearest defect
//   end, which produces the classic tip arcs in the D-scan beyond the defect ends (the in-plane time
//   then includes the z offset: √((x−xt)²+y²+dz²)). Pipes wrap the z interval.
// - Lateral wave amplitude 0.6·min(1, √(60/pcs)) (0.6 at pcs 60 as specified, weaker for wider PCS);
//   backwall 0.9 × the in-plane directivity at the mid-point reflection; tips 0.25·min(1, height/2)
//   × reflectivity, volumetric defects give one pair at the bbox centre-line with a further ×0.5.
// - depthFromTime() returns 0 when the argument of the root is negative (times before the lateral).
// - D-scan columns store GREY 0..1 ((rf + 1)/2) sampled on the scan's own axis (t0Us/rangeUs kept in
//   the scan object) and are resampled to the current Range/X-Shift when drawn. runScan() is pure
//   and synchronous (opts.sync is accepted and ignored); startScan()/stopScan() animate 8 columns per
//   frame, store partial scans via UT.setIn('tofd', {scan, running}) and emit 'scan:progress'.
// - D-scan canvas 280 × 450: left 140 px = the scan image (z top→bottom, wedge-zeroed time left→right),
//   top-right 140 × 140 = 2× magnifier around the crosshair, rest black. Red crosshair: horizontal at
//   probe.z, vertical at the hovered time (lateral-wave time when the mouse is elsewhere). Click sets
//   probe.z; hovering sets the status Depth readout.
// - Status: while the panel is open in tofd mode the RIGHT status text is
//   'Depth: d.d | Lateral Wave: x.xx micro sec + delay | BackWall: y.yy micro sec + delay | AMP= gdB'
//   (g = tofd.gainDb; Pos/Range/instrument AMP are in the mid segment owned by 90-app).
// - OFF / ✕ on either window leaves the mode through UT.modes.exit() when available (re-entrancy

(function (UT) {
  'use strict';
  const M = UT.math;

  const REF_GAIN_DB = 40;            // gainDb at which the relative amplitudes below apply

  const FOOTPRINT_MARGIN = 10;       // mm outside the probe pair still "in the beam"
  const WAVELET_CYCLES = 2;
  const GRASS = 0.015;
  const AMP_REL = { lateral: 0.6, backwall: 0.9, tip: 0.25 };
  const DSCAN = { w: 280, h: 450, imgW: 140, miniW: 140, miniH: 140 };

  const LIMITS = { pcs: [20, 200], rangeUs: [2, 40], delayUs: [0, 40], gainDb: [0, 80] };

  // ================================================================== physics
  /**
