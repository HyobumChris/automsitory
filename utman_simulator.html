   * @param {object} state  UT.state-like ({probe, specimen, tofd})
   * @returns {{xt:number, xr:number, angle:number, pcs:number, derived:object, wd:number, vL:number, T:number, freq:number, probeX:number}}
   */
  function derive(state) {
    const tofd = state.tofd || {};
    const probe = state.probe || {};
    const spec = state.specimen || null;
    const pcs = M.clamp(+tofd.pcs || 60, LIMITS.pcs[0], LIMITS.pcs[1]);
    const angle = +tofd.txAngle || 60;
    const px = Number.isFinite(probe.x) ? probe.x : 0;
    const derived = UT.probe.derive(Object.assign({}, probe, { angle, mode: 'comp', method: 'pe', side: 1 }), spec);
    const xt = px + pcs / 2, xr = px - pcs / 2;
    const T = thicknessAt(spec, px);
    return {
      xt, xr, angle, pcs, derived, wd: derived.wedgeDelayUs / 2, vL: derived.vel, T,
      freq: derived.freq || 5, probeX: px,
    };
  }

  function thicknessAt(spec, x) {
    if (!spec) return 20;
    if (typeof spec.thicknessAt === 'function') { const t = spec.thicknessAt(x); if (Number.isFinite(t) && t > 0) return t; }
    return spec.T || 20;
  }

  /** Absolute arrival time (µs) of a diffractor at (x, y) offset dz along the weld from the probe pair. */
  function pointTime(x, y, dz, g) {
    const pt = Math.sqrt((x - g.xt) * (x - g.xt) + y * y + dz * dz);
    const pr = Math.sqrt((x - g.xr) * (x - g.xr) + y * y + dz * dz);
    return (pt + pr) / g.vL + 2 * g.wd;
  }

  /**
   * Depth (mm) of a diffractor on the probe centre-line from its ABSOLUTE arrival time.
   * @param {number} tUs  absolute time (µs, incl. 2·wd)
   * @param {object} geom  {pcs, wd, vL} (a derive() result)
   * @returns {number} depth ≥ 0 (0 before the lateral wave)
   */
  function depthFromTime(tUs, geom) {
    const vL = geom.vL || (geom.derived && geom.derived.vel) || C.V_COMP_STEEL;
    const wd = geom.wd === undefined ? ((geom.derived ? geom.derived.wedgeDelayUs : 0) / 2) : geom.wd;
    const pcs = geom.pcs === undefined ? Math.abs(geom.xt - geom.xr) : geom.pcs;
    const s = (tUs - 2 * wd) * vL;
    const q = s * s - pcs * pcs;
    return q <= 0 ? 0 : 0.5 * Math.sqrt(q);
  }

  /** Pulse-echo directivity of the pair for a point (x, y) with z offset dz. */
  function dirWeight(x, y, dz, g) {
    const th = M.deg2rad(g.angle);
    const sgn = g.xt >= g.xr ? 1 : -1;               // tx on the right → its axis points toward −x
    const s = Math.sin(th), c = Math.cos(th);
    const dxT = x - g.xt, dxR = x - g.xr;
    const inT = Math.hypot(dxT, y) || 1e-6, inR = Math.hypot(dxR, y) || 1e-6;
    const dT = M.angleBetween(dxT, y, -sgn * s, c);
    const dR = M.angleBetween(dxR, y, sgn * s, c);
    const zT = M.rad2deg(Math.atan2(Math.abs(dz), inT));
    const zR = M.rad2deg(Math.atan2(Math.abs(dz), inR));
    return M.beamWeight20(dT, BEAM_20DB_DEG) * M.beamWeight20(dR, BEAM_20DB_DEG) *
      M.beamWeight20(zT, BEAM_20DB_DEG) * M.beamWeight20(zR, BEAM_20DB_DEG);
  }

  /** Distance along z from probeZ to the defect's z interval (0 inside; pipes wrap). */
  function zOffset(d, probeZ, spec) {
    const L = (spec && spec.L) || 300;
    const wrap = !!(spec && spec.pipe);
    let a = d.zFrom, b = d.zTo;
    if (!Number.isFinite(a) || !Number.isFinite(b)) return 0;
    if (b < a) { if (wrap) b += L; else { const t = a; a = b; b = t; } }
    const cands = [probeZ];
    if (wrap) { cands.push(probeZ + L, probeZ - L); }
    let best = Infinity;
    for (const z of cands) {
      const off = z < a ? a - z : (z > b ? z - b : 0);
      if (off < best) best = off;
    }
    return best;
  }

  function tipPoints(d) {
    const pts = d.pts || [];
    if (pts.length < 2) return null;
    if (UT.specimens.isPlanar(d.type)) {
      let up = pts[0], lo = pts[0];
      for (const p of pts) { if (p.y < up.y) up = p; if (p.y > lo.y) lo = p; }
      return { up: { x: up.x, y: up.y }, lo: { x: lo.x, y: lo.y }, planar: true };
    }
    const b = UT.specimens.bbox(pts);
    return { up: { x: b.cx, y: b.yMin }, lo: { x: b.cx, y: b.yMax }, planar: false };
  }

  /**
   * TOFD events (lateral, backwall, tip pairs) for the probe pair at probeZ.
   * @returns {Array<{kind:string, tUs:number, depth:number, x:number, defectId:*, amp:number, polarity:number}>}
   */
  function eventsAt(spec, g, defects, probeZ) {
    const ev = [];
    const lateralUs = g.pcs / g.vL + 2 * g.wd;
    ev.push({ kind: 'lateral', tUs: lateralUs, depth: 0, x: (g.xt + g.xr) / 2, defectId: null, dz: 0,
      amp: AMP_REL.lateral * Math.min(1, Math.sqrt(60 / g.pcs)), polarity: -1 });
    const T = g.T;
    const xm = (g.xt + g.xr) / 2;
    const backwallUs = Math.sqrt(g.pcs * g.pcs + 4 * T * T) / g.vL + 2 * g.wd;
    ev.push({ kind: 'backwall', tUs: backwallUs, depth: T, x: xm, defectId: null, dz: 0,
      amp: AMP_REL.backwall * Math.max(0.15, dirWeight(xm, T, 0, g)), polarity: 1 });
    const xLo = Math.min(g.xt, g.xr) - FOOTPRINT_MARGIN, xHi = Math.max(g.xt, g.xr) + FOOTPRINT_MARGIN;
    for (const d of defects || []) {
      if (!d) continue;
      const tp = tipPoints(d);
      if (!tp) continue;
      const hgt = Number.isFinite(d.height) && d.height > 0 ? d.height : Math.max(0.5, tp.lo.y - tp.up.y);
      const base = AMP_REL.tip * Math.min(1, hgt / 2) * (Number.isFinite(d.reflectivity) ? d.reflectivity : 1) * (tp.planar ? 1 : 0.5);
      const dz = zOffset(d, probeZ, spec);
      const pair = [{ p: tp.up, kind: 'tipUpper', polarity: 1 }, { p: tp.lo, kind: 'tipLower', polarity: -1 }];
      for (const it of pair) {
        const x = it.p.x, y = Math.max(0, it.p.y);
        if (x < xLo || x > xHi) continue;
        const w = dirWeight(x, y, dz, g);
        if (w < 1e-3) continue;
        ev.push({ kind: it.kind, tUs: pointTime(x, y, dz, g), depth: y, x, defectId: d.id, n: d.n, dz,
          amp: base * w, polarity: it.polarity });
      }
    }
    ev.sort(function (a, b) { return a.tUs - b.tUs; });
    return ev;
  }

  /** Absolute time axis of the display window. */
  function timeAxis(tofd, g, n) {
    const N = n || N_SAMPLES;
    const rangeUs = M.clamp(+tofd.rangeUs || 15, 0.5, 200);
    const delayUs = +tofd.delayUs || 0;
    const t = new Float32Array(N);
    const t0 = 2 * g.wd + delayUs;
    for (let i = 0; i < N; i++) t[i] = t0 + rangeUs * i / (N - 1);
    return t;
  }

  /** RF synthesis of events on the given time axis at gainDb (−1..1, clipped). */
  function synthRf(events, t, gainDb, freqMHz, seed) {
    const n = t.length;
    const rf = new Float32Array(n);
    const dt = (t[n - 1] - t[0]) / (n - 1);
    const gLin = Math.pow(10, ((Number.isFinite(gainDb) ? gainDb : REF_GAIN_DB) - REF_GAIN_DB) / 20);
    const f = freqMHz || 5;
    const dur = WAVELET_CYCLES / f;
    for (const ev of events) {
      const a = ev.amp * ev.polarity * gLin;
      if (!a) continue;
      let i0 = Math.ceil((ev.tUs - t[0]) / dt), i1 = Math.floor((ev.tUs + dur - t[0]) / dt);
      if (i1 < 0 || i0 > n - 1) continue;
      if (i0 < 0) i0 = 0;
      if (i1 > n - 1) i1 = n - 1;
      for (let i = i0; i <= i1; i++) {
        const tau = t[i] - ev.tUs;
        if (tau < 0 || tau > dur) continue;
        const win = Math.sin(Math.PI * tau / dur);
        rf[i] += a * Math.sin(2 * Math.PI * f * tau) * win * win;
      }
    }
    const r = M.rng(Math.round((seed || 0) * 13 + 7));
    const grass = Math.min(0.1, GRASS * gLin);
    for (let i = 0; i < n; i++) {
      const v = rf[i] + (r() - 0.5) * 2 * grass;
      rf[i] = v > 1 ? 1 : v < -1 ? -1 : v;
    }
    return rf;
  }

  /**
   * TOFD RF A-scan for one probe-pair position.
   * @param {{specimen:object, tofdGeom:object, defects:Array, tofd:object, probeZ:number, probes?:Array}} o
   * @returns {{t:Float32Array, rf:Float32Array, events:Array, lateralUs:number, backwallUs:number, wd:number, geom:object, rangeUs:number, delayUs:number, gainDb:number, probeZ:number}}
   */
  function ascan(o) {
    const spec = o.specimen || null;
    const tofd = o.tofd || {};
    let g = o.tofdGeom || null;
    if (!g && Array.isArray(o.probes) && o.probes.length >= 2) {   // legacy {probes: [tx, rx]} form
      const px = (o.probes[0].x + o.probes[1].x) / 2;
      g = derive({ probe: Object.assign({}, o.probe || {}, { x: px }), specimen: spec, tofd: Object.assign({}, tofd, { pcs: Math.abs(o.probes[0].x - o.probes[1].x) }) });
    }
    if (!g) g = derive({ probe: o.probe || { x: 0 }, specimen: spec, tofd });
    const probeZ = Number.isFinite(o.probeZ) ? o.probeZ : 0;
    const events = o.events || eventsAt(spec, g, o.defects || [], probeZ);
    const t = timeAxis(tofd, g, N_SAMPLES);
    const rf = synthRf(events, t, tofd.gainDb, g.freq, probeZ);
    const lat = events.find(function (e) { return e.kind === 'lateral'; });
    const bw = events.find(function (e) { return e.kind === 'backwall'; });
    return {
      t, rf, events,
      lateralUs: lat ? lat.tUs : g.pcs / g.vL + 2 * g.wd,
      backwallUs: bw ? bw.tUs : Math.sqrt(g.pcs * g.pcs + 4 * g.T * g.T) / g.vL + 2 * g.wd,
      wd: g.wd, geom: { xt: g.xt, xr: g.xr, pcs: g.pcs, angle: g.angle, vL: g.vL, T: g.T, wd: g.wd, probeX: g.probeX },
      rangeUs: M.clamp(+tofd.rangeUs || 15, 0.5, 200), delayUs: +tofd.delayUs || 0,
      gainDb: Number.isFinite(tofd.gainDb) ? tofd.gainDb : REF_GAIN_DB, probeZ,
    };
  }

  function activeDefects(state) { return (state.defects || []).filter(function (d) { return d && d.visible !== false; }); }

  /**
   * TOFD frame result for UT.compute (mode 'tofd'). Reads state, writes nothing.
   * @param {object} state  UT.state
   * @returns {object|null} TofdResult
   */
  function compute(state) {
    if (!state || !state.specimen) return null;
    const g = derive(state);
    return ascan({ specimen: state.specimen, tofdGeom: g, defects: activeDefects(state), tofd: state.tofd || {}, probeZ: state.probe.z || 0 });
  }

  /** Index-point positions of the pair for the cross-section / plan view. */
  function probePositions(state) {
    const g = derive(state);
    return { tx: { x: g.xt, y: 0, side: 1, angle: g.angle }, rx: { x: g.xr, y: 0, side: -1, angle: g.angle }, pcs: g.pcs, angle: g.angle };
  }

  // ================================================================== D-scan
  function scanShell(state) {
    const spec = state.specimen;
    const g = derive(state);
    const tofd = state.tofd || {};
    const L = (spec && spec.L) || 300;
    const step = 1;
    const n = Math.floor(L / step) + 1;
    const t = timeAxis(tofd, g, N_SAMPLES);
    const fixed = eventsAt(spec, g, [], 0);          // lateral + backwall (z independent)
    return {
      z0: 0, z1: (n - 1) * step, step, n, columns: [], nS: N_SAMPLES,
      t0Us: +tofd.delayUs || 0, rangeUs: M.clamp(+tofd.rangeUs || 15, 0.5, 200), gainDb: tofd.gainDb,
      pcs: g.pcs, txAngle: g.angle, wd: g.wd, T: g.T, done: false,
      _g: g, _t: t, _fixed: fixed, _defects: activeDefects(state), _spec: spec,
    };
  }

  function scanColumn(sc, i) {
    const z = sc.z0 + i * sc.step;
    const evs = eventsAt(sc._spec, sc._g, sc._defects, z);
    const rf = synthRf(evs, sc._t, sc.gainDb, sc._g.freq, z);
    const col = new Float32Array(sc.nS);
    for (let k = 0; k < sc.nS; k++) col[k] = (rf[k] + 1) / 2;
    return col;
  }

  function stripPrivate(sc) {
    const out = {};
    for (const k of Object.keys(sc)) if (k[0] !== '_') out[k] = sc[k];
    return out;
  }

  /**
   * Synchronous D-scan: z = 0 … L in 1 mm steps, each column = grey samples 0..1 (0.5 = no signal).
   * PURE — the caller stores the result (UT.setIn('tofd', {scan})).
   * @param {object} state  UT.state
   * @param {{sync?:boolean}} [opts]
   * @returns {{z0:number, z1:number, step:number, n:number, columns:Float32Array[]}|null}
   */
  function runScan(state, opts) {   // eslint-disable-line no-unused-vars
    if (!state || !state.specimen) return null;
    const sc = scanShell(state);
    for (let i = 0; i < sc.n; i++) sc.columns.push(scanColumn(sc, i));
    sc.done = true;
    return stripPrivate(sc);
  }

  let anim = null;   // {sc, i, handle}
  function raf(fn) {
    if (typeof requestAnimationFrame === 'function') return requestAnimationFrame(fn);
    return setTimeout(fn, 16);
  }
  function cancelRaf(h) {
    if (typeof cancelAnimationFrame === 'function') cancelAnimationFrame(h); else clearTimeout(h);
  }

  /** Animated D-scan (8 columns per frame); stores partial scans into state and emits 'scan:progress'. */
  function startScan() {
    const state = UT.state;
    if (!state.specimen) return false;
    stopScan(true);
    const sc = scanShell(state);
    anim = { sc, i: 0, handle: null };
    UT.setIn('tofd', { scan: stripPrivate(sc), running: true });
    const stepFrame = function () {
      if (!anim || anim.sc !== sc) return;
      for (let k = 0; k < 8 && anim.i < sc.n; k++, anim.i++) sc.columns.push(scanColumn(sc, anim.i));
      const finished = anim.i >= sc.n;
      sc.done = finished;
      UT.setIn('tofd', { scan: stripPrivate(sc), running: !finished });
      UT.bus.emit('scan:progress', { kind: 'tofd', i: anim.i, n: sc.n });
      if (finished) { anim = null; return; }
      anim.handle = raf(stepFrame);
    };
    anim.handle = raf(stepFrame);
    return true;
  }

  /** Stop the animated scan (keeps the columns already built). */
  function stopScan(silent) {
    if (!anim) return false;
    if (anim.handle !== null) cancelRaf(anim.handle);
    anim = null;
    if (!silent) UT.setIn('tofd', { running: false });
    return true;
  }

  function isScanning() { return !!anim; }

  // ================================================================== panel (DOM)
  const css = [
    '.win[data-win=tofd] .win-body{padding:0;background:#000;overflow:hidden}',
    '.win[data-win=tofd] .tofd-top{display:flex;align-items:stretch;height:36px;background:#000}',
    '.win[data-win=tofd] .tofd-run{width:140px;margin:0;padding:0;font:bold 17px "Segoe UI",Arial,sans-serif;color:#000;background:#ececec;border:2px outset #fff;cursor:pointer}',
    '.win[data-win=tofd] .tofd-run.running{background:#ffe08a}',
    '.win[data-win=tofd] .tofd-clear{width:60px;margin:0 0 0 4px;padding:0;font:12px "Segoe UI",Arial,sans-serif;color:#000;background:#d8d8d8;border:2px outset #eee;cursor:pointer}',
    '.win[data-win=tofd] #cv-tofd-dscan{display:block;width:280px;height:450px;cursor:crosshair;background:#000}',
    '.win[data-win=tofd-ascan] .win-body{padding:3px;background:#fdfbd8}',
    '.win[data-win=tofd-ascan] #cv-tofd-ascan{display:block;width:236px;height:140px}',
    '.win[data-win=tofd-ascan] .tofd-ctl{display:flex;gap:4px;align-items:flex-start;margin-top:2px}',
    '.win[data-win=tofd-ascan] .tofd-sliders{flex:1;min-width:0}',
    '.win[data-win=tofd-ascan] .tofd-slider{display:flex;align-items:center;gap:2px;margin:3px 0}',
    '.win[data-win=tofd-ascan] .tofd-slider input[type=range]{width:74px;height:12px;margin:0}',
    '.win[data-win=tofd-ascan] .tofd-slider button{width:16px;height:14px;padding:0;margin:0;font-size:8px;line-height:12px;border:1px outset #ddd;background:#e4e4e4;cursor:pointer}',
    '.win[data-win=tofd-ascan] .tofd-slider span{font:12px "Segoe UI",Arial,sans-serif;color:#000;margin-left:4px;white-space:nowrap}',
    '.win[data-win=tofd-ascan] .tofd-amp{display:flex;flex-direction:column;align-items:center;font:12px "Segoe UI",Arial,sans-serif;color:#000}',
    '.win[data-win=tofd-ascan] .tofd-amp input[type=range]{writing-mode:vertical-lr;direction:rtl;height:56px;width:18px;margin:0}',
    '.win[data-win=tofd-ascan] .tofd-amp .tofd-amp-val{font-size:10px}',
    '.win[data-win=tofd-ascan] .tofd-off{width:38px;height:54px;margin:0;padding:0;font:bold 12px "Segoe UI",Arial,sans-serif;color:#fff;background:#2b2b2b;border:2px outset #777;cursor:pointer;align-self:center}',
    '.win[data-win=tofd-ascan] .tofd-extra{display:flex;gap:8px;align-items:center;margin-top:3px;font:11px "Segoe UI",Arial,sans-serif;color:#000}',
    '.win[data-win=tofd-ascan] .tofd-extra .fld{display:flex;align-items:center;gap:3px;margin:0}',
    '.win[data-win=tofd-ascan] .tofd-extra .fld-input{width:48px;font-size:11px;padding:1px 2px}',
    '.win[data-win=tofd-ascan] .tofd-extra select.fld-input{width:52px}',
  ].join('\n');

  const ui = {
    win: null, ascanWin: null, dscan: null, ascan: null, runBtn: null,
    inputs: {}, hover: null /* {tUs wedge-zeroed, z} */, subscribed: false, leaving: false,
  };

  function tofdState() { return UT.state.tofd || {}; }
  function setTofd(patch) { UT.setIn('tofd', patch); }
  function clampField(key, v) { const l = LIMITS[key]; return l ? M.clamp(v, l[0], l[1]) : v; }

  /** Leave the TOFD mode (OFF / ✕): via UT.modes.exit when present, else just hide the panel. */
  function leave() {
    if (ui.leaving) return;
    ui.leaving = true;
    try {
      if (UT.state.mode === 'tofd' && UT.modes && typeof UT.modes.exit === 'function') UT.modes.exit();
      else panel.close();
    } finally { ui.leaving = false; }
  }

  function anchorRect(id) {
    const el = typeof document !== 'undefined' ? document.getElementById(id) : null;
    return el ? el.getBoundingClientRect() : null;
  }

  function buildDscanWindow() {
    const runBtn = UT.dom.h('button', { class: 'tofd-run', type: 'button', title: 'Build the D-scan image along the weld / 용접선을 따라 D-scan 생성' }, 'Run Scan');
    runBtn.addEventListener('click', function () { if (isScanning()) stopScan(); else startScan(); syncInputs(); UT.requestRender(); });
    const clearBtn = UT.dom.h('button', { class: 'tofd-clear', type: 'button', title: 'Clear the D-scan image' }, 'Clear');
    clearBtn.addEventListener('click', function () { stopScan(true); setTofd({ scan: null, running: false }); });
    const cv = UT.dom.h('canvas', { id: 'cv-tofd-dscan', width: DSCAN.w, height: DSCAN.h });
    cv.addEventListener('mousemove', function (e) { onDscanMouse(e, false); });
    cv.addEventListener('mousedown', function (e) { if (e.button === 0) onDscanMouse(e, true); });
    cv.addEventListener('mouseleave', function () { ui.hover = null; UT.requestRender(); });
    const content = UT.dom.h('div', { class: 'tofd-panel' }, [UT.dom.h('div', { class: 'tofd-top' }, [runBtn, clearBtn]), cv]);
    const inst = anchorRect('instrument');
    ui.win = UT.dom.win({
      name: 'tofd', title: 'TOFD', w: 290, x: inst ? Math.max(0, Math.round(inst.left)) : 4, y: inst ? Math.max(0, Math.round(inst.top)) : 96,
      content, onClose: function () { leave(); },
    });
    ui.runBtn = runBtn;
    ui.dscan = cv;
  }

  function dscanZRange() {
    const sc = tofdState().scan;
    const spec = UT.state.specimen;
    if (sc && Number.isFinite(sc.z0) && Number.isFinite(sc.z1) && sc.z1 > sc.z0) return { z0: sc.z0, z1: sc.z1 };
    return { z0: 0, z1: (spec && spec.L) || 300 };
  }

  function onDscanMouse(e, click) {
    const p = UT.dom.localPos(e, ui.dscan);
    const zr = dscanZRange();
    const t = tofdState();
    const rangeUs = M.clamp(+t.rangeUs || 15, 0.5, 200), delayUs = +t.delayUs || 0;
    if (p.x < 0 || p.x >= DSCAN.imgW || p.y < 0 || p.y >= DSCAN.h) { ui.hover = null; UT.requestRender(); return; }
    const z = zr.z0 + (zr.z1 - zr.z0) * p.y / (DSCAN.h - 1);
    const tUs = delayUs + rangeUs * p.x / (DSCAN.imgW - 1);
    ui.hover = { tUs, z };
    if (click) {
      const spec = UT.state.specimen;
      UT.setIn('probe', { z: M.clamp(Math.round(z), 0, (spec && spec.L) || z) });
      e.preventDefault();
    } else UT.requestRender();
  }

  function sliderRow(label, key, min, max, step, btnStep) {
    const input = UT.dom.h('input', { type: 'range', min, max, step, title: label });
    input.value = clampField(key, +tofdState()[key] || min);
    const apply = function (v) { const patch = {}; patch[key] = +clampField(key, v).toFixed(2); setTofd(patch); };
    input.addEventListener('input', function () { apply(parseFloat(input.value)); });
    const dec = UT.dom.h('button', { type: 'button', title: label + ' −' }, '◀');
    const inc = UT.dom.h('button', { type: 'button', title: label + ' +' }, '▶');
    dec.addEventListener('click', function () { apply((+tofdState()[key] || 0) - btnStep); });
    inc.addEventListener('click', function () { apply((+tofdState()[key] || 0) + btnStep); });
    ui.inputs[key] = input;
    return UT.dom.h('div', { class: 'tofd-slider' }, [dec, input, inc, UT.dom.h('span', {}, label)]);
  }

  function buildAscanWindow() {
    const cv = UT.dom.h('canvas', { id: 'cv-tofd-ascan', width: ASCAN.w, height: ASCAN.h });
    cv.addEventListener('wheel', function (e) {
      e.preventDefault();
      setTofd({ gainDb: clampField('gainDb', (+tofdState().gainDb || 0) + (e.deltaY < 0 ? 1 : -1)) });
    }, { passive: false });
    const sliders = UT.dom.h('div', { class: 'tofd-sliders' }, [
      sliderRow('Range', 'rangeUs', LIMITS.rangeUs[0], LIMITS.rangeUs[1], 0.5, 1),
      sliderRow('X-Shift', 'delayUs', LIMITS.delayUs[0], LIMITS.delayUs[1], 0.25, 0.5),
    ]);
    const amp = UT.dom.h('input', { type: 'range', min: LIMITS.gainDb[0], max: LIMITS.gainDb[1], step: 1, orient: 'vertical', title: 'AMP (dB)' });
    amp.value = clampField('gainDb', +tofdState().gainDb || REF_GAIN_DB);
    amp.addEventListener('input', function () { setTofd({ gainDb: clampField('gainDb', parseFloat(amp.value)) }); });
    ui.inputs.gainDb = amp;
    const ampVal = UT.dom.h('span', { class: 'tofd-amp-val' }, amp.value + 'dB');
    ui.inputs.gainLabel = ampVal;
    const ampBox = UT.dom.h('div', { class: 'tofd-amp' }, [amp, UT.dom.h('span', {}, 'AMP'), ampVal]);
    const off = UT.dom.h('button', { class: 'tofd-off', type: 'button', title: 'Close TOFD' }, 'OFF');
    off.addEventListener('click', function () { leave(); });
    const pcs = UT.dom.field('PCS', { type: 'number', value: tofdState().pcs || 60, min: LIMITS.pcs[0], max: LIMITS.pcs[1], step: 1, title: 'Probe centre separation (mm)',
      onchange: function (v) { if (Number.isFinite(v)) setTofd({ pcs: clampField('pcs', v) }); } });
    const ang = UT.dom.field('Angle', { tag: 'select', type: 'number', value: tofdState().txAngle || 60, options: [45, 60, 70], title: 'Probe angle (compression)',
      onchange: function (v) { const a = parseFloat(v); if (Number.isFinite(a)) setTofd({ txAngle: a }); } });
    ui.inputs.pcs = pcs.input;
    ui.inputs.txAngle = ang.input;
    const content = UT.dom.h('div', { class: 'tofd-ascan-panel' }, [
      cv,
      UT.dom.h('div', { class: 'tofd-ctl' }, [sliders, ampBox, off]),
      UT.dom.h('div', { class: 'tofd-extra' }, [pcs, ang]),
    ]);
    const plan = anchorRect('cv-plan');
    ui.ascanWin = UT.dom.win({
      name: 'tofd-ascan', title: 'TOFD A-Scan', w: 246,
      x: plan ? Math.max(0, Math.round(plan.right - 150 - 246)) : 700, y: plan ? Math.max(0, Math.round(plan.top + 24)) : 130,
      content, onClose: function () { leave(); },
    });
    ui.ascan = cv;
  }

  function syncInputs() {
    const t = tofdState();
    const set = function (key, v) { const el = ui.inputs[key]; if (el && document.activeElement !== el && String(el.value) !== String(v)) el.value = v; };
    set('rangeUs', +t.rangeUs || 15);
    set('delayUs', +t.delayUs || 0);
    set('gainDb', Number.isFinite(t.gainDb) ? t.gainDb : REF_GAIN_DB);
    set('pcs', t.pcs || 60);
    set('txAngle', t.txAngle || 60);
    if (ui.inputs.gainLabel) ui.inputs.gainLabel.textContent = Math.round(Number.isFinite(t.gainDb) ? t.gainDb : REF_GAIN_DB) + 'dB';
    if (ui.runBtn) {
      const running = isScanning() || !!t.running;
      ui.runBtn.textContent = running ? 'Stop Scan' : 'Run Scan';
      ui.runBtn.classList.toggle('running', running);
    }
  }

  // ------------------------------------------------------------------ drawing
  function drawAscan(frame, state) {
    const cv = ui.ascan;
    if (!cv) return;
    const ctx = UT.dom.fitCanvas(cv, ASCAN.w, ASCAN.h);
    const res = (frame && frame.tofd) || (state.specimen ? compute(state) : null);
    ctx.save();
    ctx.fillStyle = '#fdfbd8';
    ctx.fillRect(0, 0, ASCAN.w, ASCAN.h);
    // plot area
    ctx.fillStyle = '#0e5a4d';
    ctx.fillRect(0, 0, ASCAN.plotW, ASCAN.plotH);
    ctx.strokeStyle = '#0a3d34';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < 10; i++) { const x = Math.round(ASCAN.plotW * i / 10) + 0.5; ctx.moveTo(x, 0); ctx.lineTo(x, ASCAN.plotH); }
    for (let j = 1; j < 5; j++) { const y = Math.round(ASCAN.plotH * j / 5) + 0.5; ctx.moveTo(0, y); ctx.lineTo(ASCAN.plotW, y); }
    ctx.stroke();
    const mid = ASCAN.plotH / 2;
    ctx.strokeStyle = '#146b5c';
    ctx.beginPath(); ctx.moveTo(0, mid + 0.5); ctx.lineTo(ASCAN.plotW, mid + 0.5); ctx.stroke();
    if (res && res.rf) {
      const n = res.rf.length;
      ctx.strokeStyle = '#22ff22';
      ctx.lineWidth = 1.5;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const x = ASCAN.plotW * i / (n - 1);
        const y = mid - res.rf[i] * (mid - 2);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      // hover time marker
      if (ui.hover) {
        const x = ASCAN.plotW * (ui.hover.tUs - res.delayUs) / res.rangeUs;
        if (x >= 0 && x <= ASCAN.plotW) { ctx.strokeStyle = 'rgba(255,60,60,0.8)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(Math.round(x) + 0.5, 0); ctx.lineTo(Math.round(x) + 0.5, ASCAN.plotH); ctx.stroke(); }
      }
    }
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, 0.5, ASCAN.plotW - 1, ASCAN.plotH - 1);
    // greyscale legend (white top → black bottom)
    const grad = ctx.createLinearGradient(0, 0, 0, ASCAN.plotH);
    grad.addColorStop(0, '#ffffff'); grad.addColorStop(1, '#000000');
    ctx.fillStyle = grad;
    ctx.fillRect(ASCAN.legendX, 0, ASCAN.legendW, ASCAN.plotH);
    ctx.strokeRect(ASCAN.legendX + 0.5, 0.5, ASCAN.legendW - 1, ASCAN.plotH - 1);
    // division labels 0 … 10
    ctx.fillStyle = '#000';
    ctx.font = 'bold 13px "Segoe UI", Arial, sans-serif';
    ctx.textBaseline = 'top';
    for (let i = 0; i <= 10; i += 2) {
      const x = ASCAN.plotW * i / 10;
      ctx.textAlign = i === 0 ? 'left' : (i === 10 ? 'right' : 'center');
      ctx.fillText(String(i), x, ASCAN.plotH + 3);
    }
    ctx.restore();
  }

  function greyAt(sc, zr, rangeUs, delayUs, px, py) {
    const z = zr.z0 + (zr.z1 - zr.z0) * py / (DSCAN.h - 1);
    const i = Math.round((z - sc.z0) / sc.step);
    if (i < 0 || i >= sc.columns.length) return -1;
    const tDisp = delayUs + rangeUs * px / (DSCAN.imgW - 1);
    const j = Math.round((tDisp - sc.t0Us) / sc.rangeUs * (sc.nS - 1));
    if (j < 0 || j >= sc.nS) return -1;
    return sc.columns[i][j];
  }

  function drawDscan(frame, state) {
    const cv = ui.dscan;
    if (!cv) return;
    const ctx = UT.dom.fitCanvas(cv, DSCAN.w, DSCAN.h);
    const t = state.tofd || {};
    const sc = t.scan && Array.isArray(t.scan.columns) ? t.scan : null;
    const zr = dscanZRange();
    const rangeUs = M.clamp(+t.rangeUs || 15, 0.5, 200), delayUs = +t.delayUs || 0;
    ctx.save();
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, DSCAN.w, DSCAN.h);
    ctx.fillStyle = '#3a3a3a';
    ctx.fillRect(0, 0, DSCAN.imgW, DSCAN.h);
    ctx.fillStyle = '#4a4a4a';
    ctx.fillRect(DSCAN.imgW, 0, DSCAN.miniW, DSCAN.miniH);
    const probeZ = state.probe.z || 0;
    const zRow = M.clamp((probeZ - zr.z0) / (zr.z1 - zr.z0) * (DSCAN.h - 1), 0, DSCAN.h - 1);
    if (sc && sc.columns.length) {
      const img = ctx.createImageData(DSCAN.imgW, DSCAN.h);
      const d = img.data;
      for (let py = 0; py < DSCAN.h; py++) {
        for (let px = 0; px < DSCAN.imgW; px++) {
          const v = greyAt(sc, zr, rangeUs, delayUs, px, py);
          const g = v < 0 ? 0 : Math.round(M.clamp(v, 0, 1) * 255);
          const k = (py * DSCAN.imgW + px) * 4;
          d[k] = g; d[k + 1] = g; d[k + 2] = g; d[k + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      // magnifier: 2× zoom of a 70 × 70 px region around the crosshair
      const hx = ui.hover ? (ui.hover.tUs - delayUs) / rangeUs * (DSCAN.imgW - 1) : (frame && frame.tofd ? (frame.tofd.lateralUs - 2 * frame.tofd.wd - delayUs) / rangeUs * (DSCAN.imgW - 1) : 0);
      const cx = M.clamp(Math.round(hx), 35, DSCAN.imgW - 35), cy = M.clamp(Math.round(zRow), 35, DSCAN.h - 35);
      const mini = ctx.createImageData(DSCAN.miniW, DSCAN.miniH);
      const md = mini.data;
      for (let py = 0; py < DSCAN.miniH; py++) {
        for (let px = 0; px < DSCAN.miniW; px++) {
          const v = greyAt(sc, zr, rangeUs, delayUs, cx - 35 + px / 2, cy - 35 + py / 2);
          const g = v < 0 ? 0 : Math.round(M.clamp(v, 0, 1) * 255);
          const k = (py * DSCAN.miniW + px) * 4;
          md[k] = g; md[k + 1] = g; md[k + 2] = g; md[k + 3] = 255;
        }
      }
      ctx.putImageData(mini, DSCAN.imgW, 0);
      if (!sc.done && sc.columns.length < sc.n) {
        const py = (sc.z0 + (sc.columns.length - 1) * sc.step - zr.z0) / (zr.z1 - zr.z0) * (DSCAN.h - 1);
        ctx.strokeStyle = '#00e000'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, Math.round(py) + 0.5); ctx.lineTo(DSCAN.imgW, Math.round(py) + 0.5); ctx.stroke();
      }
    } else {
      ctx.fillStyle = '#9a9a9a';
      ctx.font = '11px "Segoe UI", Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('press Run Scan', DSCAN.imgW / 2, 24);
    }
    // crosshair: horizontal at probe.z (full width), vertical at hover / lateral time (image only)
    ctx.strokeStyle = '#ff2020';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, Math.round(zRow) + 0.5); ctx.lineTo(DSCAN.w, Math.round(zRow) + 0.5);
    let tv = null;
    if (ui.hover) tv = ui.hover.tUs;
    else if (frame && frame.tofd) tv = frame.tofd.lateralUs - 2 * frame.tofd.wd;
    if (tv !== null) {
      const x = (tv - delayUs) / rangeUs * (DSCAN.imgW - 1);
      if (x >= 0 && x < DSCAN.imgW) { ctx.moveTo(Math.round(x) + 0.5, 0); ctx.lineTo(Math.round(x) + 0.5, DSCAN.h); }
    }
    ctx.stroke();
    // z ticks on the image edge
    ctx.fillStyle = '#d0d0d0';
    ctx.font = '9px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const zStep = (zr.z1 - zr.z0) > 400 ? 100 : 50;
    for (let z = Math.ceil(zr.z0 / zStep) * zStep; z <= zr.z1; z += zStep) {
      const py = (z - zr.z0) / (zr.z1 - zr.z0) * (DSCAN.h - 1);
      ctx.fillRect(0, Math.round(py), 4, 1);
      if (py > 6 && py < DSCAN.h - 6) ctx.fillText(String(z), 6, py);
    }
    ctx.restore();
  }

  function updateStatus(frame, state) {
    if (state.mode !== 'tofd') return;
    const res = (frame && frame.tofd) || null;
    if (!res) return;
    const g = res.geom || derive(state);
    const wd = res.wd;
    const cursorAbs = ui.hover ? ui.hover.tUs + 2 * wd : null;
    const depth = cursorAbs === null ? 0 : depthFromTime(cursorAbs, { pcs: g.pcs, wd, vL: g.vL });
    const gainDb = Number.isFinite(state.tofd.gainDb) ? state.tofd.gainDb : REF_GAIN_DB;
    const right = 'Depth: ' + depth.toFixed(1) + ' | Lateral Wave: ' + (res.lateralUs - 2 * wd).toFixed(2) + ' micro sec + delay | BackWall: ' +
      (res.backwallUs - 2 * wd).toFixed(2) + ' micro sec + delay | AMP= ' + Math.round(gainDb) + 'dB';
    if (state.status && state.status.right !== right) UT.status({ right });
  }

  const panel = {
    /** The 'tofd' window api (null until first open()). */
    window: null,
    ascanWindow: null,
    isOpen() { return !!(ui.win && ui.win.isOpen()); },
    /** Create (lazily) and show both TOFD windows. */
    open() {
      if (typeof document === 'undefined') return null;
      UT.dom.injectCss('tofd', css);
      if (!ui.win) buildDscanWindow();
      if (!ui.ascanWin) buildAscanWindow();
      panel.window = ui.win;
      panel.ascanWindow = ui.ascanWin;
      if (!ui.subscribed) {
        ui.subscribed = true;
        UT.bus.on('render', function (frame) { panel.draw(frame); });
      }
      ui.win.show();
      ui.ascanWin.show();
      syncInputs();
      UT.requestRender();
      return ui.win;
    },
    /** Hide both windows (stops a running scan; keeps the image). */
    close() {
      stopScan();
      if (ui.win && ui.win.isOpen()) ui.win.hide();
      if (ui.ascanWin && ui.ascanWin.isOpen()) ui.ascanWin.hide();
      return ui.win;
    },
    toggle() { return panel.isOpen() ? panel.close() : panel.open(); },
    /** Draw both canvases from the frame (no-op while hidden). */
    draw(frame) {
      if (!panel.isOpen() && !(ui.ascanWin && ui.ascanWin.isOpen())) return;
      const state = UT.state;
      try {
        syncInputs();
        if (ui.win && ui.win.isOpen()) drawDscan(frame, state);
        if (ui.ascanWin && ui.ascanWin.isOpen()) drawAscan(frame, state);
        updateStatus(frame, state);
      } catch (e) { console.error('[UT.tofd.panel]', e); }
    },
  };

  // ================================================================== test API
  function testTofd() {
    let res = UT.frame && UT.frame.tofd;
    if (!res) res = compute(UT.state);
    if (!res) return { events: [], lateralUs: null, backwallUs: null };
    return {
      events: res.events.map(function (e) { return { kind: e.kind, tUs: +e.tUs.toFixed(4), depth: +e.depth.toFixed(3), defectId: e.defectId === undefined ? null : e.defectId, amp: +e.amp.toFixed(4) }; }),
      lateralUs: +res.lateralUs.toFixed(4), backwallUs: +res.backwallUs.toFixed(4), wd: +res.wd.toFixed(4),
    };
  }
  function testRunTofdScan() {
    stopScan(true);
    const sc = runScan(UT.state, { sync: true });
    if (!sc) return null;
    UT.setIn('tofd', { scan: sc, running: false });
    return { z0: sc.z0, z1: sc.z1, step: sc.step, n: sc.n };
  }

  // ================================================================== self test
  function selftest() {
    const f = [];
    try {
      const st = UT.defaultState();
      st.mode = 'tofd';
      st.specimen = UT.specimens.plateWeld({ T: 20 });
      st.probe.x = 0; st.probe.z = 135;
      st.tofd.pcs = 60; st.tofd.txAngle = 60;
      st.defects = [UT.specimens.makeDefect({ pts: [{ x: 0, y: 8 }, { x: 0, y: 13 }], type: 'planar', zFrom: 120, zTo: 150, n: 1 })];
      const g = derive(st);
      if (Math.abs(g.derived.wedgeAngle - 23.7) > 0.2) f.push('wedge angle 60 comp ' + g.derived.wedgeAngle.toFixed(2));
      if (Math.abs(g.wd - 4.38) > 0.02) f.push('wd ' + g.wd);
      const res = compute(st);
      if (!res || !(res.t instanceof Float32Array) || res.t.length !== N_SAMPLES) f.push('t axis');
      if (Math.abs(res.lateralUs - 18.93) > 0.05) f.push('lateral ' + res.lateralUs.toFixed(3));
      if (Math.abs(res.backwallUs - 20.98) > 0.05) f.push('backwall ' + res.backwallUs.toFixed(3));
      const tips = res.events.filter(function (e) { return e.kind === 'tipUpper' || e.kind === 'tipLower'; });
      if (tips.length !== 2) f.push('tip events ' + tips.length);
      for (const e of tips) if (!(e.tUs > res.lateralUs && e.tUs < res.backwallUs)) f.push('tip time out of order ' + e.kind + ' ' + e.tUs.toFixed(2));
      const up = tips.find(function (e) { return e.kind === 'tipUpper'; }), lo = tips.find(function (e) { return e.kind === 'tipLower'; });
      if (up && lo && !(up.tUs < lo.tUs)) f.push('upper tip after lower');
      if (up && Math.abs(depthFromTime(up.tUs, g) - 8) > 0.05) f.push('depthFromTime(upper) ' + depthFromTime(up.tUs, g).toFixed(2));
      if (Math.abs(depthFromTime(res.backwallUs, g) - 20) > 0.05) f.push('depthFromTime(backwall) ' + depthFromTime(res.backwallUs, g).toFixed(2));
      if (depthFromTime(res.lateralUs, g) !== 0) f.push('depthFromTime(lateral) != 0');
      let maxAbs = 0, latPeak = 0;
      for (let i = 0; i < res.rf.length; i++) {
        const a = Math.abs(res.rf[i]);
        if (a > maxAbs) maxAbs = a;
        if (res.t[i] >= res.lateralUs && res.t[i] <= res.lateralUs + 0.5 && a > latPeak) latPeak = a;
      }
      if (maxAbs > 1 + 1e-6) f.push('rf not clipped');
      if (latPeak < 0.3) f.push('lateral wave too weak ' + latPeak.toFixed(2));
      const pp = probePositions(st);
      if (Math.abs(pp.tx.x - 30) > 1e-9 || Math.abs(pp.rx.x + 30) > 1e-9) f.push('probePositions');
      // far from the defect along z: tip amplitude must fall (arc decay)
      const far = eventsAt(st.specimen, g, st.defects, 200).filter(function (e) { return e.kind === 'tipLower'; });
      const near = eventsAt(st.specimen, g, st.defects, 135).filter(function (e) { return e.kind === 'tipLower'; });
      if (near.length && far.length && !(far[0].amp < near[0].amp * 0.2)) f.push('tip arc decay ' + (far[0].amp / near[0].amp).toFixed(3));
      const sc = runScan(st);
      if (!sc || sc.n !== 301 || sc.columns.length !== 301 || sc.step !== 1) f.push('runScan shape');
      if (sc && sc.columns[135]) {
        let lo2 = 1, hi2 = 0;
        for (let i = 0; i < sc.columns[135].length; i++) { lo2 = Math.min(lo2, sc.columns[135][i]); hi2 = Math.max(hi2, sc.columns[135][i]); }
        if (lo2 < 0 || hi2 > 1 || hi2 - lo2 < 0.3) f.push('scan column grey range ' + lo2.toFixed(2) + '..' + hi2.toFixed(2));
      }
      if (typeof css !== 'string' || css.indexOf('/style') >= 0) f.push('css');
    } catch (e) { f.push('exception ' + (e && e.message)); }
    return f;
  }

  UT.tofd = {
    N_SAMPLES, REF_GAIN_DB, BEAM_20DB_DEG, LIMITS,
    derive, pointTime, depthFromTime, eventsAt, ascan, compute, runScan, startScan, stopScan, isScanning,
    probePositions, panel, css,
    __selftest: selftest,
  };

  Object.assign(UT.test, { tofd: testTofd, runTofdScan: testRunTofdScan });
})(window.UT = window.UT || {});

</script>
<script>
// ---- src/55-aut.js ----
/* 55-aut.js — AUT (automated ultrasonic testing): fixed-x scan along the weld, three transit/TOF
 * gates, strip charts (amplitude + TOF), colour map and the AUT panel window ('aut').
 * Physics functions are pure functions of their arguments; only startScan()/stopScan(), the panel
 * and the test API read/write UT.state. SPEC §6.8 as amended by §14.6, §15.10 and §15.11.
 */
// SPEC NOTES (decisions where the spec is silent or ambiguous)
// - The scan runs at the CURRENT probe x (state.probe.x, "user chosen" by dragging the probe) and at
//   the probe's skew; state.aut.x is refreshed to that x whenever a scan is started so the value in the
//   state mirrors the last scan. z steps 0 … L inclusive in 1 mm steps (n = L + 1, like the TOFD D-scan).
// - One trace at the fixed x (UT.rays.trace with the same opts 40-ascan uses: maxPath = delay + range,
//   21 fan rays, maxLegs from display.skips) and per z: amp = ampNoZ · UT.rays.zFactor(...) for echoes
//   that belong to a defect (echoes without defectId are z-independent), then UT.ascan.synth at
//   nSamples = UT.ascan.N_SAMPLES and UT.ascan.evalGates with {...instrument, gates: aut.gates,
//   activeGate: aut.activeGate}; so the column at z = probe.z equals frame.aut.readouts exactly.
// - scan.amp[i][k] = the gate's peak % FSH (unclipped, as evalGates reports); when nothing in the gate
//   reaches the level the value is the gate's maximum sample (< level) so the amplitude trace stays
//   continuous, and scan.tof[i][k] = NaN. scan.tof is the TRUE sound path (mm) of the gated peak.
//   Unscanned columns (animated scan in progress) hold NaN in both arrays; scan.filled counts columns.
// - Gates that are off produce amp = 0 / tof = NaN and are skipped by aboveLevel().
// - Colour map = §14.6 seven bands (white ≥ 100, red 80–100, magenta 60–80, yellow 40–60, green 25–40,
//   cyan 10–25, blue < 10); "Rev Map" reverses the colour order (blue for the strongest, white for the
//   weakest) in the legend and in the TOF strip. The §6.8 five-band map is superseded by §14.6.
// - RDT / RTD radios: state.aut.strip ∈ 'rdt' (amplitude strip only) | 'rtd' (TOF strip only) | 'both'
//   (default; both strips side by side). aut.rectified mirrors strip !== 'rtd' for other modules.
// - A "Gate on" checkbox is added to the gate group (the frozen default state has gate 3 off and the
//   screenshot offers no way to switch a gate on); "Gates Same" copies gate 1 (start/width/level/on)
//   into gates 2 and 3.
// - Level spinner 1 % steps (1 … 100), Width slider 1 mm steps (1 … 200), Start slider 1 mm steps
//   (0 … 400); Range ◀▶ ±2 % (10 … 1000 mm), X-Shift ◀▶ ±1 mm, AMP slider 0 … 110 dB — all written
//   through UT.setIn('instrument' | 'aut', …).
// - Animated scan: 6 columns per frame; the probe is moved along with the scan head (UT.setIn('probe',
//   {z})) so the live A-scan / cross-section follow it, and its original z is restored when the scan
//   finishes or is stopped. Partial scans are stored via UT.setIn('aut', {scan, running}) and
//   'scan:progress' {kind: 'aut', i, n} is emitted every frame. runScan() is pure and synchronous
//   (opts.sync accepted and ignored).
// - Strip canvas cv-aut-strip (186 × 430 CSS px): z runs top (0) → bottom (L); amplitude strip white
//   with dashed vertical threshold lines at every ON gate's level (the active gate darker), the active
//   gate's trace black (others grey); TOF strip blue with a white bar at (tof − start)/width and a
//   3 px amplitude-colour tick beside it; red horizontal line at the scan head (probe.z when idle).
//   Clicking on the strip sets probe.z. Faint z labels every 50 mm on the amplitude strip.

    const lvlLbl = UT.dom.h('span', { class: 'aut-lbl' }, 'Level=');
    const up = UT.dom.h('button', { type: 'button', title: 'Level +1 %' }, '▲');
    const dn = UT.dom.h('button', { type: 'button', title: 'Level −1 %' }, '▼');
    up.addEventListener('click', function () { patchGate(gi(), { level: gateValue('level', (gate().level || 0) + 1) }); });
    dn.addEventListener('click', function () { patchGate(gi(), { level: gateValue('level', (gate().level || 0) - 1) }); });
    ui.labels.level = { el: lvlLbl, fmt: function (v) { return 'Level=' + Math.round(v) + '%'; } };
    const levelRow = UT.dom.h('div', { class: 'aut-gate-row' }, [lvlLbl, UT.dom.h('div', { class: 'aut-spin' }, [up, dn])]);
    // Width / Start sliders
    const hslider = function (key, label, unit, title) {
      const lbl = UT.dom.h('span', { class: 'aut-lbl' }, label + '=');
      ui.labels[key] = { el: lbl, fmt: function (v) { return label + '=' + Math.round(v) + unit; } };
      const input = UT.dom.h('input', { type: 'range', min: LIMITS[key][0], max: LIMITS[key][1], step: 1, title });
      input.value = gate()[key] || 0;
      input.addEventListener('input', function () { const p = {}; p[key] = gateValue(key, parseFloat(input.value)); patchGate(gi(), p); });
      const dec = UT.dom.h('button', { type: 'button', title: label + ' −1' }, '◀');
      const inc = UT.dom.h('button', { type: 'button', title: label + ' +1' }, '▶');
      dec.addEventListener('click', function () { const p = {}; p[key] = gateValue(key, (gate()[key] || 0) - 1); patchGate(gi(), p); });
      inc.addEventListener('click', function () { const p = {}; p[key] = gateValue(key, (gate()[key] || 0) + 1); patchGate(gi(), p); });
      ui.inputs[key] = input;
      return UT.dom.h('div', { class: 'aut-gate-row' }, [lbl, UT.dom.h('div', { class: 'aut-hslider' }, [dec, input, inc])]);
    };
    const widthRow = hslider('width', 'Width', 'mm', 'Transit gate length (mm sound path)');
    const startRow = hslider('start', 'Start', 'mm', 'Gate start (mm sound path)');
    // Gate on checkbox
    const onChk = UT.dom.h('input', { type: 'checkbox', title: 'Gate on / off' });
    onChk.addEventListener('change', function () { patchGate(gi(), { on: !!onChk.checked }); });
    ui.inputs.on = onChk;
    // Gates same
    const same = UT.dom.h('button', { class: 'aut-same', type: 'button', title: 'Copy gate 1 settings to gates 2 and 3 / 게이트 1 설정을 2, 3에 복사' }, 'Gates Same');
    same.addEventListener('click', function () {
      const g1 = autState().gates[0];
      if (!g1) return;
      const gates = autState().gates.map(function (g, i) { return i === 0 ? Object.assign({}, g) : Object.assign({}, g, { start: g1.start, width: g1.width, level: g1.level, on: g1.on }); });
      setAut({ gates });
    });
    // RDT / RTD
    const rdt = UT.dom.h('div', { class: 'aut-rdt' }, [
      UT.dom.h('div', { class: 'aut-rdt-cap' }, [UT.dom.h('span', {}, 'RDT'), UT.dom.h('span', {}, 'RTD')]),
      UT.dom.h('div', { class: 'aut-radios' }, [
        stripRadio('rdt', 'RDT — rectified amplitude strip only'),
        stripRadio('rtd', 'RTD — transit time (TOF) strip only'),
        stripRadio('both', 'Both strips'),
      ]),
    ]);
    const rev = UT.dom.h('input', { type: 'checkbox', title: 'Reverse the colour map' });
    rev.addEventListener('change', function () { setAut({ revMap: !!rev.checked }); });
    ui.inputs.revMap = rev;
    return UT.dom.h('fieldset', { class: 'aut-gates' }, [
      UT.dom.h('legend', {}, 'Transit/TOF Gate'),
      UT.dom.h('div', { class: 'aut-radios' }, [gateRadio(0), gateRadio(1), gateRadio(2)]),
      levelRow, widthRow, startRow,
      UT.dom.h('label', { class: 'aut-on' }, [onChk, 'Gate on']),
      same, rdt,
      UT.dom.h('label', { class: 'aut-rev' }, [rev, 'Rev Map']),
    ]);
  }

  function buildWindow() {
    const runBtn = UT.dom.h('button', { class: 'aut-run', type: 'button', title: 'Scan along the weld at the current probe x / 현재 탐촉자 위치에서 용접선을 따라 자동 주사' }, 'Run Scan');
    runBtn.addEventListener('click', function () { if (isScanning()) stopScan(); else startScan(); syncInputs(); UT.requestRender(); });
    const clearBtn = UT.dom.h('button', { class: 'aut-clear', type: 'button', title: 'Clear the strip charts' }, 'Clear');
    clearBtn.addEventListener('click', function () { stopScan(true); setAut({ scan: null, running: false }); });
    const strip = UT.dom.h('canvas', { id: 'cv-aut-strip', width: STRIP.w, height: STRIP.h, title: 'Amplitude strip (white) and TOF strip (blue) along the weld — click to move the probe' });
    strip.addEventListener('mousedown', function (e) { if (e.button === 0) onStripMouse(e); });
    const content = UT.dom.h('div', { class: 'aut-panel' }, [
      UT.dom.h('div', { class: 'aut-strip-col' }, [UT.dom.h('div', { class: 'aut-top' }, [runBtn, clearBtn]), strip]),
      buildScope(),
      buildGateGroup(),
    ]);
    const inst = anchorRect('instrument');
    ui.win = UT.dom.win({
      name: 'aut', title: 'AUT', x: inst ? Math.max(0, Math.round(inst.left)) : 4, y: inst ? Math.max(0, Math.round(inst.top)) : 96,
      content, onClose: function () { leave(); },
    });
    ui.runBtn = runBtn;
    ui.strip = strip;
  }

  function syncInputs() {
    if (!ui.win) return;
    const a = autState(), inst = UT.state.instrument;
    const gi = activeGate();
    const g = a.gates[gi] || { start: 0, width: 0, level: 0, on: false };
    const active = typeof document !== 'undefined' ? document.activeElement : null;
    const set = function (key, v) { const el = ui.inputs[key]; if (el && active !== el && String(el.value) !== String(v)) el.value = v; };
    set('range', +inst.range || 100);
    set('delay', +inst.delay || 0);
    set('gain', +inst.gain || 0);
    set('width', g.width || 0);
    set('start', g.start || 0);
    if (ui.inputs.on) ui.inputs.on.checked = !!g.on;
    if (ui.inputs.revMap) ui.inputs.revMap.checked = !!a.revMap;
    const lab = function (key, v) { const l = ui.labels[key]; if (!l) return; const t = l.fmt(v); if (l.el.textContent !== t) l.el.textContent = t; };
    lab('range', +inst.range || 100); lab('delay', +inst.delay || 0); lab('gain', +inst.gain || 0);
    lab('level', g.level || 0); lab('width', g.width || 0); lab('start', g.start || 0);
    ui.radios.forEach(function (r, i) { if (r) r.checked = i === gi; });
    const sm = stripMode();
    ui.stripRadios.forEach(function (r) { r.checked = r.value === sm; });
    if (ui.runBtn) {
      const running = isScanning() || !!a.running;
      ui.runBtn.textContent = running ? 'Stop Scan' : 'Run Scan';
      ui.runBtn.classList.toggle('running', running);
    }
  }

  // ------------------------------------------------------------------ drawing
  function drawScope(frame, state) {
    const cv = ui.ascan;
    if (!cv) return;
    const ctx = UT.dom.fitCanvas(cv, ASCAN.w, ASCAN.h);
    const a = autOf(state);
    const stateLike = Object.assign({}, state, { instrument: Object.assign({}, state.instrument, { gates: a.gates, activeGate: activeGate(), dac: Object.assign({}, state.instrument.dac, { on: false }) }) });
    if (UT.instruments && typeof UT.instruments.drawAscan === 'function') {
      UT.instruments.drawAscan(ctx, frame, stateLike, { base: 'aut', axes: false, margin: { l: 14, r: 4, t: 4, b: 4 } });
      return;
    }
    // fallback: simple trace + gates
    const W = ASCAN.w, H = ASCAN.h;
    ctx.save();
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#1f5f1f'; ctx.setLineDash([1, 3]); ctx.beginPath();
    for (let i = 0; i <= 10; i++) { const x = Math.round(W * i / 10) + 0.5, y = Math.round(H * i / 10) + 0.5; ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke(); ctx.setLineDash([]);
    const asc = frame && frame.ascan;
    const range = (asc && asc.range) || state.instrument.range || 100, delay = asc ? asc.delay : (state.instrument.delay || 0);
    if (asc && asc.samples) {
      ctx.strokeStyle = '#22e022'; ctx.beginPath();
      const n = asc.samples.length;
      for (let i = 0; i < n; i++) { const x = W * i / (n - 1), y = H * (1 - M.clamp(asc.samples[i], 0, 100) / 100); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
      ctx.stroke();
    }
    const cols = ['#ff2020', '#ffe000', '#20e020'];
    (a.gates || []).forEach(function (g, i) {
      if (!g || !g.on) return;
      const x0 = (g.start - delay) / range * W, x1 = (g.start + g.width - delay) / range * W, y = Math.round(H * (1 - g.level / 100)) + 0.5;
      ctx.strokeStyle = cols[i] || cols[2]; ctx.lineWidth = i === activeGate() ? 2.5 : 1.5;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    });
    ctx.restore();
  }

  function drawLegend(state) {
    const cv = ui.legend;
    if (!cv) return;
    const ctx = UT.dom.fitCanvas(cv, LEGEND.w, LEGEND.h);
    const rev = !!autOf(state).revMap;
    const bh = LEGEND.h / BANDS.length;
    ctx.save();
    for (let i = 0; i < BANDS.length; i++) {
      ctx.fillStyle = BANDS[rev ? BANDS.length - 1 - i : i].colour;
      ctx.fillRect(0, i * bh, LEGEND.w, Math.ceil(bh));
    }
    ctx.restore();
  }

  function drawStrip(frame, state) {
    const cv = ui.strip;
    if (!cv) return;
    const ctx = UT.dom.fitCanvas(cv, STRIP.w, STRIP.h);
    const W = STRIP.w, H = STRIP.h;
    const a = autOf(state);
    const sc = a.scan;
    const zr = stripZRange();
    const yOf = function (z) { return (z - zr.z0) / (zr.z1 - zr.z0) * (H - 1); };
    const mode = stripMode();
    const gap = 4;
    const ampW = mode === 'rdt' ? W : mode === 'rtd' ? 0 : Math.floor((W - gap) / 2);
    const tofX = mode === 'rdt' ? W : mode === 'rtd' ? 0 : ampW + gap;
    const tofW = W - tofX;
    const gi = activeGate();
    const gates = (sc && sc.gates) || a.gates || [];
    const rev = !!a.revMap;
    ctx.save();
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    // amplitude strip
    if (ampW > 0) {
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, ampW, H);
      // faint z labels every 50 mm
      ctx.fillStyle = '#b0b0b0'; ctx.font = '9px Segoe UI, Arial, sans-serif'; ctx.textBaseline = 'top';
      for (let z = Math.ceil(zr.z0 / 50) * 50; z <= zr.z1; z += 50) { const y = yOf(z); ctx.fillRect(0, Math.round(y) + 0.5, 4, 1); ctx.fillText(String(z), 5, Math.min(H - 10, y + 1)); }
      // thresholds
      gates.forEach(function (g, i) {
        if (!g || !g.on) return;
        const x = Math.round(M.clamp(g.level, 0, 100) / 100 * (ampW - 1)) + 0.5;
        ctx.strokeStyle = i === gi ? '#202020' : '#9a9a9a'; ctx.lineWidth = 1; ctx.setLineDash(i === gi ? [4, 3] : [2, 3]);
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      });
      ctx.setLineDash([]);
      // traces (other gates grey, active black)
      if (sc && sc.amp) {
        const order = [];
        for (let i = 0; i < sc.amp.length; i++) if (i !== gi) order.push(i);
        order.push(gi);
        order.forEach(function (i) {
          const arr = sc.amp[i];
          if (!arr || !gates[i] || !gates[i].on) return;
          ctx.strokeStyle = i === gi ? '#000000' : '#a0a0a0'; ctx.lineWidth = i === gi ? 1.5 : 1;
          ctx.beginPath();
          let pen = false;
          for (let k = 0; k < sc.n; k++) {
            const v = arr[k];
            if (!Number.isFinite(v)) { pen = false; continue; }
            const x = M.clamp(v, 0, 100) / 100 * (ampW - 1), y = yOf(sc.z0 + k * sc.step);
            if (!pen) { ctx.moveTo(x, y); pen = true; } else ctx.lineTo(x, y);
          }
          ctx.stroke();
        });
      }
    }
    // TOF strip
    if (tofW > 0) {
      ctx.fillStyle = '#0018e0'; ctx.fillRect(tofX, 0, tofW, H);
      const g = gates[gi];
      if (sc && sc.tof && sc.tof[gi] && g && g.on && g.width > 0) {
        const tof = sc.tof[gi], amp = sc.amp[gi];
        for (let k = 0; k < sc.n; k++) {
          const t = tof[k];
          if (!Number.isFinite(t)) continue;
          const u = M.clamp((t - g.start) / g.width, 0, 1);
          const x = tofX + 4 + u * (tofW - 12), y = yOf(sc.z0 + k * sc.step);
          ctx.fillStyle = colourFor(amp[k], rev); ctx.fillRect(x - 4, y - 0.5, 3, 1.5);
          ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y - 0.5, 6, 1.5);
        }
      }
    }
    // scan head / probe z
    const headZ = (anim && sc) ? sc.z0 + Math.min(anim.i, sc.n - 1) * sc.step : state.probe.z;
    if (Number.isFinite(headZ)) {
      const y = Math.round(yOf(M.clamp(headZ, zr.z0, zr.z1))) + 0.5;
      ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.restore();
  }

  const panel = {
    /** The 'aut' window api (null until first open()). */
    window: null,
    isOpen() { return !!(ui.win && ui.win.isOpen()); },
    /** Create (lazily) and show the AUT window. */
    open() {
      if (typeof document === 'undefined') return null;
      UT.dom.injectCss('aut', css);
      if (!ui.win) buildWindow();
      panel.window = ui.win;
      if (!ui.subscribed) {
        ui.subscribed = true;
        UT.bus.on('render', function (frame) { panel.draw(frame); });
      }
      ui.win.show();
      syncInputs();
      UT.requestRender();
      return ui.win;
    },
    /** Hide the window (stops a running scan; keeps the strips). */
    close() {
      stopScan();
      if (ui.win && ui.win.isOpen()) ui.win.hide();
      return ui.win;
    },
    toggle() { return panel.isOpen() ? panel.close() : panel.open(); },
    /** Draw the A-scan, legend and strip charts from the frame (no-op while hidden). */
    draw(frame) {
      if (!panel.isOpen()) return;
      const state = UT.state;
      try {
        syncInputs();
        drawScope(frame, state);
        drawLegend(state);
        drawStrip(frame, state);
      } catch (e) { console.error('[UT.aut.panel]', e); }
    },
  };

  // ================================================================== test API
  function testRunAutScan() {
    stopScan(true);
    const sc = runScan(UT.state, { sync: true });
    if (!sc) return null;
    UT.setIn('aut', { scan: sc, running: false, x: UT.state.probe.x });
    return { z0: sc.z0, z1: sc.z1, step: sc.step, n: sc.n, aboveLevel: sc.amp.map(function (_, i) { return aboveLevel(sc, i); }) };
  }

  // ================================================================== self test
  function selftest() {
    const f = [];
    try {
      if (colourFor(100) !== '#ffffff' || colourFor(99.9) !== '#ff0000' || colourFor(60) !== '#ff00ff' || colourFor(45) !== '#ffff00' || colourFor(30) !== '#00c000' || colourFor(15) !== '#00ffff' || colourFor(5) !== '#0000ff') f.push('colourFor bands');
      if (colourFor(100, true) !== '#0000ff' || colourFor(5, true) !== '#ffffff') f.push('colourFor rev');
      const fake = { z0: 0, z1: 5, step: 1, n: 6, gates: [{ on: true, level: 20 }], amp: [[0, 30, 40, 10, 50, 60]] };
      const iv = aboveLevel(fake, 0);
      if (JSON.stringify(iv) !== '[[1,2],[4,5]]') f.push('aboveLevel ' + JSON.stringify(iv));
      if (!(UT.rays && UT.ascan && UT.specimens)) return f;   // physics modules absent: helpers only
      const st = UT.defaultState();
      st.mode = 'aut';
      st.specimen = UT.specimens.plateWeld({ T: 20, L: 60 });
      st.defects = [UT.specimens.defectPresets.lof(st.specimen, { zFrom: 20, zTo: 40 })];
      st.probe.z = 30;
      st.instrument.gain = 40;
      st.aut.gates = [{ on: true, start: 10, width: 80, level: 20 }, { on: true, start: 30, width: 30, level: 20 }, { on: false, start: 40, width: 20, level: 20 }];
      // put the probe at the LOF maximum (second-leg normal incidence, x ≈ 50…60 for T 20 / 60°)
      let bestX = 54, bestAmp = -1;
      for (let x = 46; x <= 64; x += 2) {
        st.probe.x = x;
        const pc = prepare(st);
        const e = pc ? pc.echoes.filter(function (q) { return q.defectId !== undefined; }).sort(function (p, q) { return q.ampNoZ - p.ampNoZ; })[0] : null;
        if (e && e.ampNoZ > bestAmp) { bestAmp = e.ampNoZ; bestX = x; }
      }
      st.probe.x = bestX;
      const sc = runScan(st, { sync: true });
      if (!sc || sc.n !== 61 || sc.z1 !== 60 || sc.step !== 1 || sc.amp.length !== 3 || sc.tof.length !== 3) { f.push('runScan shape'); return f; }
      if (sc.amp[0].length !== 61 || !(sc.amp[0] instanceof Float32Array)) f.push('runScan arrays');
      if (sc.filled !== 61 || !sc.done) f.push('runScan filled');
      if (!sc.amp[2].every(function (v) { return v === 0; }) || !sc.tof[2].every(function (v) { return Number.isNaN(v); })) f.push('gate off column');
      const c = prepare(st);
      const col = scanColumn(st, 30, c);
      if (col.amp.length !== 3 || Math.abs(col.amp[0] - sc.amp[0][30]) > 1e-3) f.push('scanColumn consistency');
      // amplitude must fall off away from the defect (z 20..40) and be symmetric-ish about its centre
      const centre = sc.amp[0][30], far = sc.amp[0][2];
      if (!(centre > far)) f.push('no z fall-off ' + centre + ' vs ' + far);
      if (Number.isFinite(sc.tof[0][30]) && !(sc.tof[0][30] >= 20 && sc.tof[0][30] <= 60)) f.push('tof outside gate ' + sc.tof[0][30]);
    } catch (e) { f.push('exception: ' + (e && e.message)); }
    return f;
  }

  UT.aut = {
    BANDS, COLS_PER_FRAME, STRIP, ASCAN,
    colourFor, prepare, scanColumn, runScan, aboveLevel, startScan, stopScan, isScanning,
    panel, css,
    open() { return panel.open(); },
    close() { return panel.close(); },
    toggle() { return panel.toggle(); },
    /** The 'aut' window api (null until first open()). */
    get window() { return panel.window; },
    __selftest: selftest,
  };

  Object.assign(UT.test, { runAutScan: testRunAutScan });
})(window.UT = window.UT || {});

</script>
<script>
// ---- src/60-view-cross.js ----
/* 60-view-cross.js — cross-section canvas (cv-cross) + X ruler (cv-ruler): specimen, weld outlines,
 * holes/Perspex, defects, beam fan, probe shoe(s), depth ruler, labels; probe drag, defect brush,
 * hover cursor, wheel gain; V1/V2 oblique block screens (SPEC §7.5, §14.1, §14.8, §15.6).
 */
(function (UT) {
  'use strict';

  // SPEC NOTES (decisions where the spec is silent or ambiguous)
  // - Horizontal centring: the specimen is centred on x = 0 whenever its extents start left of 0
  //   (welds, TKY, lamination plate), otherwise on the extents centre (blocks 0…300). Ruler labels are
  //   unsigned |x| for those centred specimens and the raw block x otherwise.
  // - Vertical placement: y = 0 (scan surface) is placed 20–24 mm (× scale) below the canvas top so the
  //   shoe fits above the plate; taller specimens (TKY brace) push it down; no refit, clipping applies.
  // - Beam legs of fan/edge polylines are counted by testing each vertex against the outline/arcs
  //   (a vertex on an outline edge or arc starts a new leg); vertices carrying `.leg` are honoured.
  //   Only the first display.skips legs are drawn, as in §14.1.
  // - 0° ladder: parallel dotted lines every ~1 mm across the crystal diameter, each cast straight
  //   down to the first outline edge or planar defect below it (so laminations shadow the backwall).
  // - TOFD with no tracer rays: a synthetic centre + ±20 dB fan is drawn from each index point to
  //   the backwall (leg 1). TOFD probe positions come from UT.tofd.probePositions(state) when present
  //   (array [tx, rx] or {tx, rx}, each {x, side}); fallback tx = probe.x + pcs/2 (side +1), rx mirrored.
  // - Brush: left-drag collects mm points; on mouseup emits 'defect:brush' {pts, erase:false, brushMm}.
  //   For volumetric brush types (state.editing.brush not planar) the stroke is dilated by the brush
  //   radius and its convex hull is sent as pts, so the resulting polygon is a filled blob like UTman's
  //   dabs. Planar strokes send the raw (decimated) polyline. Right-drag emits {pts, erase:true}.
  //   Brush size (px) comes from setBrush(on, px) or state.editing.brushPx / brushSize; default 26.
  // - Probe drag: left mousedown anywhere on the canvas (not editing) jumps the probe x to the mouse and
  //   drags it (clamped to the scan surface); Shift-drag changes z by vertical mouse movement
  //   (1 mm per mm of scale). Double-click on a defect sets selectedDefect = n − 1.
  // - Oblique V1/V2 screen: the wide-face specimen is rebuilt for drawing (cached); the top band is the
  //   narrow face sheared by (depth·cos30°, −depth·sin30°). Probe on the band when spec.face === 'wide'
  //   (x along the band, z = depth fraction), on the front face when 'narrow' (x, y = z). Dropping on the
  //   other face calls UT.modes.setFace(face) then sets probe x/z.
  // - toPx/toMm in oblique mode map the front (wide) face.

  UT.views = UT.views || {};
  const M = UT.math;
  const C = UT.consts;
  const COL = C.COLOURS;
  const MM_SPAN = 320;               // canvas width covers 320 mm (§14.1)
  const FONT = '12px "Segoe UI", Arial, sans-serif';
  const FONT_SMALL = '11px "Segoe UI", Arial, sans-serif';

  const S = {
    canvas: null, ruler: null,
    xf: null,                        // {scale, ox, oy, W, H, cx}
    ob: null,                        // oblique layout cache {sc, ox, oy, sh, band, spec, depth, W, H}
    obSpecs: {},                     // cached wide specimens for the oblique drawing
    lastFrame: null,
    drag: null,                      // probe drag {kind, ...}
    stroke: null,                    // brush stroke {pts:[{x,y}], erase}
    brush: { on: false, px: 26 },
    ghost: null,                     // oblique drag ghost {face, x, z}
    hoverMm: null,
  };

  // ------------------------------------------------------------------ helpers
  function state() { return UT.state; }
  function spec() { return UT.state && UT.state.specimen; }
  function isPlanarType(t) { return UT.specimens && UT.specimens.isPlanar ? UT.specimens.isPlanar(t) : (t === 'planar' || t === 'crack' || t === 'lof' || t === 'lamination' || t === 'root'); }
  function isOblique(st) {
    return !!(st && (st.mode === 'v1' || st.mode === 'v2') && st.specimen && (st.specimen.id === 'v1' || st.specimen.id === 'v2'));
  }
  function derivedOf(frame, st) {
    if (frame && frame.derived) return frame.derived;
    try { return UT.probe.derive(st.probe, st.specimen); } catch (e) { return null; }
  }
  function cssW(cv) { return cv.clientWidth || cv.width || 300; }
  function cssH(cv) { return cv.clientHeight || cv.height || 150; }

  /** Pure transform for the normal cross-section: fixed W/320 px per mm (§14.1). */
  function computeTransform(sp, W, H) {
    const scale = W / MM_SPAN;
    let cx = 0, yMin = 0, yMax = 20;
    if (sp && sp.extents) {
      cx = sp.extents.xMin < 0 ? 0 : (sp.extents.xMin + sp.extents.xMax) / 2;
      yMin = sp.extents.yMin; yMax = sp.extents.yMax;
    }
    const roomAbove = M.clamp(H / scale - yMax - 4, 20, 24);       // mm above the scan surface for the shoe
    const above = Math.max(roomAbove, -yMin + 6);
    const oy = above * scale;
    return { scale, ox: W / 2 - cx * scale, oy, W, H, cx };
  }

  function ensureTransform(st) {
    const cv = S.canvas;
    const W = cv ? cssW(cv) : (S.ruler ? cssW(S.ruler) : 1280);
    const H = cv ? cssH(cv) : 200;
    S.xf = computeTransform(st && st.specimen, W, H);
    return S.xf;
  }

  /** mm → CSS px in the cross-section canvas. */
  function toPx(x, y) {
    if (S.ob && isOblique(state())) return { x: S.ob.ox + x * S.ob.sc, y: S.ob.oy + y * S.ob.sc };
    const xf = S.xf || ensureTransform(state());
    return { x: xf.ox + x * xf.scale, y: xf.oy + y * xf.scale };
  }
  /** CSS px → mm in the cross-section canvas. */
  function toMm(px, py) {
    if (S.ob && isOblique(state())) return { x: (px - S.ob.ox) / S.ob.sc, y: (py - S.ob.oy) / S.ob.sc };
    const xf = S.xf || ensureTransform(state());
    return { x: (px - xf.ox) / xf.scale, y: (py - xf.oy) / xf.scale };
  }
  /** Recompute the mm→px transform from the canvas size and the current specimen. */
  function fit() { S.ob = null; return ensureTransform(state()); }

  function P(ctx, pt) { const p = toPx(pt.x, pt.y); return p; }
  function polyPath(ctx, pts, close) {
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) { const p = toPx(pts[i].x, pts[i].y); if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); }
    if (close) ctx.closePath();
  }

  /** Tag of the outline edge/arc a point lies on (within tol mm), or null. */
  function surfaceTagAt(sp, x, y, tol) {
    const t = tol === undefined ? 0.05 : tol;
    for (const e of sp.edges || []) {
      if (x < Math.min(e.a.x, e.b.x) - t || x > Math.max(e.a.x, e.b.x) + t || y < Math.min(e.a.y, e.b.y) - t || y > Math.max(e.a.y, e.b.y) + t) continue;
      if (M.pointSegment(x, y, e.a.x, e.a.y, e.b.x, e.b.y).d < t) return e.tag || 'end';
    }
    for (const a of sp.arcs || []) if (Math.abs(M.dist(x, y, a.cx, a.cy) - a.r) < t) return a.tag || 'radius';
    return null;
  }

  function polylinePts(r) {
    if (!r) return null;
    if (Array.isArray(r)) return r.length && r[0] && Array.isArray(r[0].pts) ? null : r;
    if (Array.isArray(r.pts)) return r.pts;
    return null;
  }

  // ------------------------------------------------------------------ brush geometry (pure)
  /** Convex hull (Andrew monotone chain) of {x,y} points. */
  function hull(points) {
    const pts = points.slice().sort(function (a, b) { return a.x === b.x ? a.y - b.y : a.x - b.x; });
    if (pts.length < 3) return pts;
    const cross = function (o, a, b) { return (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x); };
    const lower = [];
    for (const p of pts) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop(); lower.push(p); }
    const upper = [];
    for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop(); upper.push(p); }
    lower.pop(); upper.pop();
    return lower.concat(upper);
  }
  /** Dilate a stroke by radius r (mm) and return its closed convex outline (≤ ~40 points). */
  function dilate(pts, r) {
    const samples = [];
    let last = null;
    for (const p of pts) {
      if (last && M.dist(last.x, last.y, p.x, p.y) < 0.5) continue;
      last = p;
      for (let k = 0; k < 12; k++) { const a = k / 12 * Math.PI * 2; samples.push({ x: p.x + r * Math.cos(a), y: p.y + r * Math.sin(a) }); }
    }
    let h = hull(samples);
    const step = Math.max(1, Math.ceil(h.length / 36));
    if (step > 1) h = h.filter(function (_, i) { return i % step === 0; });
    const out = h.map(function (p) { return { x: +p.x.toFixed(2), y: +p.y.toFixed(2) }; });
    if (out.length) out.push({ x: out[0].x, y: out[0].y });
    return out;
  }

  // ------------------------------------------------------------------ drawing: specimen
  function drawSpecimen(ctx, sp) {
    if (!sp || !sp.outline || sp.outline.length < 3) return;
    ctx.save();
    polyPath(ctx, sp.outline, true);
    ctx.fillStyle = COL.steel;
    ctx.fill();
    ctx.strokeStyle = '#2a2a2a';
    ctx.lineWidth = 1;
    ctx.stroke();
    // weld: outlines only — fusion faces + cap/root bulges in light grey (§14.1)
    if (sp.weld) {
      ctx.strokeStyle = '#d0d0d0';
      ctx.lineWidth = 1;
      for (const f of sp.weld.fusionFaces || []) {
        const a = toPx(f.a.x, f.a.y), b = toPx(f.b.x, f.b.y);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      const bulge = function (pts) {
        if (!pts || pts.length < 2) return;
        ctx.beginPath();
        for (let i = 0; i < pts.length; i++) { const p = toPx(pts[i].x, pts[i].y); if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); }
        ctx.stroke();
      };
      bulge(sp.weld.cap); bulge(sp.weld.root);
      // root gap / root face lines from the region (single-v / double-v)
      if (sp.weld.region && sp.weld.region.length >= 4) {
        const rg = sp.weld.region;
        ctx.setLineDash([]);
        for (let i = 0; i < rg.length; i++) {
          const a = rg[i], b = rg[(i + 1) % rg.length];
          if (Math.abs(a.y - b.y) < 1e-9 && (Math.abs(a.y) < 1e-9 || Math.abs(a.y - sp.T) < 1e-9)) continue;   // skip top/bottom closing edges
          const pa = toPx(a.x, a.y), pb = toPx(b.x, b.y);
          ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
        }
      }
    }
    ctx.restore();
  }

  function drawHoles(ctx, sp) {
    if (!sp || !sp.holes) return;
    const xf = S.xf;
    ctx.save();
    for (const h of sp.holes) {
      const p = toPx(h.x, h.y);
      const r = Math.max(h.r * xf.scale, 3);
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = COL.hole; ctx.fill();
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.restore();
  }

  function drawPerspex(ctx, sp) {
    if (!sp || !sp.perspex) return;
    const p = toPx(sp.perspex.x, sp.perspex.y);
    ctx.save();
    ctx.beginPath(); ctx.arc(p.x, p.y, sp.perspex.r * S.xf.scale, 0, Math.PI * 2);
    ctx.fillStyle = COL.perspex; ctx.fill();
    ctx.strokeStyle = '#3a6a90'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }

  function drawSlot(ctx, sp) {
    if (!sp || !sp.retroSlot) return;
    const sl = sp.slot || { x: 100, w: 2, d: 5 };
    const a = toPx(sl.x - sl.w / 2, 0), b = toPx(sl.x + sl.w / 2, sl.d);
    ctx.save();
    ctx.fillStyle = COL.cream; ctx.fillRect(a.x, a.y - 1, b.x - a.x, b.y - a.y + 1);
    ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(a.x, b.y); ctx.lineTo(b.x, b.y); ctx.lineTo(b.x, a.y); ctx.stroke();
    ctx.restore();
  }

  function drawIowGuides(ctx, sp) {
    if (!sp || sp.id !== 'iow') return;
    ctx.save();
    ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    ctx.fillStyle = '#000'; ctx.font = FONT_SMALL; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    for (const h of sp.holes || []) {
      if (h.ladder) continue;
      const a = toPx(h.x, 0), b = toPx(h.x, h.y);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.fillText(h.label || (h.y + 'mm'), a.x + 4, a.y + 3);
    }
    ctx.restore();
  }

  // ------------------------------------------------------------------ drawing: defects
  function drawDefects(ctx, st) {
    const defects = st.defects || [];
    if (!defects.length) return;
    ctx.save();
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for (const d of defects) {
      if (!d || !d.pts || d.pts.length < 2 || d.visible === false) continue;
      if (isPlanarType(d.type)) {
        polyPath(ctx, d.pts, false);
        ctx.strokeStyle = COL.defect; ctx.lineWidth = 3; ctx.stroke();
      } else {
        polyPath(ctx, d.pts, true);
        ctx.fillStyle = COL.defect; ctx.fill();
        ctx.strokeStyle = COL.defect; ctx.lineWidth = 3; ctx.stroke();
      }
    }
    // selected defect: blue bounding rectangle while the editor is open
    if (st.editing && st.editing.defect) {
      const sel = defects.find(function (d) { return d && (d.n - 1) === (st.selectedDefect || 0); });
      if (sel && sel.pts && sel.pts.length) {
        const b = UT.specimens.bbox(sel.pts);
        const pad = 3;
        const a = toPx(b.xMin - pad, b.yMin - pad), c = toPx(b.xMax + pad, b.yMax + pad);
        ctx.strokeStyle = '#0000ff'; ctx.lineWidth = 1.5; ctx.setLineDash([]);
        ctx.strokeRect(a.x, a.y, c.x - a.x, c.y - a.y);
      }
    }
    ctx.restore();
  }

  function drawStroke(ctx) {
    const s = S.stroke;
    if (!s || s.pts.length < 1) return;
    ctx.save();
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = s.erase ? 'rgba(120,120,120,0.55)' : 'rgba(224,0,0,0.85)';
    ctx.lineWidth = s.planar && !s.erase ? 3 : Math.max(3, S.brush.px);
    ctx.beginPath();
    for (let i = 0; i < s.pts.length; i++) { const p = toPx(s.pts[i].x, s.pts[i].y); if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); }
    if (s.pts.length === 1) { const p = toPx(s.pts[0].x, s.pts[0].y); ctx.lineTo(p.x + 0.1, p.y); }
    ctx.stroke();
    ctx.restore();
  }

  // ------------------------------------------------------------------ drawing: beam
  function rayColour(mode, leg, lastTag, base) {
    if (mode === 'propagation') return C.LEG_COLOURS[Math.min(leg, C.LEG_COLOURS.length) - 1] || base;
    if (mode === 'geometry') return (lastTag && C.SURFACE_COLOURS[lastTag]) || (leg === 1 ? '#ffffff' : base);
    return base;
  }

  /** Stroke a ray polyline, splitting into legs at outline reflections; only legs ≤ skips are drawn. */
  function strokeRay(ctx, sp, pts, skips, mode, base) {
    if (!pts || pts.length < 2) return;
    let leg = pts[0].leg || 1, lastTag = null;
    let colour = rayColour(mode, leg, lastTag, base);
    ctx.strokeStyle = colour;
    let p0 = toPx(pts[0].x, pts[0].y);
    ctx.beginPath(); ctx.moveTo(p0.x, p0.y);
    for (let i = 1; i < pts.length; i++) {
      const p = toPx(pts[i].x, pts[i].y);
      ctx.lineTo(p.x, p.y);
      if (i === pts.length - 1) break;
      let tag = null, newLeg = leg;
      if (pts[i].leg !== undefined) { if (pts[i].leg > leg) { newLeg = pts[i].leg; tag = pts[i].tag || pts[i].surfaceTag || 'bottom'; } }
      else { tag = surfaceTagAt(sp, pts[i].x, pts[i].y); if (tag) newLeg = leg + 1; }
      if (newLeg !== leg) {
        leg = newLeg; lastTag = tag;
        if (leg > skips) break;
        const nc = rayColour(mode, leg, lastTag, base);
        if (nc !== colour) { ctx.stroke(); colour = nc; ctx.strokeStyle = colour; ctx.beginPath(); ctx.moveTo(p.x, p.y); }
      }
    }
    ctx.stroke();
  }

  /** Cast a vertical line from (x, 0) down to the first outline edge or planar defect below it. */
  function castDown(sp, x, defects) {
    let best = sp.T || 20;
    for (const e of sp.edges || []) {
      if (e.tag === 'top' || e.tag === 'cap') continue;
      const h = M.raySegment(x, 0.01, 0, 1, e.a.x, e.a.y, e.b.x, e.b.y, 0.02);
      if (h && h.t < best) best = h.t;
    }
    for (const d of defects || []) {
      if (!d || !isPlanarType(d.type) || !d.pts) continue;
      for (let i = 0; i < d.pts.length - 1; i++) {
        const h = M.raySegment(x, 0.01, 0, 1, d.pts[i].x, d.pts[i].y, d.pts[i + 1].x, d.pts[i + 1].y, 0.02);
        if (h && h.t < best) best = h.t;
      }
    }
    return best;
  }

  function drawZeroLadder(ctx, st, sp, der, E) {
    const D = der.diameter || 10;
    const mode = st.display.colourCode || 'none';
    const defects = st.display.hide ? [] : st.defects;
    const step = Math.max(1, 4 / S.xf.scale);
    ctx.save();
    ctx.lineWidth = 1;
    ctx.setLineDash([1, 2]);
    ctx.strokeStyle = mode === 'none' ? 'rgba(255,255,255,0.55)' : rayColour(mode, 1, null, '#ffffff');
    if (st.display.singleLine) {
      const y = castDown(sp, E.x, defects);
      const a = toPx(E.x, 0), b = toPx(E.x, y);
      ctx.setLineDash([]); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    } else {
      for (let u = -D / 2; u <= D / 2 + 1e-6; u += step) {
        const x = E.x + u;
        const y = castDown(sp, x, defects);
        const a = toPx(x, 0), b = toPx(x, y);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
    ctx.restore();
  }

  /** Synthetic fan (index → backwall, leg 1) used for TOFD probes and phased-array sectors. */
  function drawSimpleFan(ctx, sp, E, side, angles, dashed) {
    const T = sp.T || 20;
    ctx.save();
    ctx.lineWidth = 1;
    ctx.setLineDash(dashed ? [4, 3] : [1, 2]);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    for (const a of angles) {
      const t = Math.tan(M.deg2rad(a));
      const p0 = toPx(E.x, E.y), p1 = toPx(E.x - side * T * t, T);
      ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
    }
    ctx.restore();
  }

  function drawBeam(ctx, frame, st, sp, der, E) {
    const disp = st.display;
    if (!disp.beam || disp.hide) return;
    const probe = st.probe;
    const skips = Math.max(1, disp.skips || 1);
    const mode = disp.colourCode || 'none';
    if (st.mode === 'tofd') {
      const pp = tofdProbes(st, der);
      const a = st.tofd && st.tofd.txAngle ? st.tofd.txAngle : 60;
      const h20 = der.halfAngle20dB || 4;
      drawSimpleFan(ctx, sp, { x: pp.tx.x, y: 0 }, pp.tx.side, [a - h20, a, a + h20], false);
      drawSimpleFan(ctx, sp, { x: pp.rx.x, y: 0 }, pp.rx.side, [a - h20, a, a + h20], false);
      return;   // the PE tracer fan (if any) is meaningless for the TOFD pair
    }
    if (probe.method === 'pa') {
      const angles = UT.probe.paAngles(probe);
      const sub = angles.filter(function (_, i) { return i % 2 === 0; });
      ctx.save();
      drawSimpleFan(ctx, sp, E, probe.side || 1, sub, false);
      ctx.restore();
      return;
    }
    if ((probe.angle || 0) === 0) { drawZeroLadder(ctx, st, sp, der, E); return; }
    const rays = frame && frame.rays;
    if (!rays) return;
    drawTracerRays(ctx, rays, sp, skips, mode, der, disp.singleLine);
  }

  function drawTracerRays(ctx, rays, sp, skips, mode, der, singleLine) {
    ctx.save();
    ctx.lineCap = 'butt';
    const base = mode === 'none' ? 'rgba(255,255,255,0.55)' : (der && der.colour) || '#ffffff';
    if (!singleLine) {
      ctx.lineWidth = 1;
      ctx.setLineDash([1, 2]);
      for (const f of rays.fan || []) {
        const pts = polylinePts(f);
        if (pts) strokeRay(ctx, sp, pts, skips, mode, base);
      }
      ctx.setLineDash([4, 3]);
      for (const e of rays.edge20 || []) {
        const pts = polylinePts(e);
        if (pts) strokeRay(ctx, sp, pts, skips, mode, base);
      }
    }
    const cpts = rays.centre ? (polylinePts(rays.centre) || (rays.centre.legs ? legsToPts(rays.centre.legs) : null)) : null;
    if (cpts) {
      if (singleLine) { ctx.setLineDash([]); ctx.lineWidth = 1.5; strokeRay(ctx, sp, cpts, skips, mode, mode === 'none' ? ((der && der.colour) || '#ffffff') : base); }
      else if (mode === 'none') { ctx.setLineDash([1, 2]); ctx.lineWidth = 1; strokeRay(ctx, sp, cpts, skips, mode, base); }
      else { ctx.setLineDash([]); ctx.lineWidth = 1.5; strokeRay(ctx, sp, cpts, skips, mode, base); }
    }
    ctx.restore();
  }

  function legsToPts(legs) {
    const out = [];
    legs.forEach(function (l, i) { if (i === 0) out.push({ x: l.a.x, y: l.a.y, leg: l.leg || 1 }); out.push({ x: l.b.x, y: l.b.y, leg: (l.leg || i + 1) + 1, tag: l.surfaceTag }); });
    return out;
  }

  function drawHits(ctx, frame, st) {
    const rays = frame && frame.rays;
    if (!rays || !rays.hits || st.display.hide || st.mode === 'tofd') return;
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.lineWidth = 0.5;
    let n = 0;
