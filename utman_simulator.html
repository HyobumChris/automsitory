<script>
// ---- src/80-modes.js ----
/* 80-modes.js — mode controllers: calibration blocks (V1/V2 face switch), step wedge + auto-cal,
 * DAC recording, PLOT (beam spread), SIZE, defect editor window, TKY panel, trade test, lessons.
 * Orchestrates state through UT.set / UT.setIn only. No DOM access at load time (SPEC §15.12).
 */
// SPEC NOTES (decisions where the spec is silent or ambiguous)
// - UT.modes.enabled[mode] = {toolbar, menus} lists the ENABLED ids (literal meaning of the property
//   name; toolbar ids 'tb-*', menu ids 'menu-*'). The §14.7 table (disabled ids) is exposed alongside as
//   enabled[mode].disabledToolbar / disabledMenus / hidden, plus enabled.editor for the editor-open row.
//   UT.modes.isToolbarEnabled(id) / isMenuEnabled(id) combine the current mode with the editor state.
// - Defects policy per mode: weld/tofd/aut keep state.defects; block modes (v1, v2, step, iow, dac, tky)
//   stash the weld defects in a module variable and use []; lamination uses two lamination presets;
//   trade uses the seeded truth. Returning to a weld-kind mode restores the stash.
// - step and lamination modes force a 0° probe (comp mode); tofd sets probe.x = 0 and rectify 'rf'
//   (restored to 'full' on exit); leaving step restores cal {vel: null, zero: 0}.
// - Windows of other modules are opened/closed through the first available of
//   UT.<owner>.open/close, UT.<owner>.panel.open/close, UT.<owner>.window.show/hide, UT.dom.wins[name].
// - Brush size lives in state.editing.brushPx (10–60, default 26); type in state.editing.brush.
// - The circle view / linear bar are drawn by UT.views.plan.drawCircleView / drawLinearBar when present
//   (called as (canvas, {spec, defects, selected: n, onDrag(zFrom, zTo), onSelect(n)}) — the helper binds
//   its own ring/bar mouse handlers); this file carries a fallback renderer + handlers for headless use.
// - Trade test: 3–6 defects from UT.specimens.defectPresets placed in sequential z windows; truth rows
//   are rounded to 0.1 mm; the timer is 60 min (informational only, no auto-submit).
// - DAC: dac.on becomes true once ≥ 2 points are recorded; Record replaces a point within 1 mm of an
//   existing path; the first recorded point fixes refDb (= gain at that moment).
// - Plot markEdge picks the IOW hole whose depth is nearest the gated depth readout (fallback: 13 mm).
// - Auto-cal wizard window is 'autocal' (owned here); ✓ = autoCal.step(), Cancel = autoCal.cancel().
(function (UT) {
  'use strict';
  const M = UT.math;
  const S = UT.specimens;
  const modes = {};

  // ------------------------------------------------------------------ constants / tables
  const HINTS = {
    weld: 'LEFT mouse button/drag to move the UT Probe',
    v1: 'Drag the probe onto the top face (100mm Radius) or the front face (25mm thickness)',
    v2: 'Drag the probe onto the top face (Radius) or the front face (12.5mm thickness)',
    step: 'Place the probe on a step, then press Auto Cal (EPOCH 600) for the two-point calibration',
    iow: 'Use mouse button on the Plotter to plot Beam Spread. Draw on Block to mark 10% Beam Edge',
    dac: 'Set Amplitude and press record button, then draw curves',
    tky: 'Adjust the brace angle in ADJUST MODE. LEFT mouse button/drag to move the UT Probe',
    tofd: 'Press Run Scan to build the D-scan. Click on the D-scan to move the probe',
    aut: 'Set the gates (Level / Width / Start) then press Run Scan',
    trade: 'Trade Test: find the hidden defects, fill in the report table and press Submit',
    lamination: 'Raster the 0° probe along the plate: note the lamination echo and the lost backwall',
    editor: 'LEFT mouse button/drag to draw defect.',
  };
  const MODES = ['weld', 'v1', 'v2', 'step', 'iow', 'dac', 'tky', 'tofd', 'aut', 'trade', 'lamination'];
  const WELD_KIND = { weld: 1, tofd: 1, aut: 1, trade: 1 };
  const BLOCK_KIND = { v1: 1, v2: 1, step: 1, iow: 1, dac: 1, tky: 1 };
  const MODE_OF = { 'plate-weld': 'weld', 'pipe-weld': 'weld', v1: 'v1', v2: 'v2', step: 'step', iow: 'iow', dac: 'dac', tky: 'tky', 'lamination-plate': 'lamination' };
  const DEFECT_TYPES = ['planar', 'volumetric', 'crack', 'lof', 'porosity', 'slag', 'lamination', 'root'];
  const ALL_TB = ['0', '45', '60', '70', 'v2', 'v1', 'dac', 'plot', 'damp', 'size', 'defect', 'hide', 'clear', 'beam', 'rad', 'pipe', 'tky', 'tofd', 'aut'];
  const ALL_MENUS = ['file', 'probes', 'stepwedge', 'weld', 'defects', 'options', 'help'];
  const DISABLED = {
    weld: { toolbar: [], menus: [], hidden: [] },
    dac: { toolbar: ['damp', 'defect', 'hide', 'rad', 'pipe', 'tky', 'tofd', 'aut'], menus: [], hidden: ['compass'] },
    v1: { toolbar: ['0', '45', '60', '70', 'v2', 'dac', 'plot', 'damp', 'size', 'defect', 'hide', 'pipe', 'tky', 'tofd', 'aut'], menus: ['file', 'probes', 'weld', 'defects', 'options'], hidden: ['plan', 'ruler'] },
    v2: { toolbar: ['0', '45', '60', '70', 'v1', 'dac', 'plot', 'damp', 'size', 'defect', 'hide', 'pipe', 'tky', 'tofd', 'aut'], menus: ['file', 'probes', 'weld', 'defects', 'options'], hidden: ['plan', 'ruler'] },
    editor: { toolbar: ALL_TB.filter(function (t) { return ['defect', 'beam', 'rad'].indexOf(t) < 0; }), menus: ALL_MENUS.filter(function (m) { return m !== 'help'; }), hidden: [] },
    iow: { toolbar: ['damp', 'defect', 'hide', 'pipe', 'tky', 'tofd', 'aut'], menus: ['weld', 'defects'], hidden: ['plan', 'compass'] },
    tofd: { toolbar: ['0', 'v2', 'v1', 'damp'], menus: ['probes', 'options'], hidden: ['compass'] },
    aut: { toolbar: ['damp'], menus: ['options'], hidden: ['compass'] },
    tky: { toolbar: ['v2', 'v1', 'dac', 'plot', 'pipe', 'tofd', 'aut'], menus: ['weld'], hidden: ['plan', 'compass', 'ruler'] },
    trade: { toolbar: ['defect', 'v1', 'v2', 'dac', 'plot', 'tky'], menus: ['defects'], hidden: [] },
    step: { toolbar: ['v2', 'v1', 'dac', 'plot', 'tky', 'tofd', 'aut'], menus: [], hidden: ['compass'] },
    lamination: { toolbar: ['v2', 'v1', 'dac', 'plot', 'tky', 'tofd', 'aut'], menus: [], hidden: ['compass'] },
  };
  const enabled = {};
  Object.keys(DISABLED).forEach(function (k) {
    const d = DISABLED[k];
    const dt = d.toolbar.map(function (t) { return 'tb-' + t; });
    const dm = d.menus.map(function (m) { return 'menu-' + m; });
    enabled[k] = {
      toolbar: ALL_TB.map(function (t) { return 'tb-' + t; }).filter(function (id) { return dt.indexOf(id) < 0; }),
      menus: ALL_MENUS.map(function (m) { return 'menu-' + m; }).filter(function (id) { return dm.indexOf(id) < 0; }),
      disabledToolbar: dt, disabledMenus: dm, hidden: d.hidden.slice(),
    };
  });

  // ------------------------------------------------------------------ module state
  let stash = null;            // weld defects stashed while in a block / lamination / trade mode
  let lastAngle = null;        // for the v1/v2 face rebuild on angle change
  let savedAngle = null;       // angle probe in use before step/lamination forced 0°, restored on exit
  let tradeTimer = null;
  let autoCalState = null;     // {step: 1|2, t1, d1, d2}
  let dacWin = null, tkyWin = null, tradeWin = null, lessonsWin = null, editorWin = null, autoCalWin = null;
  const ui = {};               // live DOM refs of the windows (rebuilt lazily)
  const tkyOpts = { braceAngle: 45, braceT: 12, chordT: 20, braceOffset: 0, precision: 1, kind: 'T-joint' };

  function st() { return UT.state; }
  function has(path) {
    let o = UT;
    for (const k of path.split('.')) { if (!o || o[k] === undefined || o[k] === null) return null; o = o[k]; }
    return o;
  }
  function presetMode(angle) { const p = UT.probe && UT.probe.presets[angle]; return p ? p.mode : (angle === 0 ? 'comp' : 'shear'); }

  // ------------------------------------------------------------------ external windows (other owners)
  const OWNERS = { plotter: 'views.plotter', rad: 'views.radiograph', size: 'views.sizing', tofd: 'tofd', 'tofd-ascan': 'tofd', aut: 'aut', pipe3d: 'views.pipe3d', usk7: 'instruments' };
  /** Open/close a window owned by another module through whichever API it exposes. */
  function extWin(name, open) {
    const owner = has(OWNERS[name] || '');
    const verb = open ? 'open' : 'close';
    try {
      if (owner) {
        if (name === 'tofd-ascan' && owner.ascanWindow && typeof owner.ascanWindow[open ? 'show' : 'hide'] === 'function') return owner.ascanWindow[open ? 'show' : 'hide']();
        if (typeof owner[verb] === 'function') return owner[verb]();
        if (owner.panel && typeof owner.panel[verb] === 'function') return owner.panel[verb]();
        if (owner.window && typeof owner.window[open ? 'show' : 'hide'] === 'function') return owner.window[open ? 'show' : 'hide']();
      }
      const w = UT.dom && UT.dom.wins && UT.dom.wins[name];
      if (w) return open ? w.show() : w.hide();
    } catch (e) { console.error('[UT.modes] window ' + name, e); }
    return null;
  }

  // ------------------------------------------------------------------ specimen per mode
  function weldSpecimen(extra) {
    const o = Object.assign({}, st().weldOpts, extra || {});
    if (o.pipe) return S.pipeWeld(Object.assign({}, o, { wt: o.wt === undefined ? o.T : o.wt }));
    return S.plateWeld(o);
  }
  function buildSpecimen(mode, opts, probe) {
    const cur = st().specimen;
    const so = opts && opts.specimenOpts;
    switch (mode) {
      case 'weld': return weldSpecimen(so);
      case 'tofd': case 'aut': case 'trade':
        return (cur && cur.kind === 'weld' && !so) ? cur : weldSpecimen(so);
      case 'v1': return S.v1(Object.assign({ face: probe.angle === 0 ? 'narrow' : 'wide' }, so || {}));
      case 'v2': return S.v2(Object.assign({ face: probe.angle === 0 ? 'narrow' : 'wide' }, so || {}));
      case 'step': return S.stepWedge(so);
      case 'iow': return S.iow(so);
      case 'dac': return S.dacBlock(Object.assign({ T: st().weldOpts.T || 20 }, so || {}));
      case 'tky': {
        Object.assign(tkyOpts, so || {});
        return S.tky({ braceAngle: tkyOpts.braceAngle, braceT: tkyOpts.braceT, chordT: tkyOpts.chordT, braceOffset: tkyOpts.braceOffset });
      }
      case 'lamination': return S.laminationPlate(so);
      default: throw new Error('Unknown mode: ' + mode);
    }
  }
  function clampProbe(p, spec) {
    const ss = spec.scanSurface || spec.extents;
    const q = Object.assign({}, p);
    if (q.surface !== 'brace' || !spec.tky) { q.x = M.clamp(q.x, ss.xMin, ss.xMax); }
    q.z = spec.pipe ? ((q.z % spec.L) + spec.L) % spec.L : M.clamp(q.z, 0, spec.L);
    return q;
  }
  function laminationDefects(spec) {
    return [
      S.makeDefect({ n: 1, type: 'lamination', label: 'Lamination 1', pts: [{ x: 15, y: 10 }, { x: 40, y: 10 }], height: 0.5, zFrom: 40, zTo: 90 }),
      S.makeDefect({ n: 2, type: 'lamination', label: 'Lamination 2', pts: [{ x: -60, y: 18 }, { x: -30, y: 18 }], height: 0.5, zFrom: 150, zTo: 200 }),
    ].map(function (d) { d.zFrom = M.clamp(d.zFrom, 0, spec.L); d.zTo = M.clamp(d.zTo, 0, spec.L); return d; });
  }

  // ------------------------------------------------------------------ enter / exit
  function closeModeWindows(mode) {
    if (mode === 'iow') extWin('plotter', false);
    if (mode === 'dac' && dacWin) dacWin.hide();
    if (mode === 'tky' && tkyWin) tkyWin.hide();
    if (mode === 'tofd') { extWin('tofd', false); extWin('tofd-ascan', false); }
    if (mode === 'aut') extWin('aut', false);
    if (mode === 'trade' && tradeWin) tradeWin.hide();
    if (mode === 'step' && autoCalWin) { autoCalWin.hide(); autoCalState = null; }
  }
  function openModeWindows(mode) {
    if (mode === 'iow') extWin('plotter', true);
    if (mode === 'dac') modes.dacPanel.open();
    if (mode === 'tky') modes.tkyPanel.open();
    if (mode === 'tofd') { extWin('tofd', true); extWin('tofd-ascan', true); }
    if (mode === 'aut') extWin('aut', true);
    if (mode === 'trade') modes.tradeTest.open();
  }

  /**
   * Enter a mode: swaps the specimen, resets the probe, opens the mode's windows, sets the hint.
   * @param {string} name  'weld'|'v1'|'v2'|'step'|'iow'|'dac'|'tky'|'tofd'|'aut'|'trade'|'lamination'
   * @param {{specimenOpts?:object, keepProbe?:boolean, silentUI?:boolean}} [opts]
   */
  function enter(name, opts) {
    const o = opts || {};
    if (MODES.indexOf(name) < 0) throw new Error('Unknown mode: ' + name);
    const s = st();
    const prev = s.mode;
    const patch = {};
    const instr = {};
    let probe = Object.assign({}, s.probe);
    if (prev !== name) {
      closeModeWindows(prev);
      if (prev === 'step') instr.cal = { vel: null, zero: 0 };
      if (prev === 'tofd') instr.rectify = 'full';
      if (prev === 'trade') { stopTradeTimer(); patch.trade = Object.assign({}, s.trade, { active: false }); patch.display = Object.assign({}, s.display, { hide: false }); }
    }
    // probe adjustments per mode
    const forcesZero = name === 'step' || name === 'lamination';
    if (forcesZero) {
      if (probe.angle !== 0 && savedAngle === null) savedAngle = probe.angle;
      probe.angle = 0; probe.mode = 'comp';
    } else if (savedAngle !== null) {
      probe.angle = savedAngle; probe.mode = presetMode(savedAngle); savedAngle = null;
    }
    if (name !== 'tky') probe.surface = 'chord';
    if (name === 'tofd') {
      probe.method = probe.method === 'pa' ? 'pe' : probe.method;
      if (probe.angle === 0) { probe.angle = s.tofd.txAngle || 60; probe.mode = presetMode(probe.angle); }
    }
    const spec = buildSpecimen(name, o, probe);
    if (o.keepProbe) probe = clampProbe(probe, spec);
    else probe = clampProbe(Object.assign(probe, spec.defaultProbe), spec);
    if (name === 'tofd') probe.x = 0;
    // defects policy
    let defects = s.defects;
    if (BLOCK_KIND[name] || name === 'lamination' || name === 'trade') {
      if (WELD_KIND[prev] && !(prev === 'trade')) stash = s.defects;
      defects = name === 'lamination' ? laminationDefects(spec) : (name === 'trade' ? (s.trade.active && prev === 'trade' ? s.defects : []) : []);
    } else if (WELD_KIND[name] && !WELD_KIND[prev]) {
      if (stash) { defects = stash; stash = null; }
    }
    // mode specific instrument / state patches
    if (name === 'step') instr.cal = { vel: 5.60, zero: 0.4 };
    if (name === 'tofd') instr.rectify = 'rf';
    if (name === 'iow') patch.plot = Object.assign({}, s.plot, { cardStyle: 'iow' });
    if (name === 'trade') {
      patch.trade = Object.assign({}, s.trade, { active: true });
      patch.display = Object.assign({}, patch.display || s.display, { hide: true });
    }
    if (Object.keys(instr).length) patch.instrument = Object.assign({}, s.instrument, instr);
    patch.mode = name;
    patch.specimen = spec;
    patch.probe = probe;
    patch.defects = defects;
    if (name !== 'trade' && !WELD_KIND[name]) patch.selectedDefect = 0;
    lastAngle = probe.angle;
    UT.set(patch);
    if (!o.silentUI) openModeWindows(name);
    UT.status({ right: UT.i18n.t(HINTS[name] || '') });
    UT.bus.emit('mode', { mode: name, prev });
    return spec;
  }
  /** Return to the default weld mode. */
  function exit() { return enter('weld', { keepProbe: false }); }
  /** Toggle a modal mode: enter it, or exit to weld when already active. 'plot' is an alias of 'iow'. */
  function toggle(name) {
    const n = name === 'plot' ? 'iow' : name;
    if (st().mode === n) return exit();
    return enter(n);
  }
  function current() { return st().mode; }

  /** Rebuild the specimen of the current mode with new options, keeping the probe (used by panels). */
  function rebuild(specimenOpts) {
    const s = st();
    const spec = buildSpecimen(s.mode, { specimenOpts }, s.probe);
    UT.set({ specimen: spec, probe: clampProbe(s.probe, spec) });
    return spec;
  }

  /**
   * V1/V2 face switch: 'wide' (radius side view) or 'narrow' (thickness face). Keeps the probe (clamped).
   * @param {'wide'|'narrow'} face
   */
  function setFace(face) {
    const s = st();
    if (s.mode !== 'v1' && s.mode !== 'v2') return null;
    const spec = s.mode === 'v1' ? S.v1({ face }) : S.v2({ face });
    const probe = clampProbe(s.probe, spec);
    if (!s.specimen || s.specimen.face !== face) Object.assign(probe, { x: spec.defaultProbe.x, z: spec.defaultProbe.z });
    UT.set({ specimen: spec, probe });
    UT.status({ right: HINTS[s.mode] });
    return spec;
  }

  /** Extra middle status text for the current mode (90-app appends it after Pos/Range/AMP). */
  function statusMid() {
    const s = st(), spec = s.specimen, p = s.probe;
    if (!spec) return '';
    const parts = [];
    if (s.mode === 'v1') parts.push(spec.face === 'narrow' ? '25mm thickness. Echoes 25, 50, 75, 100 etc' : '100mm Radius. Echoes 100, 200, 300, 400 etc');
    else if (s.mode === 'v2') parts.push(spec.face === 'narrow' ? '12.5mm thickness. Echoes 12.5, 25, 37.5, 50 etc' : (p.side >= 0 ? '25mm Radius. Echoes 25, 100, 175 etc' : '50mm Radius. Echoes 50, 125, 200 etc'));
    else if (s.mode === 'step' && spec.thicknessAt) parts.push('Step ' + spec.thicknessAt(p.x) + 'mm');
    else if (s.mode === 'tofd') {
      const f = UT.frame && UT.frame.tofd, d = UT.frame && UT.frame.derived;
      if (f && d && f.lateralUs !== undefined) {
        const wd = d.wedgeDelayUs || 0;
        parts.push('Lateral Wave: ' + (f.lateralUs - wd).toFixed(2) + ' micro sec + delay');
        parts.push('BackWall: ' + (f.backwallUs - wd).toFixed(2) + ' micro sec + delay');
      }
    } else if (s.mode === 'aut') {

  // ------------------------------------------------------------------ state listener
  UT.bus.on('state', function (ev) {

  // ------------------------------------------------------------------ auto-cal wizard (§8.2 / §15.5)
  function trueTimeOfGatedPeak() {
    const f = UT.frame;
    const d = (f && f.derived) || (UT.probe && UT.probe.derive(st().probe, st().specimen));
    const r = f && f.readouts && f.readouts.primary;
    if (!d) return null;
    if (r && r.path > 0) return { t: 2 * r.path / d.vel + d.wedgeDelayUs, d };
    // fallback: the backwall under the probe (no gated echo yet)
    const spec = st().specimen;
    const T = spec && spec.thicknessAt ? spec.thicknessAt(st().probe.x) : (spec ? spec.T : 25);
    return { t: 2 * T / d.vel + d.wedgeDelayUs, d, fallback: true };
  }
  function autoCalWindow() {

      name: 'autocal', title: 'Auto Cal', x: 470, y: 150, w: 330,
      content: UT.dom.h('div', { class: 'ac-body' }, [
        ui.acMsg,
        UT.dom.h('div', { class: 'btn-row' }, [
          UT.dom.button('✓', function () { modes.autoCal.step(); }, { class: 'btn primary', title: 'Capture' }),
          UT.dom.button('Cancel', function () { modes.autoCal.cancel(); }),
        ]),
      ]),
      onClose: function () { autoCalState = null; },
    });
    return autoCalWin;
  }
  function acShow(msg) {
    if (typeof document === 'undefined') return;

    w.show();
    UT.status({ right: msg });
  }
  const autoCal = {
    /** Start the two-point wizard (10 mm then 25 mm step). Enters step mode when not already there. */
    start() {
      if (st().mode !== 'step' && !(st().mode === 'v1' && st().specimen && st().specimen.face === 'narrow')) enter('step');
      autoCalState = { step: 1, d1: 10, d2: 25, t1: null };
      acShow('Auto Cal 1/2: Place the probe on the 10 mm step (gate on the backwall), then press ✓');
      return autoCalState;
    },
    /** Capture the current gated peak time for the current wizard step. Returns the new cal when finished. */
    step() {
      if (!autoCalState) return autoCal.start();
      const cap = trueTimeOfGatedPeak();
      if (!cap) return null;
      if (autoCalState.step === 1) {
        autoCalState.t1 = cap.t;
        autoCalState.step = 2;
        acShow('Auto Cal 2/2: Place the probe on the 25 mm step, then press ✓');
        return autoCalState;
      }
      const t1 = autoCalState.t1, t2 = cap.t, d1 = autoCalState.d1, d2 = autoCalState.d2;
      if (!(t2 > t1 + 1e-6)) { acShow('Auto Cal: the second echo must be later than the first — move to the 25 mm step and press ✓'); return null; }
      const vel = 2 * (d2 - d1) / (t2 - t1);
      const zero = t1 - cap.d.wedgeDelayUs - 2 * d1 / vel;
      const cal = { vel: +vel.toFixed(4), zero: +zero.toFixed(4) };
      UT.setIn('instrument', { cal });
      autoCalState = null;
      if (autoCalWin) autoCalWin.hide();
      UT.status({ right: 'Auto Cal done: Velocity ' + Math.round(vel * 1000) + ' m/s, Zero ' + zero.toFixed(2) + ' µs' });
      return cal;
    },
    cancel() { autoCalState = null; if (autoCalWin) autoCalWin.hide(); UT.status({ right: HINTS[st().mode] || '' }); },
    state() { return autoCalState; },
  };

  // ------------------------------------------------------------------ DAC (§8.3)
  const dac = {
    /** Record the gated peak as a DAC point normalised to the reference gain. Returns the point or null. */
    record() {
      const s = st();
      const r = UT.frame && UT.frame.readouts && UT.frame.readouts.primary;
      if (!r || !(r.path > 0)) { UT.status({ right: 'DAC: no echo above the gate level — maximise the echo first' }); return null; }
      const cur = s.instrument.dac;
      const refDb = cur.refDb === null || cur.refDb === undefined ? s.instrument.gain : cur.refDb;
      const ampPct = r.peakPct * Math.pow(10, (refDb - s.instrument.gain) / 20);
      if (ampPct > 120) { UT.status({ right: 'DAC: point refused (' + Math.round(ampPct) + '% at ref gain) — reduce the amplitude' }); return null; }
      const pt = { path: +r.path.toFixed(2), ampPct: +ampPct.toFixed(1), gainAtRecord: s.instrument.gain };
      const points = cur.points.filter(function (p) { return Math.abs(p.path - pt.path) > 1; }).concat([pt]).sort(function (a, b) { return a.path - b.path; });
      UT.setIn('instrument', { dac: Object.assign({}, cur, { points, refDb, on: points.length >= 2 }) });
      UT.status({ right: 'DAC point ' + points.length + ' recorded at ' + pt.path + ' mm, ' + pt.ampPct + '%' + (points.length < 2 ? ' — record another point' : '') });
      return pt;
    },
    /** Erase all DAC points. */
    erase() {
      const cur = st().instrument.dac;
      UT.setIn('instrument', { dac: Object.assign({}, cur, { points: [], on: false, refDb: null }) });
      UT.status({ right: HINTS[st().mode] || '' });
    },
    /** Toggle the −6 / −14 dB companion curves (or set explicitly). */
    curves(on) {
      const cur = st().instrument.dac;
      const v = on === undefined ? !cur.curves : !!on;
      UT.setIn('instrument', { dac: Object.assign({}, cur, { curves: v, on: cur.points.length >= 2 }) });
      return v;
    },
  };

  // ------------------------------------------------------------------ PLOT (§8.4) and SIZE (§8.5)
  const plot = {

    markEdge() {

    },
    /** Erase all plotted points and edge marks. */

  };
  function sizingResult(marks) {

    if (!L || !R) return null;
    let len = Math.abs(R.z - L.z);

    const r = UT.frame && UT.frame.readouts && UT.frame.readouts.primary;
    return { length: +len.toFixed(1), zFrom: Math.min(L.z, R.z), zTo: Math.max(L.z, R.z), depth: r ? +r.dp.toFixed(1) : (L.depth === undefined ? null : L.depth), method: s.sizing.method };
  }
  function sizingMark(side) {

    const marks = s.sizing.marks.filter(function (m) { return m.side !== side; }).concat([mark]);
    const result = sizingResult(marks);
    UT.setIn('sizing', { marks, result });
    UT.status({ right: result ? 'Sizing (' + result.method + ' drop): length ' + result.length + ' mm' : 'Mark ' + side + ' at z = ' + mark.z + ' mm — now mark the other end' });

  }
  const sizing = {
    /** Mark the left (low-z) drop point at the current probe z. */

  };

  // ------------------------------------------------------------------ defect helpers
  function slotDefect(defects, n) { return defects.find(function (d) { return d.n === n; }) || null; }
  function freeSlot(defects) { for (let n = 1; n <= 8; n++) if (!slotDefect(defects, n)) return n; return null; }
  function sortByN(defects) { return defects.slice().sort(function (a, b) { return a.n - b.n; }); }
  function setDefects(arr) { UT.set({ defects: S.normaliseDefects(arr) }); return st().defects; }
  function scaleHeight(d, height) {
    const b = S.bbox(d.pts);
    const h = Math.max(1e-6, b.h);
    const k = height / h;
    const pts = b.h < 1e-6 ? d.pts.map(function (p, i) { return { x: p.x, y: +(b.yMin + (i === d.pts.length - 1 ? height : 0)).toFixed(2) }; })
      : d.pts.map(function (p) { return { x: p.x, y: +(b.yMin + (p.y - b.yMin) * k).toFixed(2) }; });
    return S.makeDefect(Object.assign({}, d, { pts, height }));
  }
  function addPreset(name, opts) {
    const s = st();
    const fn = S.defectPresets[name];
    if (!fn) throw new Error('Unknown preset: ' + name);
    const spec = s.specimen || S.plateWeld(s.weldOpts);
    const n = freeSlot(s.defects) || (s.defects.length + 1);
    const d = fn(spec, Object.assign({ n }, opts || {}));
    d.n = n;
    UT.set({ defects: s.defects.concat([d]) });
    return d;
  }

  // ------------------------------------------------------------------ defect editor window (§14.3)
  const ed = { separation: 20, length: 30, height: 3, applyAll: false, drag: null };
  function selectedN() { return (st().selectedDefect || 0) + 1; }
  function selectedDefect() { return slotDefect(st().defects, selectedN()); }

  function editorStatusLine() {
    const d = selectedDefect();

    const spec = st().specimen;

    return (S.isPlanar(d.type) ? 'PLANAR' : 'VOL') + ' Defect ' + d.n + '  Height=' + M.fmt(d.height, 1) + 'mm Length=' + M.fmt(len, 0) + 'mm. From ' + Math.round(d.zFrom) + 'mm  To ' + Math.round(d.zTo) + 'mm';
  }

  /** z (mm) on the circle view from a canvas point; null when off the ring. */
  function circleZFromPoint(px, py, geo) {
    const dx = px - geo.cx, dy = py - geo.cy;
    const r = Math.hypot(dx, dy);
    if (r < geo.r - 25 || r > geo.R + 25) return null;
    const u = Math.atan2(-dx, -dy);                        // anticlockwise from 12 o'clock
    const z = ((u / (2 * Math.PI)) % 1 + 1) % 1 * geo.C;
    return z;
  }
  function circleGeometry(spec, w, h) {
    const R = Math.min(w, h) / 2 - 15;
    return { cx: w / 2, cy: h / 2, R, r: R * 0.8, C: spec.L };
  }
  function circlePt(geo, z, rad) {
    const u = 2 * Math.PI * z / geo.C;
    return { x: geo.cx - rad * Math.sin(u), y: geo.cy - rad * Math.cos(u) };
  }
  /** Fallback circle view (used when UT.views.plan.drawCircleView is unavailable). */
  function drawCircleFallback(ctx, o) {
    const geo = circleGeometry(o.spec, o.w, o.h);
    const C = geo.C;
    ctx.save();
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, o.w, o.h);
    ctx.beginPath(); ctx.arc(geo.cx, geo.cy, geo.R, 0, 2 * Math.PI); ctx.arc(geo.cx, geo.cy, geo.r, 0, 2 * Math.PI, true);
    ctx.fillStyle = '#8c8c8c'; ctx.fill('evenodd');
    ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(geo.cx, geo.cy, geo.R, 0, 2 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(geo.cx, geo.cy, geo.r, 0, 2 * Math.PI); ctx.stroke();
    const stepMm = Math.round(C / 12);
    ctx.font = '11px Segoe UI, Arial, sans-serif'; ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let k = 0; k < 12; k++) {
      const z = k * stepMm;
      const a = circlePt(geo, z, geo.r), b = circlePt(geo, z, geo.R);
      if (k > 0) { ctx.setLineDash([3, 3]); ctx.strokeStyle = '#000'; ctx.beginPath(); ctx.moveTo(geo.cx, geo.cy); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.setLineDash([]); }
      const l = circlePt(geo, z, geo.r - 22);
      ctx.fillText(z + ' mm', l.x, l.y);
      void a;
    }
    // 0 mm line + arrow (pointing left) at the top
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(geo.cx, geo.cy); ctx.lineTo(geo.cx, geo.cy - geo.R - 8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(geo.cx, geo.cy - geo.R - 8); ctx.lineTo(geo.cx - 60, geo.cy - geo.R - 8); ctx.stroke();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.moveTo(geo.cx - 70, geo.cy - geo.R - 8); ctx.lineTo(geo.cx - 58, geo.cy - geo.R - 13); ctx.lineTo(geo.cx - 58, geo.cy - geo.R - 3); ctx.closePath(); ctx.fill();
    // defects
    const drawArc = function (z0, z1, colour) {
      let len = z1 - z0; if (len < 0) len += C;
      const n = Math.max(2, Math.ceil(len / C * 180));
      ctx.beginPath();
      for (let i = 0; i <= n; i++) { const p = circlePt(geo, z0 + len * i / n, geo.R - 1); if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); }
      for (let i = n; i >= 0; i--) { const p = circlePt(geo, z0 + len * i / n, geo.r + 1); ctx.lineTo(p.x, p.y); }
      ctx.closePath(); ctx.fillStyle = colour; ctx.fill();
    };
    for (const d of o.defects) if (d.n !== o.selectedN) drawArc(d.zFrom, d.zTo, '#e00000');
    const sel = o.defects.find(function (d) { return d.n === o.selectedN; });
    if (sel) {
      drawArc(sel.zFrom, sel.zTo, '#8b0000');
      ctx.strokeStyle = '#e00000'; ctx.lineWidth = 1.5;
      [sel.zFrom, sel.zTo].forEach(function (z) { const p = circlePt(geo, z, geo.R); ctx.beginPath(); ctx.moveTo(geo.cx, geo.cy); ctx.lineTo(p.x, p.y); ctx.stroke(); });
    }
    ctx.restore();
  }
  function barGeometry(spec, w, h) { return { x0: 30, x1: w - 30, y: h / 2, L: spec.L }; }
  /** Fallback linear bar for plates. */
  function drawBarFallback(ctx, o) {
    const g = barGeometry(o.spec, o.w, o.h);
    ctx.save();
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, o.w, o.h);
    ctx.fillStyle = '#8c8c8c'; ctx.fillRect(g.x0, g.y - 18, g.x1 - g.x0, 36);
    ctx.strokeStyle = '#333'; ctx.strokeRect(g.x0, g.y - 18, g.x1 - g.x0, 36);
    const zx = function (z) { return g.x0 + (g.x1 - g.x0) * z / g.L; };
    ctx.font = '11px Segoe UI, Arial, sans-serif'; ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (let z = 0; z <= g.L + 1e-6; z += 10) {

    }
    ctx.restore();
  }
  /** Apply a z span (from a ring/bar drag) to the selected slot, creating a default defect when empty. */
  function editorDragSpan(zFrom, zTo) {

  // ------------------------------------------------------------------ trade test (§8.12, §15.8)
  const TRADE_PRESETS = ['rootCrack', 'lof', 'porosity', 'slag', 'toeCrack', 'centrelineCrack', 'incompletePenetration'];
  function generateTruth(seed, spec) {
    const r = M.rng(seed);
    const count = 3 + Math.floor(r() * 4);          // 3..6
    const L = spec.L;
    const slotLen = L / count;
    const defects = [];
    for (let i = 0; i < count; i++) {
      const key = TRADE_PRESETS[Math.floor(r() * TRADE_PRESETS.length)];
      const length = Math.round(15 + r() * 30);
      const zFrom = Math.round(M.clamp(i * slotLen + 5 + r() * Math.max(1, slotLen - length - 10), 0, Math.max(0, L - length)));
      const opts = { n: i + 1, zFrom, length, label: 'Defect ' + (i + 1) };
      if (key === 'lof' || key === 'toeCrack') opts.side = r() < 0.5 ? -1 : 1;
      if (key === 'rootCrack' || key === 'centrelineCrack') opts.height = Math.round(2 + r() * 4);
      if (key === 'porosity') { opts.dia = +(2 + r() * 3).toFixed(1); opts.x = Math.round((r() - 0.5) * 6); opts.y = +(spec.T * (0.3 + r() * 0.4)).toFixed(1); }
      if (key === 'slag') { opts.x = Math.round((r() - 0.5) * 6); opts.y = +(spec.T * (0.3 + r() * 0.4)).toFixed(1); }
      const d = S.defectPresets[key](spec, opts);
      d.n = i + 1; d.label = 'Defect ' + (i + 1); d.id = 1000 + i;
      defects.push(d);
    }
    const truth = defects.map(function (d) {
      const b = S.bbox(d.pts);
      return { n: d.n, zFrom: +d.zFrom.toFixed(1), zTo: +d.zTo.toFixed(1), depth: +b.yMin.toFixed(1), height: +d.height.toFixed(1), type: d.type };
    });
    return { defects, truth };
  }
  function tradeClock() {
    const t = st().trade;
    if (!t.active || !t.startedAt) return '';
    const el = Math.max(0, Math.floor((Date.now() - t.startedAt) / 1000));
    const rem = Math.max(0, 60 * 60 - el);
    const mm = Math.floor(rem / 60), ss = rem % 60;
    return (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
  }
  function stopTradeTimer() { if (tradeTimer && typeof clearInterval === 'function') clearInterval(tradeTimer); tradeTimer = null; }
  function startTradeTimer() {
    stopTradeTimer();

    tradeTimer = setInterval(function () { if (ui.tClock) ui.tClock.textContent = 'Time left ' + tradeClock(); }, 1000);
  }
  const trade = {
    /**
     * Start a trade test with hidden seeded defects.
     * @param {number} [seed]

    start(seed) {

      if (st().mode !== 'trade') enter('trade', { keepProbe: true, silentUI: typeof document === 'undefined' });
      const s = st();
      const g = generateTruth(sd, s.specimen);
      UT.set({
        defects: g.defects,
        trade: Object.assign({}, s.trade, { active: true, revealed: false, report: [], score: null, seed: sd, startedAt: Date.now(), truth: g.truth, result: null }),
        display: Object.assign({}, s.display, { hide: true }),
        selectedDefect: 0,
      });
      startTradeTimer();
      tradeRefresh();
      UT.status({ right: 'Trade Test started (' + g.truth.length + ' hidden defects). Fill in the report, then Submit' });
      return g.truth.map(function (t) { return Object.assign({}, t); });
    },
    /** Hidden truth rows [{n, zFrom, zTo, depth, height, type}]. */
    truth() { return (st().trade.truth || []).map(function (t) { return Object.assign({}, t); }); },
    /**
     * Score a report: rows [{n, z, length, depth, type}] → 0..100. Reveals the defects.
     */
    submit(rows) {
      const s = st();
      const truth = s.trade.truth || [];
      const report = (rows || []).map(function (r, i) {
        return { n: r.n === undefined ? i + 1 : +r.n, z: +r.z, length: +r.length, depth: +r.depth, type: r.type ? String(r.type) : '' };
      }).filter(function (r) { return Number.isFinite(r.z); });

      const detail = [];
      for (const r of report) {

      UT.set({
        trade: Object.assign({}, s.trade, { report, score, revealed: true, result: { matched, typeMatches, falseCalls, misses, detail } }),
        display: Object.assign({}, s.display, { hide: false }),
      });
      stopTradeTimer();
      tradeRefresh();
      UT.status({ right: 'Trade Test score ' + score + '% — ' + matched + '/' + truth.length + ' found, ' + falseCalls + ' false call' + (falseCalls === 1 ? '' : 's') });
      return score;
    },

  function loadLesson(i) {
    const l = lessons[i];
    if (!l) return null;
    try { l.setup(); } catch (e) { console.error('[UT.modes] lesson ' + l.n, e); }
    UT.set({ lesson: i });
    lessonsRefresh();
    return l;
  }
  function lessonsRefresh() {
    if (!lessonsWin || !ui.lSteps) return;
    const i = st().lesson;
    ui.lSteps.textContent = '';
    if (i === null || i === undefined || !lessons[i]) { ui.lSteps.appendChild(UT.dom.h('div', { class: 'ls-dim' }, 'Select a lesson and press Load')); return; }
    const l = lessons[i];
    ui.lSteps.appendChild(UT.dom.h('div', { class: 'ls-title' }, l.n + '. ' + l.title));
    ui.lSteps.appendChild(UT.dom.h('div', { class: 'ls-ko' }, l.ko));
    ui.lSteps.appendChild(UT.dom.h('ol', {}, l.steps.map(function (s) { return UT.dom.h('li', {}, s); })));
    Array.from(ui.lList.children).forEach(function (row, k) { row.classList.toggle('active', k === i); });
  }

  function loadSpecimen(id, opts) {
    const mode = MODE_OF[id];
    if (!mode) throw new Error('Unknown specimen id: ' + id);
    if (id === 'plate-weld' || id === 'pipe-weld') {
      UT.setIn('weldOpts', Object.assign({ pipe: id === 'pipe-weld' }, opts || {}), { silent: true, noRender: true });
      enter('weld', { silentUI: true });
    } else enter(mode, { specimenOpts: opts, silentUI: true });
    return st().specimen;
  }

    if (row && Array.isArray(row.disabledMenus)) return row.disabledMenus.indexOf(id) < 0;

  function zeroProbe(crystal) {

  function stepIs(steps) {

  /** Parse a comma/space separated list of step thicknesses ("5,10,15") → sorted positive numbers. */
  function parseSteps(text) {
    const out = String(text || '').split(/[\s,;]+/).map(parseFloat).filter(function (v) { return Number.isFinite(v) && v > 0; });
    out.sort(function (a, b) { return a - b; });

  // ------------------------------------------------------------------ menu DOM
  function buildMenuBar() {
    const bar = h('div', { id: 'menubar' });
    mem.els.menus = {};
    for (const top of menuModel()) {
      const item = h('div', { id: top.id, class: 'menu-item', dataset: { key: top.key } }, [h('span', { class: 'menu-label', dataset: { key: top.key } }, t(top.key))]);
      item.addEventListener('mousedown', function (e) {
        e.preventDefault(); e.stopPropagation();
        if (item.classList.contains('open')) closeMenus(); else openMenu(item, top.id);
      });
      item.addEventListener('mouseenter', function () { if (mem.openMenu && mem.openMenu !== item) openMenu(item, top.id); });
      bar.appendChild(item);
      mem.els.menus[top.id] = item;
    }
    return bar;
  }
  function openMenu(item, id) {
    closeMenus();
    if (!menuEnabled(id)) return;
    const top = menuModel().find(function (m) { return m.id === id; });
    if (!top) return;
    const drop = h('div', { class: 'menu-drop', dataset: { menu: top.key } }, top.items.map(renderEntry));
    item.appendChild(drop);
    item.classList.add('open');
    mem.openMenu = item;
  }
  function renderEntry(it) {
    if (it.sep) return h('div', { class: 'menu-sep' });
    const enabled = it.enabled ? !!it.enabled() : true;
    let checked = false;
    try { checked = it.check ? !!it.check() : false; } catch (e) { checked = false; }
    const el = h('div', { class: 'menu-entry' + (it.sub ? ' has-sub' : '') + (enabled ? '' : ' disabled'), dataset: { key: it.key } }, [
      h('span', { class: 'm-check' }, checked ? '✓' : ''),
      h('span', { class: 'm-label', dataset: { key: it.key } }, t(it.key)),
      it.sub ? h('span', { class: 'm-arrow' }, '▶') : null,
      it.sub ? h('div', { class: 'menu-sub', dataset: { menu: it.key } }, it.sub.map(renderEntry)) : null,
    ]);
    if (!it.sub) {
      el.addEventListener('mousedown', function (e) { e.stopPropagation(); e.preventDefault(); });
      el.addEventListener('mouseup', function (e) {
        e.stopPropagation();
        if (!enabled) return;
        closeMenus();
        try { it.action && it.action(); } catch (err) { console.error('[UT.app] menu ' + it.key, err); }
        refreshToolbar();
      });
    } else {
      el.addEventListener('mousedown', function (e) { e.stopPropagation(); e.preventDefault(); el.classList.add('hover'); });
    }
    return el;
  }
  function closeMenus() {
    if (!mem.openMenu) return;
    mem.openMenu.classList.remove('open');
    const drop = mem.openMenu.querySelector('.menu-drop');
    if (drop) mem.openMenu.removeChild(drop);
    mem.openMenu = null;
  }
  /**
   * Resolve a label path ('Probes/Number of Skips/2') in the menu model and run its action synchronously.
   * @param {string} path exact English labels (data-key), '/'-separated
   * @returns {boolean} false when missing or disabled
   */
  function menuByPath(path) {
    const parts = String(path || '').split('/').map(function (s) { return s.trim(); }).filter(Boolean);
    if (!parts.length) return false;
    const top = menuModel().find(function (m) { return m.key === parts[0]; });
    if (!top || !menuEnabled(top.id)) return false;
    let items = top.items, it = null;
    for (let i = 1; i < parts.length; i++) {
      it = (items || []).find(function (x) { return !x.sep && x.key === parts[i]; });
      if (!it) return false;
      if (it.enabled && !it.enabled()) return false;
      items = it.sub;
    }
    if (!it || typeof it.action !== 'function') return false;
    closeMenus();
    try { it.action(); } catch (e) { console.error('[UT.app] menu ' + path, e); return false; }
    refreshToolbar();
    return true;
  }

  // ------------------------------------------------------------------ layout
  /**
   * Build the whole page into #app (title bar, menu bar, toolbar, main grid, status bar). Idempotent.
   * @returns {HTMLElement} the #app element
   */
  function buildLayout() {
    const d = doc();
    if (!d) return null;
    let root = d.getElementById('app');
    if (!root) { root = h('div', { id: 'app' }); d.body.appendChild(root); }
    if (mem.built) return root;
    root.textContent = '';
    mem.els.app = root;
    root.appendChild(h('div', { id: 'titlebar' }, [
      h('span', { class: 'tb-icon' }),
      h('span', { class: 'tb-name' }, 'UTsim — UTman-style Ultrasonic Simulator'),
      h('span', { class: 'tb-sub' }, '|  NDT Verification and Coaching'),
      h('span', { class: 'tb-ver' }, 'v' + UT.VERSION + '  ·  inspired by UTman / utsim.co.uk'),
    ]));
    root.appendChild(buildMenuBar());
    // toolbar
    const tb = h('div', { id: 'toolbar' });
    for (const def of TOOLBAR) {
      if (def.gap) { tb.appendChild(h('span', { class: 'tb-gap' })); continue; }
      const id = 'tb-' + def.id;
      const btn = h('button', { id, class: 'tb-btn', type: 'button', title: def.label, dataset: { key: def.label } }, [
        h('span', { class: 'tb-ico', html: ICONS[def.id] || '' }),
        h('span', { class: 'tb-lbl' }, def.label),
      ]);
      btn.addEventListener('click', function (e) { e.preventDefault(); closeMenus(); activateToolbar(id); });
      tb.appendChild(btn);
      mem.tb[id] = btn;
    }
    root.appendChild(tb);
    // main grid
    const cvPlan = h('canvas', { id: 'cv-plan' });
    const cvPlotter = h('canvas', { id: 'cv-plotter' });
    const cvRuler = h('canvas', { id: 'cv-ruler' });
    const cvCross = h('canvas', { id: 'cv-cross' });
    const instrument = h('div', { id: 'instrument', tabindex: '0' });
    const main = h('div', { id: 'main' }, [
      instrument,
      h('div', { id: 'plan-area' }, [cvPlan, cvPlotter]),
      h('div', { id: 'ruler-area' }, [cvRuler]),
      h('div', { id: 'cross-area' }, [cvCross]),
    ]);
    root.appendChild(main);
    Object.assign(mem.els, { main, instrument, cvPlan, cvPlotter, cvRuler, cvCross });
    // status bar
    const sb = h('div', { id: 'statusbar' }, [
      h('span', { class: 'sb-panel sb-left' }, ''),
      h('span', { class: 'sb-mid' }),
      h('span', { class: 'sb-panel sb-right' }, ''),
    ]);
    sb.querySelector('.sb-mid').style.display = 'contents';
    root.appendChild(sb);
    mem.els.statusbar = sb;
    mem.built = true;
    bindGlobalEvents();
    applyLayout();
    refreshToolbar();
    return root;
  }
  function hiddenViews() {
    let hidden = [];
    if (has('modes.hiddenViews')) { try { hidden = UT.modes.hiddenViews() || []; } catch (e) { hidden = []; } }
    else {
      const en = has('modes.enabled');
      const row = en && en[currentMode()];
      hidden = row && Array.isArray(row.hidden) ? row.hidden.slice() : (HIDDEN_FALLBACK[currentMode()] || []).slice();
    }
    if (st().display.plan === false && hidden.indexOf('plan') < 0) hidden.push('plan');
    return hidden;
  }
  /** Apply mode-dependent layout classes (#main.block/.no-ruler/.plot/.usk7) and request a render. */
  function applyLayout() {
    const main = mem.els.main;
    if (!main) return;
    const mode = currentMode();
    const hidden = hiddenViews();
    const plot = mode === 'iow';
    main.classList.toggle('plot', plot);
    main.classList.toggle('block', !plot && hidden.indexOf('plan') >= 0);
    main.classList.toggle('no-ruler', hidden.indexOf('ruler') >= 0);
    main.classList.toggle('usk7', st().utSet === 'usk7');
    UT.requestRender();
  }
  function bindGlobalEvents() {
    const d = doc();
    d.addEventListener('mousedown', function (e) { if (mem.openMenu && !mem.openMenu.contains(e.target)) closeMenus(); });
    d.addEventListener('keydown', onKey);
    if (typeof ResizeObserver === 'function') {
      mem.resizeObs = new ResizeObserver(function () { UT.requestRender(); UT.bus.emit('resize', { w: mem.els.app.clientWidth, h: mem.els.app.clientHeight }); });
      mem.resizeObs.observe(mem.els.app);
    } else {
      window.addEventListener('resize', function () { UT.requestRender(); UT.bus.emit('resize', { w: mem.els.app.clientWidth, h: mem.els.app.clientHeight }); });
    }
    UT.bus.on('render', onRender);
    UT.bus.on('status', renderStatus);
    UT.bus.on('state', onState);
    UT.bus.on('mode', function () { applyLayout(); refreshToolbar(); });
    UT.bus.on('win:show', function (w) { keepBelowToolbar(w); refreshToolbar(); });
    UT.bus.on('win:hide', refreshToolbar);
    UT.bus.on('win:close', refreshToolbar);
  }
  /** Floating (non-modal) windows never cover the menu bar / toolbar: nudge them below the toolbar. */
  function keepBelowToolbar(w) {
    if (!w || !w.el || !mem.built || w.el.classList.contains('modal')) return;
    const tb = byId('toolbar');
    if (!tb) return;
    const limit = tb.getBoundingClientRect().bottom + 2;
    const r = w.el.getBoundingClientRect();
    if (r.top < limit) w.el.style.top = Math.round(limit) + 'px';
  }
  function onState(ev) {
    const keys = (ev && ev.keys) || [];
    if (keys.indexOf('cursor') >= 0) { updateMid(); }
    if (keys.indexOf('status') >= 0 || (keys.length === 1 && keys[0] === 'cursor')) return;
    if (keys.indexOf('utSet') >= 0) { call('instruments.setSkin', [st().utSet]); applyLayout(); }
    if (keys.indexOf('mode') >= 0 || keys.indexOf('display') >= 0) applyLayout();
    refreshToolbar();
    scheduleSave(keys);
  }

  // ------------------------------------------------------------------ status bar
  function midParts(frame) {
    const s = st(), p = s.probe, ins = s.instrument;
    const inch = s.display.units === 'inch';
    const parts = [];
    parts.push(inch ? 'Pos: ' + (p.x / 25.4).toFixed(2) + ' in' : 'Pos: ' + fmtNum(p.x) + ' mm');
    parts.push(inch ? 'Range ' + (ins.range / 25.4).toFixed(2) + 'in' : 'Range ' + (+ins.range).toFixed(1) + 'mm');
    parts.push('AMP= ' + fmtNum(ins.gain) + 'dB');
    let extra = '';
    if (has('modes.statusMid')) { try { extra = UT.modes.statusMid() || ''; } catch (e) { extra = ''; } }
    else if (s.specimen && s.specimen.pipe) extra = 'WT ' + s.specimen.pipe.wt + 'mm  Dia ' + s.specimen.pipe.odInch + 'inch';
    for (const seg of String(extra).split(/\s{3,}|\s\|\s/)) if (seg.trim()) parts.push(seg.trim());
    const c = s.cursor;
    if (c && typeof c.y === 'number' && !Number.isNaN(c.y)) {
      parts.push(s.mode === 'tofd' ? 'Depth: ' + c.y.toFixed(1) : (inch ? 'Depth = ' + (c.y / 25.4).toFixed(3) + 'in' : 'Depth = ' + c.y.toFixed(1) + 'mm'));
    }
    void frame;
    return parts;
  }
  function leftText(frame) {
    if (frame && frame.derived && frame.derived.statusLine) return frame.derived.statusLine;
    const d = has('probe.derive') ? call('probe.derive', [st().probe, st().specimen]) : null;
    return d && d.statusLine ? d.statusLine : '';
  }
  function updateMid() {
    const mid = midParts(UT.frame).join(' | ');
    if (mid !== mem.lastMid) { mem.lastMid = mid; UT.status({ mid }); }
  }
  function onRender(frame) {
    const left = leftText(frame);
    const mid = midParts(frame).join(' | ');
    if (left !== mem.lastLeft || mid !== mem.lastMid) {
      mem.lastLeft = left; mem.lastMid = mid;
      UT.status({ left, mid });
    } else if (mem.els.statusbar && !mem.els.statusbar.firstChild.textContent) renderStatus(st().status);
  }
  /** Render state.status (left physics line, middle sunken panels, right hint) into #statusbar. */
  function renderStatus(status) {
    const sb = mem.els.statusbar;
    if (!sb) return;
    const s = status || st().status || {};
    const left = sb.querySelector('.sb-left'), mid = sb.querySelector('.sb-mid'), right = sb.querySelector('.sb-right');
    if (left.textContent !== (s.left || '')) left.textContent = s.left || '';
    const segs = Array.isArray(s.segments) && s.segments.length ? s.segments.map(String) : String(s.mid || '').split(' | ').filter(Boolean);
    const key = segs.join('');
    if (mid.dataset.key !== key) {

  // ------------------------------------------------------------------ keyboard
  function onKey(ev) {
    const tag = ev.target && ev.target.tagName ? ev.target.tagName.toLowerCase() : '';
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || (ev.target && ev.target.isContentEditable)) return;
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const key = ev.key;
    if (key === 'Escape') { if (mem.openMenu) { closeMenus(); ev.preventDefault(); return; } if (UT.dom.closeTopWindow()) ev.preventDefault(); return; }
    if (key.indexOf('Arrow') === 0 || key === 'Enter') {
      let used = false;
      try { used = !!(has('instruments.handleKey') && UT.instruments.handleKey(ev)); } catch (e) { used = false; }
      if (used) return;
    }
    const s = st(), p = s.probe;
    const stepX = ev.shiftKey ? 10 : 1;
    switch (key) {
      case 'ArrowLeft': case 'ArrowRight': {
        if (s.editing && s.editing.defect) return;
        const ss = scanRange();
        const x = M.clamp(p.x + (key === 'ArrowLeft' ? -stepX : stepX), ss.xMin, ss.xMax);
        UT.setIn('probe', { x: +x.toFixed(1) });
        break;
      }
      case 'ArrowUp': case 'ArrowDown': {
        const L = (s.specimen && s.specimen.L) || 300;
        let z = p.z + (key === 'ArrowUp' ? -stepX : stepX);
        if (s.specimen && s.specimen.pipe) z = ((z % L) + L) % L; else z = M.clamp(z, 0, L);
        UT.setIn('probe', { z: +z.toFixed(1) });
        break;
      }
      case '+': case '=': UT.setIn('instrument', { gain: M.clamp(s.instrument.gain + (ev.shiftKey ? 6 : 1), 0, 110) }); break;
      case '-': case '_': UT.setIn('instrument', { gain: M.clamp(s.instrument.gain - (ev.shiftKey ? 6 : 1), 0, 110) }); break;
      case 'r': case 'R': cycleRange(); break;
      case 'f': case 'F': UT.setIn('instrument', { freeze: !s.instrument.freeze }); break;
      case 'p': case 'P': UT.setIn('instrument', { peakMem: !s.instrument.peakMem }); break;
      case 'h': case 'H': activateToolbar('tb-hide'); break;
      case 'b': case 'B': activateToolbar('tb-beam'); break;
      case '1': activateToolbar('tb-0'); break;
      case '2': activateToolbar('tb-45'); break;
      case '3': activateToolbar('tb-60'); break;
      case '4': activateToolbar('tb-70'); break;
      default: return;
    }
    ev.preventDefault();
    refreshToolbar();
  }

  /** Snell helper for the wedge dialog: wedge angle → {refracted, mode, beyond}. */
  function wedgeToRefracted(wedgeDeg, vW, mat) {
    const vC = (mat && mat.vComp) || UT.consts.V_COMP_STEEL, vS = (mat && mat.vShear) || UT.consts.V_SHEAR_STEEL;
    const crit = UT.probe.criticalAngles(vW, mat);
    if (wedgeDeg <= 0.001) return { refracted: 0, mode: 'comp', crit, beyond: false };
    if (wedgeDeg < crit.first) { const a = M.snellAngle(wedgeDeg, vW, vC); return { refracted: a === null ? 89.9 : a, mode: 'comp', crit, beyond: false, shearToo: M.snellAngle(wedgeDeg, vW, vS) }; }
    if (wedgeDeg < crit.second) { const a = M.snellAngle(wedgeDeg, vW, vS); return { refracted: a === null ? 89.9 : a, mode: 'shear', crit, beyond: false }; }
    return { refracted: 90, mode: 'shear', crit, beyond: true };
  }
  /** Probe patch for a refracted angle: snaps to the 45/60/70 presets, else a custom angle (0.1° steps). */
  function probePatchFor(refracted, mode) {
    let a = +refracted.toFixed(1);
    for (const p of [45, 60, 70]) if (Math.abs(refracted - p) < 0.05) a = p;
    if (a <= 0.05) return { angle: 0, mode: 'comp' };
    return { angle: a, mode: mode === 'comp' ? 'comp' : 'shear' };
  }
  /** "Adjust Angle in Wedge (Shoe)" dialog: wedge angle ↔ refracted angle with both critical angles. */
  function openWedge() {
    dialog('wedge', 'Adjust Angle in Wedge (Shoe)', 460, function (win) {
      const p = st().probe;
      const mat = st().specimen && st().specimen.material;
      const s = { vW: p.wedgeVel || UT.consts.V_PERSPEX, wedge: 0 };
      const d0 = has('probe.derive') ? UT.probe.derive(p, st().specimen) : null;
      s.wedge = d0 ? +d0.wedgeAngle.toFixed(1) : 0;
      const readout = h('div', { class: 'wedge-readout' }, '');
      const scale = h('div', { class: 'wedge-scale' });
      const slider = UT.dom.field('Angle in wedge (shoe)', { type: 'range', value: s.wedge, min: 0, max: 80, step: 0.1, event: 'input', onchange: function (v) { s.wedge = parseFloat(v); fromWedge(true); } });
      const refIn = UT.dom.field('Refracted angle in steel', { type: 'number', value: 0, min: 0, max: 89, step: 0.5, event: 'input', onchange: function (v) { if (Number.isFinite(v)) fromRefracted(v); } });
      const matSel = UT.dom.field('Wedge material', { tag: 'select', type: 'text', value: String(s.vW), options: [{ value: '2.74', label: 'Perspex 2740 m/s' }, { value: '2.33', label: 'Rexolite 2330 m/s' }, { value: '2.35', label: 'Polystyrene 2350 m/s' }], onchange: function (v) { s.vW = parseFloat(v); fromWedge(true); } });
      const setProbe = function (r) {
        const patch = probePatchFor(r.beyond ? 90 : r.refracted, r.mode);
        patch.wedgeVel = s.vW;
        UT.setIn('probe', patch);
        refreshToolbar();
      };
      const show = function (r) {
        const crit = r.crit;
        const pct = function (a) { return M.clamp(a / 80 * 100, 0, 100); };
        scale.textContent = '';
        scale.style.background = 'linear-gradient(90deg,#cfe8ff 0 ' + pct(crit.first) + '%,#d8f5d0 ' + pct(crit.first) + '% ' + pct(crit.second) + '%,#f5d0d0 ' + pct(crit.second) + '%)';
        scale.appendChild(h('span', { style: { left: pct(crit.first / 2) + '%' } }, 'compression'));
        scale.appendChild(h('span', { style: { left: pct((crit.first + crit.second) / 2) + '%' } }, 'shear'));
        scale.appendChild(h('span', { style: { left: pct((crit.second + 80) / 2) + '%' } }, 'surface'));
        scale.appendChild(h('div', { class: 'crit', style: { left: pct(crit.first) + '%' } }));
        scale.appendChild(h('div', { class: 'crit', style: { left: pct(crit.second) + '%' } }));
        const vC = ((mat && mat.vComp) || UT.consts.V_COMP_STEEL) * 1000, vS = ((mat && mat.vShear) || UT.consts.V_SHEAR_STEEL) * 1000;
        readout.textContent =
          'Wedge angle            : ' + s.wedge.toFixed(1) + '°   (wedge velocity ' + Math.round(s.vW * 1000) + ' m/s)\n' +
          '1st critical angle     : ' + crit.first.toFixed(1) + '°   (compression wave, ' + Math.round(vC) + ' m/s)\n' +
          '2nd critical angle     : ' + crit.second.toFixed(1) + '°   (shear wave, ' + Math.round(vS) + ' m/s)\n' +
          (r.beyond ? 'Beyond 2nd critical: surface (Rayleigh) wave only — no bulk wave in steel\n'
            : (r.mode === 'comp' ? 'Compression wave angle : ' + r.refracted.toFixed(1) + '°' + (r.shearToo !== null && r.shearToo !== undefined ? '   (shear also present at ' + r.shearToo.toFixed(1) + '°)' : '') + '\n'
              : 'Shear wave angle       : ' + r.refracted.toFixed(1) + '°   (compression wave totally reflected)\n')) +
          'sin(θ wedge)/v wedge = sin(θ steel)/v steel   (Snell)';
        readout.classList.toggle('dlg-warn', !!r.beyond);

      const fromWedge = function (apply) {

        s.wedge = +UT.probe.wedgeAngleFor(M.clamp(a, 0, 89.9), mode, s.vW, mat).toFixed(1);
        const r = wedgeToRefracted(s.wedge, s.vW, mat);
        slider.input.value = s.wedge;
        show(r);
        setProbe(r);
      };
      const presetBtn = function (a) { return UT.dom.button(a + '°', function () { setAngle(a); s.wedge = +UT.probe.derive(st().probe, st().specimen).wedgeAngle.toFixed(1); fromWedge(false); }, { class: 'btn small' }); };
      fromWedge(false);
      return h('div', {}, [
        matSel, slider, scale, refIn, readout,
        h('div', { class: 'dlg-note' }, '슬라이더로 웨지 각도를 바꾸면 스넬의 법칙에 따라 강재 내 굴절각과 파 모드(종파/횡파)가 즉시 바뀝니다. 상태 표시줄의 물리 라인을 확인하세요.'),
        h('div', { class: 'btn-row' }, [presetBtn(0), presetBtn(45), presetBtn(60), presetBtn(70), UT.dom.button('Close', function () { win.close(); }, { class: 'btn primary' })]),
      ]);
    });
  }

      ['+ / −', 'Gain ±1 dB (Shift: ±6 dB) / 감도'], ['R', 'Range 50 → 100 → 200 → 400 mm / 범위'], ['F', 'Freeze / 화면 고정'], ['P', 'Peak memory / 피크 메모리'],
      ['H', 'Hide defects & beam / 결함·빔 숨기기'], ['B', 'Beam on/off / 빔 표시'], ['1 2 3 4', 'Probe 0° / 45° / 60° / 70° / 탐촉자 선택'], ['Esc', 'Close the top window or menu / 창 닫기'],
      ['▲▼◀▶ (instrument focused)', 'Adjust the selected instrument parameter / 선택한 파라미터 조정'], ['Mouse wheel', 'Over the cross-section: gain ±1 dB; over the instrument: selected parameter'],
    ];
    textWin('keys', 'Keyboard Shortcuts', 520, [h('table', {}, rows.map(function (r) { return h('tr', {}, [h('td', {}, h('kbd', {}, r[0])), h('td', {}, r[1])]); }))]);
  }
  /** Export dialog: shows a canvas as a PNG data URL inside an <img> (no download links). */
  function openExport(canvasId) {
    dialog('export', 'Export PNG', 760, function (win) {
      const img = h('img', { class: 'export-img', alt: 'export' });
      const note = h('div', { class: 'dlg-note' }, 'Right-click the image and choose "Save image as…" / 이미지를 우클릭하여 저장하세요.');
      const load = function (id) {
        const cv = byId(id);
        if (!cv || typeof cv.toDataURL !== 'function') { note.textContent = 'Canvas #' + id + ' is not available.'; img.removeAttribute('src'); return; }
        try { img.src = cv.toDataURL('image/png'); note.textContent = 'Right-click the image and choose "Save image as…" / 이미지를 우클릭하여 저장하세요.  (' + id + ')'; }
        catch (e) { note.textContent = 'Export failed: ' + e.message; }
      };
      load(canvasId || 'cv-ascan');
      return h('div', {}, [
        h('div', { class: 'btn-row left' }, [
          UT.dom.button('A-scan', function () { load('cv-ascan'); }, { class: 'btn small' }),
          UT.dom.button('Cross section', function () { load('cv-cross'); }, { class: 'btn small' }),
          UT.dom.button('Plan view', function () { load('cv-plan'); }, { class: 'btn small' }),
        ]),
        img, note,
        h('div', { class: 'btn-row' }, [UT.dom.button('Close', function () { win.close(); }, { class: 'btn primary' })]),
      ]);
    });
  }
  function openExportDefects() {
    dialog('export-defects', 'Export Defects', 520, function (win) {
      const ta = h('textarea', { class: 'dlg-textarea', readonly: true });
      ta.value = JSON.stringify(st().defects, null, 1);
      return h('div', {}, [h('div', { class: 'dlg-note' }, 'Copy this JSON to keep the defects (Defects ▸ Import Defects… pastes it back). / JSON을 복사해 두세요.'), ta,
        h('div', { class: 'btn-row' }, [UT.dom.button('Select all', function () { ta.select(); }), UT.dom.button('Close', function () { win.close(); }, { class: 'btn primary' })])]);
    });
  }
  function openImportDefects() {
    dialog('import-defects', 'Import Defects', 520, function (win) {
      const ta = h('textarea', { class: 'dlg-textarea', placeholder: '[ { "type": "planar", "pts": [ {"x": 0, "y": 17}, {"x": 0, "y": 20} ], "zFrom": 120, "zTo": 150 } ]' });
      const doImport = function () {
        try {
          const arr = JSON.parse(ta.value);
          if (!Array.isArray(arr)) throw new Error('expected a JSON array');
          const defects = has('specimens.normaliseDefects') ? UT.specimens.normaliseDefects(arr) : arr;
          UT.set({ defects });
          win.close();
        } catch (e) { UT.dom.alert('Invalid defect JSON: ' + e.message, 'Import Defects'); }
      };
      return h('div', {}, [h('div', { class: 'dlg-note' }, 'Paste defect JSON (as produced by Export Defects / Save Def). / 결함 JSON을 붙여넣으세요.'), ta,
        h('div', { class: 'btn-row' }, [UT.dom.button('Import', doImport, { class: 'btn primary' }), UT.dom.button('Cancel', function () { win.close(); })])]);
    });
  }

  // ------------------------------------------------------------------ file menu / layout reset
  function fileNew() {
    confirmDlg('Reset everything to the default setup? (defects, probe, instrument, weld)', { title: 'New' }).then(function (ok) {
      if (!ok) return;
      try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
      mem.suspendSave = true;
      const def = UT.defaultState();
      UT.set(def, { noRender: true });
      mem.suspendSave = false;
      enterMode('weld', { keepProbe: false });
      if (!st().specimen) enterMode('weld');
      call('instruments.setSkin', [st().utSet]);
      applyLayout();
      refreshToolbar();
      UT.renderNow();
    });
  }
  function fileLoad() {
    const patch = restore();
    if (!patch) { UT.dom.alert('No saved setup found in this browser.\n저장된 설정이 없습니다.', 'Load Setup'); return; }
    UT.set(patch, { noRender: true });
    enterMode('weld', { keepProbe: true });
    call('instruments.setSkin', [st().utSet]);
    applyLayout();
    refreshToolbar();
    UT.renderNow();
  }
  function resetLayout() {
    for (const k of Object.keys(UT.dom.wins)) { const w = UT.dom.wins[k]; if (w && w.isOpen() && !w.el.classList.contains('modal')) { try { w.close(); } catch (e) { /* ignore */ } } }
    const d = UT.defaultState().display;
    setDisplay({ plan: d.plan, pipe3d: d.pipe3d, legend: d.legend, beam: d.beam, hide: false });
    if (st().utSet === 'usk7') call('instruments.setSkin', ['usk7']);
    if (st().weldOpts && st().weldOpts.pipe) showPipe3d(true);
    applyLayout();
    refreshToolbar();
  }

  // ------------------------------------------------------------------ language
  /**
   * Switch UI language ('en' | 'ko'): relabels the menus, re-renders the status hints, emits 'lang'.
   * @param {string} lang
   */
  function setLang(lang) {
    const l = lang === 'ko' ? 'ko' : 'en';
    mem.lang = l;
    if (UT.i18n) UT.i18n.lang = l;
    const d = doc();
    if (d && mem.built) {
      for (const el of d.querySelectorAll('#menubar [data-key].menu-label')) el.textContent = t(el.dataset.key);
      closeMenus();
      renderStatus(st().status);
    }
    UT.bus.emit('lang', l);
    scheduleSave(['lang']);
  }

  // ------------------------------------------------------------------ persistence
  /** Build the JSON-serialisable persistence record for a state (pure; used by saveNow and __selftest). */
  function buildSavePatch(s, lang) {
    const ins = {};
    for (const k of INSTR_KEYS) if (s.instrument && s.instrument[k] !== undefined) ins[k] = s.instrument[k];
    return UT.clone({ v: 1, probe: s.probe, instrument: ins, display: s.display, defects: s.defects || [], weldOpts: s.weldOpts, utSet: s.utSet, lang: lang || 'en' });
  }
  /** Turn a stored record into a UT.set patch (validated, merged over the defaults); null when unusable. */
  function patchFromRecord(rec) {
    if (!rec || typeof rec !== 'object' || rec.v !== 1) return null;
    const def = UT.defaultState();
    const patch = {};
    if (rec.probe && typeof rec.probe === 'object') patch.probe = Object.assign({}, def.probe, rec.probe);
    if (rec.instrument && typeof rec.instrument === 'object') {
      const ins = Object.assign({}, def.instrument);
      for (const k of INSTR_KEYS) if (rec.instrument[k] !== undefined) ins[k] = rec.instrument[k];
      if (!Array.isArray(ins.gates) || ins.gates.length < 2) ins.gates = def.instrument.gates;
      if (!ins.dac || typeof ins.dac !== 'object') ins.dac = def.instrument.dac;
      if (!ins.cal || typeof ins.cal !== 'object') ins.cal = def.instrument.cal;
      if (!ins.trig || typeof ins.trig !== 'object') ins.trig = def.instrument.trig;
      ins.gain = M.clamp(+ins.gain || 0, 0, 110);
      ins.range = M.clamp(+ins.range || 100, 10, 1000);
      patch.instrument = ins;
    }
    if (rec.display && typeof rec.display === 'object') patch.display = Object.assign({}, def.display, rec.display);
    if (Array.isArray(rec.defects)) patch.defects = has('specimens.normaliseDefects') ? UT.specimens.normaliseDefects(rec.defects) : rec.defects;
    if (rec.weldOpts && typeof rec.weldOpts === 'object') patch.weldOpts = Object.assign({}, def.weldOpts, rec.weldOpts);
    if (rec.utSet === 'epoch600' || rec.utSet === 'epoch4' || rec.utSet === 'usk7') patch.utSet = rec.utSet;
    if (rec.lang === 'ko' || rec.lang === 'en') patch.__lang = rec.lang;
    return patch;
  }
  function restore() {
    try {
      if (typeof localStorage === 'undefined') return null;
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      const patch = patchFromRecord(JSON.parse(raw));
      if (patch && patch.__lang) { mem.lang = patch.__lang; if (UT.i18n) UT.i18n.lang = patch.__lang; delete patch.__lang; }
      return patch;
    } catch (e) { console.warn('[UT.app] restore failed', e); return null; }
  }
  /** Write the persistence record now (no debounce). Skipped while a trade test is active. */
  function saveNow() {
    if (mem.saveTimer) { clearTimeout(mem.saveTimer); mem.saveTimer = null; }
    if (st().trade && st().trade.active) return false;
    try {
      if (typeof localStorage === 'undefined') return false;
      localStorage.setItem(STORE_KEY, JSON.stringify(buildSavePatch(st(), mem.lang)));
      return true;
    } catch (e) { console.warn('[UT.app] save failed', e); return false; }
  }
  function scheduleSave(keys) {
    if (mem.suspendSave || !mem.booted) return;
    if (!keys.some(function (k) { return PERSIST_KEYS.indexOf(k) >= 0 || k === 'lang'; })) return;
    if (st().trade && st().trade.active) return;
    if (mem.saveTimer) clearTimeout(mem.saveTimer);
    mem.saveTimer = setTimeout(function () { mem.saveTimer = null; saveNow(); }, 500);
  }

  // ------------------------------------------------------------------ boot
  function runSelftests() {
    const out = {};
    for (const k of Object.keys(UT)) {
      const m = UT[k];
      if (m && typeof m.__selftest === 'function') { try { out[k] = m.__selftest(); } catch (e) { out[k] = ['exception ' + e.message]; } }
      if (k === 'views' && m) for (const v of Object.keys(m)) if (m[v] && typeof m[v].__selftest === 'function') { try { out['views.' + v] = m[v].__selftest(); } catch (e) { out['views.' + v] = ['exception ' + e.message]; } }
    }
    for (const k of Object.keys(out)) console.log('[selftest] ' + k + ': ' + (out[k].length ? 'FAIL ' + JSON.stringify(out[k]) : 'ok'));
    return out;
  }
  /**
   * Boot sequence (§15.9): restore → buildLayout → instruments.mount → view inits → enter weld → renderNow.
   * Safe to call once; guarded against missing modules.
   */
  function boot() {
    if (mem.booted) return;
    UT.i18n && UT.i18n.add && UT.i18n.add('ko', KO);
    let patch = null;
    try { patch = restore(); } catch (e) { patch = null; }
    if (patch) { try { UT.set(patch, { silent: true, noRender: true }); } catch (e) { console.warn('[UT.app] restore apply failed', e); } }
    buildLayout();
    try { if (has('instruments.mount')) UT.instruments.mount(mem.els.instrument); } catch (e) { console.error('[UT.app] instruments.mount', e); }
    try { if (has('views.cross.init')) UT.views.cross.init(mem.els.cvCross); } catch (e) { console.error('[UT.app] views.cross.init', e); }
    try { if (has('views.cross.initRuler')) UT.views.cross.initRuler(mem.els.cvRuler); } catch (e) { console.error('[UT.app] views.cross.initRuler', e); }
    try { if (has('views.plan.init')) UT.views.plan.init(mem.els.cvPlan); } catch (e) { console.error('[UT.app] views.plan.init', e); }
    try { if (has('views.plotter.init')) UT.views.plotter.init(mem.els.cvPlotter); } catch (e) { console.error('[UT.app] views.plotter.init', e); }
    try { if (has('views.pipe3d.init')) UT.views.pipe3d.init(); } catch (e) { console.error('[UT.app] views.pipe3d.init', e); }
    mem.booted = true;
    try { enterMode('weld', { keepProbe: true }); } catch (e) { console.error('[UT.app] modes.enter', e); }
    if (!st().specimen && has('specimens.plateWeld')) {
      const o = st().weldOpts || {};
      UT.set({ specimen: o.pipe && UT.specimens.pipeWeld ? UT.specimens.pipeWeld(o) : UT.specimens.plateWeld(o) }, { noRender: true });
    }
    if (st().weldOpts && st().weldOpts.pipe && st().display.pipe3d !== false) showPipe3d(true);
    applyLayout();
    refreshToolbar();
    try { UT.renderNow(); } catch (e) { console.error('[UT.app] renderNow', e); }
    renderStatus(st().status);
    if (typeof location !== 'undefined' && location.hash === '#selftest') runSelftests();
  }

  // ------------------------------------------------------------------ public API + test API
  Object.assign(app, {
    boot, buildLayout, setLang, saveNow, applyLayout, refreshToolbar, menuByPath, activateToolbar, runSelftests,
    toolbarIds: TB_IDS, restore, patchFromRecord, buildSavePatch, parseSteps, wedgeToRefracted, probePatchFor, OD_INCH,
    openWeld, openWedge, openOptions, openStepWedge, openAbout, openGuide, openKeys, openExport, closeMenus,
    /** Headless self test (pure helpers only). */
    __selftest() {
      const f = [];
      try {
        const probes = menuModel().find(function (m) { return m.id === 'menu-probes'; }).items.map(function (i) { return i.key; });
        const want = ['Adjust Angle in Wedge (Shoe)', 'Zero Probe - Twin or Single Crystal', 'Pulse Echo', 'Through Transmission', 'Tandem (pitch catch)', '2.5 MHz Frequency', '5 MHz Frequency', 'Probe Diameter 10mm', 'Probe Diameter 5mm', 'Phased Array Probe', 'Colour Code Display', 'Number of Skips', 'Single Line Beam', 'Focus Beam'];
        if (probes.join('|') !== want.join('|')) f.push('Probes menu order: ' + probes.join('|'));
        const ids = menuModel().map(function (m) { return m.id; }).join(',');
        if (ids !== 'menu-file,menu-probes,menu-stepwedge,menu-weld,menu-defects,menu-options,menu-help') f.push('menu ids ' + ids);
        if (TB_IDS.length !== 19 || TB_IDS[0] !== 'tb-0' || TB_IDS[18] !== 'tb-aut') f.push('toolbar ids ' + TB_IDS.join(','));
        const rec = buildSavePatch(UT.defaultState(), 'ko');
        if (rec.v !== 1 || rec.instrument.freeze !== undefined || rec.instrument.gain !== 30 || rec.lang !== 'ko') f.push('buildSavePatch');
        const p = patchFromRecord(rec);
        if (!p || p.instrument.gain !== 30 || p.utSet !== 'epoch600' || p.__lang !== 'ko' || !p.probe) f.push('patchFromRecord');
        if (patchFromRecord({ v: 2 }) !== null || patchFromRecord('x') !== null) f.push('patchFromRecord rejects');
        if (parseSteps('25, 5,10 ,15;20 20').join(',') !== '5,10,15,20,25') f.push('parseSteps');
        const r = wedgeToRefracted(47.1, 2.74, null);
        if (r.mode !== 'shear' || Math.abs(r.refracted - 60) > 0.2) f.push('wedge 47.1 -> ' + r.refracted + ' ' + r.mode);
        const rc = wedgeToRefracted(20, 2.74, null);
        if (rc.mode !== 'comp' || Math.abs(rc.refracted - 47.4) > 0.3) f.push('wedge 20 comp -> ' + rc.refracted);
        if (!wedgeToRefracted(70, 2.74, null).beyond) f.push('beyond 2nd critical');
        if (Math.abs(r.crit.first - 27.7) > 0.1 || Math.abs(r.crit.second - 57.7) > 0.1) f.push('critical angles');
        if (probePatchFor(60.02, 'shear').angle !== 60 || probePatchFor(55.26, 'shear').angle !== 55.3 || probePatchFor(0, 'comp').mode !== 'comp') f.push('probePatchFor');
        if (OD_INCH[6] !== 168.3 || inchOf(219.1) !== '8' || inchOf(200) !== 'custom') f.push('OD table');
        const mid = midParts(null);
        if (!/^Pos: /.test(mid[0]) || !/^Range /.test(mid[1]) || !/^AMP= /.test(mid[2])) f.push('midParts ' + mid.join('|'));
        if (KO['Adjust Angle in Wedge (Shoe)'] === undefined) f.push('KO dictionary');
      } catch (e) { f.push('exception ' + (e && e.message)); }
      return f;
    },
  });
  UT.app = app;

  Object.assign(UT.test, {
    /** Click a toolbar button by id ('tb-60'); false when missing or disabled. */
    click(id) { return activateToolbar(String(id).indexOf('tb-') === 0 ? String(id) : 'tb-' + id); },
    /** Run a menu item by its English label path; false when missing or disabled. */
    menu(path) { return menuByPath(path); },
  });

  if (typeof document !== 'undefined' && document && typeof document.addEventListener === 'function') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { boot(); });
    else setTimeout(boot, 0);
  }
})(window.UT = window.UT || {});

</script>
</body>
